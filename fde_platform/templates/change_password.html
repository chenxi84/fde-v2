{% extends "base.html" %}
{% block title %}修改密码 · FDE 平台{% endblock %}
{% block content %}
<div class="login-wrap">
  <aside class="brand-wall">
    <div class="bw-logo">FDE<em>·</em>PLATFORM</div>
    <div class="bw-sub">FORWARD&nbsp;DEPLOYED&nbsp;ENGINEERING</div>
    <p class="bw-desc">首次登录请修改默认密码，确保账户安全。</p>
  </aside>
  <div class="card login-card">
    <h3>修改密码</h3>
    <div class="muted" style="margin-bottom:6px">当前用户：<strong>{{ username }}</strong></div>
    {% if error %}<p class="err" style="margin:6px 0">{{ error }}</p>{% endif %}
    <form method="post" action="/change-password">
      <input type="hidden" name="next" value="{{ next }}">
      <label>当前密码</label>
      <input type="password" name="old_password" autofocus required>
      <label>新密码（至少 6 位）</label>
      <input type="password" name="new_password" required>
      <label>确认新密码</label>
      <input type="password" name="new_password2" required>
      <button type="submit">保存新密码</button>
    </form>
  </div>
</div>
{% endblock %}
