{% extends "base.html" %}
{% block title %}应用组 · FDE 平台{% endblock %}
{% block bodyclass %}home-bleed{% endblock %}
{% block content %}
  <div class="col">
    <!-- ── 平台运行情况（本次启动已加载的组件）── -->
    <div class="section-title">平台运行情况 <span class="muted">本次启动已加载的组件 · 点击查看详情</span></div>
    <div x-data="homeComponents()">
      <div class="muted reveal" style="margin:6px 0 12px; font-size:13px; display:flex; gap:8px; flex-wrap:wrap; align-items:center">
        <b x-text="'FDE ' + runtime.version"></b>
        <span class="mono" x-text="runtime.url"></span>
        <span>· 数据库</span>
        <span x-text="runtime.db"></span>
        <span>·</span>
        <span x-text="runtime.apps + ' 个应用'"></span>
      </div>
      <div class="reveal" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px; margin:12px 0">
        <template x-for="(c, i) in components" :key="c.key">
          <div style="border:1px solid var(--line); border-radius:12px; padding:16px 12px; text-align:center; cursor:pointer; background:#fff; display:flex; flex-direction:column; align-items:center; gap:7px" @click="idx = i">
            <span style="font-size:30px" x-text="c.icon"></span>
            <span style="font-weight:600; font-size:13.5px" x-text="c.name"></span>
            <span class="st" :class="c.loaded ? 'st-teal' : 'st-slate'" x-text="c.loaded ? '✓ 已加载' : '✗ 未加载'"></span>
          </div>
        </template>
      </div>
      <div class="modal-mask" style="align-items:center; padding:24px" x-show="idx !== null" @click.self="idx = null" @keydown.escape.window="idx = null" x-cloak>
        <div class="modal">
          <div class="modal-hd">
            <div><div class="docno" x-text="idx !== null ? components[idx].name : ''"></div>
              <div class="sub">平台组件 · 功能说明</div></div>
            <button class="x" @click="idx = null">✕</button>
          </div>
          <div class="modal-bd">
            <div class="muted" style="line-height:1.7" x-text="idx !== null ? components[idx].desc : ''"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── 应用组（图标卡 + 点击进 dashboard + 详情模态）── -->
    <div class="section-title">应用组 · 选择进入</div>
    <div x-data="homeGroups()">
      <div class="reveal" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; margin:12px 0">
        <template x-for="(g, gi) in groups" :key="g.key">
          <div style="border:1px solid var(--line); border-radius:12px; padding:16px 12px; text-align:center; cursor:pointer; background:#fff; display:flex; flex-direction:column; align-items:center; gap:7px" @click="openDetail(gi)">
            <span style="font-size:30px">📱</span>
            <span style="font-weight:600; font-size:14px" x-text="g.name"></span>
            <span class="muted" style="font-size:12px" x-text="g.app_count + ' 个应用'"></span>
            <button class="b-pri b-sm" @click.stop="enterGroup(g)">进入应用</button>
          </div>
        </template>
      </div>
      <div class="modal-mask" style="align-items:center; padding:24px" x-show="idx !== null" @click.self="idx = null" @keydown.escape.window="idx = null" x-cloak>
        <div class="modal">
          <div class="modal-hd">
            <div><div class="docno" x-text="idx !== null ? groups[idx].name : ''"></div>
              <div class="sub" x-text="idx !== null ? groups[idx].app_count + ' 个应用' : ''"></div></div>
            <button class="x" @click="idx = null">✕</button>
          </div>
          <div class="modal-bd">
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px">
              <template x-for="a in (idx !== null ? groups[idx].apps : [])" :key="a">
                <a :href="'/app/' + a" style="border:1px solid var(--line); border-radius:10px; padding:10px 6px; text-align:center; text-decoration:none; color:inherit; background:#fff; display:flex; flex-direction:column; align-items:center; gap:5px">
                  <span style="font-size:22px">📦</span>
                  <span style="font-size:12px" x-text="a.split('/').pop()"></span>
                </a>
              </template>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>

    <!-- ── 平台级 Agent（右侧固定栏，复用 agent_rail 组件，默认展开、可收起，状态持久化）── -->
    <div x-data="homeAgent()">
      <button class="agent-toggle home-agent-toggle" :class="{ on: open }" @click="toggle()"
        title="打开/收起 Agent 右栏">✦ Agent</button>
      <aside class="agent-rail" x-show="open" x-cloak>
        <div x-data="agentRail()" x-html="tpl"></div>
      </aside>
    </div>

    <script type="module">
      import Alpine from "/view/lib/alpine.esm.js";
      import { agentRail } from "/view/pages/agent_rail.js";
      window.Alpine = Alpine;
      Alpine.data("agentRail", agentRail);
      Alpine.data("homeAgent", () => ({
        open: (localStorage.getItem("fde.agent.rail") || "1") === "1",
        toggle() {
          this.open = !this.open;
          localStorage.setItem("fde.agent.rail", this.open ? "1" : "0");
        },
      }));
      Alpine.data("homeComponents", () => ({
        components: {{ components|tojson }},
        runtime: {{ runtime_info|tojson }},
        idx: null,
      }));
      Alpine.data("homeGroups", () => ({
        groups: {{ groups|tojson }},
        idx: null,
        enterGroup(g) { location.href = "/view/" + g.key + "/"; },
        openDetail(i) { this.idx = i; },
      }));
      Alpine.start();
    </script>
  </div>
{% endblock %}
