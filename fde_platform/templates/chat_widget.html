{# Agent 对话组件（含会话列表 + 历史持久化）。
   入参：chat_base（API 前缀，如 /api/agent 或 /api/apps/<名>/agent）、
         chat_scope（会话作用域标识，platform 或应用名）、
         chat_greeting（首屏问候语）、chat_placeholder（输入框占位）。
   依赖 base.html 的 .msg/.bubble/.chat-input/.tools-log 样式。 #}
<div class="card">
  <div style="display:flex; gap:12px; align-items:stretch">
    <div class="cw-side">
      <button id="cw-new" type="button" class="cw-new-btn">＋ 新建对话</button>
      <div id="cw-list"></div>
    </div>
    <div style="flex:1; min-width:0">
      <div id="cw-chat"></div>
      <div class="chat-input">
        <input type="text" id="cw-input" placeholder="{{ chat_placeholder }}">
        <button id="cw-send" type="button">发送</button>
      </div>
      <div class="muted" style="margin-top:6px">对话已持久化（切页面/重启不丢），按登录用户隔离。</div>
    </div>
  </div>
</div>
<style>
  #cw-chat { border:1px solid var(--line); border-radius:8px; padding:10px; height:280px;
             overflow:auto; background:#fafafa; }
  .cw-side { width:200px; flex:none; display:flex; flex-direction:column;
             border-right:1px solid var(--line); padding-right:10px; }
  .cw-new-btn { margin-bottom:8px; }
  #cw-list { overflow:auto; max-height:300px; }
  .cw-item { display:flex; align-items:center; justify-content:space-between; gap:6px;
             padding:5px 8px; border-radius:6px; font-size:13px; cursor:pointer; }
  .cw-item:hover { background:#eef1ec; }
  .cw-item.active { background:var(--prime-soft); }
  .cw-item .cw-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .cw-item .cw-del { color:#94a3b8; text-decoration:none; font-size:12px; }
  .cw-item .cw-del:hover { color:#dc2626; }
  .cw-elapsed { color:#94a3b8; font-weight:normal; }
  .cw-cur { font-size:12px; color:#64748b; margin-top:4px; }
</style>
<script>
(function () {
  const BASE = {{ chat_base|tojson }};
  const SCOPE = {{ chat_scope|tojson }};
  const LS_KEY = "fde.chat.sid." + SCOPE;
  const chat = document.getElementById("cw-chat");
  const listEl = document.getElementById("cw-list");
  let currentSid = localStorage.getItem(LS_KEY) || null;
  let sending = false;   // 发送中标记：防止初始化 selectSession 覆盖首次对话刚 push 的消息

  async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    const res = await fetch(BASE + path, opts);
    if (res.status === 401) { location.href = "/login"; return null; }
    return res.json();
  }

  function bubble(who, text, toolsLog) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    const w = document.createElement("div");
    w.className = "who";
    w.textContent = who === "user" ? "你" : "Agent";
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text || "（无内容）";
    div.appendChild(w); div.appendChild(b);
    if (toolsLog) {
      const t = document.createElement("div");
      t.className = "tools-log";
      t.textContent = toolsLog;
      div.appendChild(t);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  /* 工具名提取：兼容 live 扁平形 {tool} 与存储历史 OpenAI 形 {function:{name}}（防 [object Object]）；
     并做 qualname 美化：demo03__sales_order__create → sales_order.create */
  function toolDispOf(t) {
    const name = (typeof t === "string") ? t
      : ((t && (t.tool || (t.function && t.function.name) || t.name)) || "");
    const parts = String(name).split("__");
    return parts.length >= 3 ? parts.slice(-2).join(".") : name;
  }

  function toolsLogOf(m) {
    if (m.tool_calls && m.tool_calls.length) {
      return "调用了 " + m.tool_calls.length + " 个工具：" +
             m.tool_calls.map(toolDispOf).filter(Boolean).join("、");
    }
    return "";
  }

  function renderMessages(msgs) {
    if (sending) return;   // 发送中不覆盖，避免初始化 selectSession 清空首次对话消息
    chat.innerHTML = "";
    const visible = msgs.filter(m => m.role === "user" || m.role === "assistant");
    if (!visible.length) {
      bubble("bot", {{ chat_greeting|tojson }});
      return;
    }
    visible.forEach(m => {
      bubble(m.role === "user" ? "user" : "bot", m.content, toolsLogOf(m));
    });
  }

  function markActive() {
    listEl.querySelectorAll(".cw-item").forEach(el => {
      el.classList.toggle("active", el.dataset.sid === currentSid);
    });
  }

  async function renderSessions() {
    const j = await api("/sessions");
    if (!j) return [];
    const items = j.data || [];
    listEl.innerHTML = "";
    items.forEach(s => {
      const row = document.createElement("div");
      row.className = "cw-item";
      row.dataset.sid = s.session_id;
      const title = document.createElement("span");
      title.className = "cw-title";
      title.textContent = s.title;
      title.title = s.title + "（" + s.updated_at + "）";
      const del = document.createElement("a");
      del.href = "#"; del.className = "cw-del"; del.textContent = "✕";
      del.title = "删除该对话";
      del.onclick = async (e) => {
        e.preventDefault(); e.stopPropagation();
        if (!confirm("删除对话「" + s.title + "」及其全部历史？")) return;
        await api("/sessions/" + encodeURIComponent(s.session_id), { method: "DELETE" });
        if (currentSid === s.session_id) {
          currentSid = null; localStorage.removeItem(LS_KEY);
          chat.innerHTML = ""; bubble("bot", {{ chat_greeting|tojson }});
        }
        renderSessions();
      };
      row.appendChild(title); row.appendChild(del);
      row.onclick = () => selectSession(s.session_id);
      listEl.appendChild(row);
    });
    markActive();
    return items;
  }

  async function selectSession(sid) {
    currentSid = sid;
    localStorage.setItem(LS_KEY, sid);
    markActive();
    const j = await api("/sessions/" + encodeURIComponent(sid) + "/messages");
    if (j && j.status === "ok") renderMessages(j.data);
  }

  async function newSession() {
    const j = await api("/sessions", { method: "POST" });
    if (!j || j.status !== "ok") return;
    currentSid = j.data.session_id;
    localStorage.setItem(LS_KEY, currentSid);
    chat.innerHTML = "";
    bubble("bot", {{ chat_greeting|tojson }});
    await renderSessions();
  }

  function pendingBubble() {
    const div = document.createElement("div");
    div.className = "msg bot";
    const w = document.createElement("div");
    w.className = "who";
    w.textContent = "Agent";
    const b = document.createElement("div");
    b.className = "bubble";
    const s1 = document.createElement("div");
    s1.textContent = "执行中";
    const el = document.createElement("span");
    el.className = "cw-elapsed";
    s1.appendChild(el);
    const cur = document.createElement("div");
    cur.className = "cw-cur";
    b.appendChild(s1); b.appendChild(cur);
    div.appendChild(w); div.appendChild(b);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return { div: div, el: el, cur: cur };
  }

  async function send() {
    const input = document.getElementById("cw-input");
    const msg = input.value.trim();
    if (!msg) return;
    sending = true;
    if (!currentSid) {
      const j = await api("/sessions", { method: "POST" });
      if (!j || j.status !== "ok") return;
      currentSid = j.data.session_id;
      localStorage.setItem(LS_KEY, currentSid);
    }
    input.value = "";
    bubble("user", msg);

    /* 「执行中」占位：耗时计时 + 每 1.5s 轮询阶段进度（当前轮次 / 正在调用的工具） */
    const pb = pendingBubble();
    const t0 = Date.now();
    const timer = setInterval(() => {
      pb.el.textContent = "（" + Math.max(1, Math.round((Date.now() - t0) / 1000)) + "s）";
      chat.scrollTop = chat.scrollHeight;
    }, 1000);
    const sid = currentSid;
    const poller = setInterval(async () => {
      try {
        const pr = await fetch(BASE + "/progress?session_id=" + encodeURIComponent(sid));
        const pj = await pr.json();
        const p = pj && pj.data;
        if (!p) return;
        if (p.phase === "tool" && p.tool) {
          pb.cur.textContent = "→ 正在调用 " + p.tool +
            (p.tools_done ? "（已完成 " + p.tools_done + " 个）" : "");
        } else if (p.phase === "llm") {
          pb.cur.textContent = "→ 第 " + (p.round || 1) + " 轮推理" +
            (p.tools_done ? " · 已完成 " + p.tools_done + " 个工具" : "");
        }
      } catch (e) { /* 轮询失败不影响主流程 */ }
    }, 1500);

    try {
      const res = await fetch(BASE + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, session_id: sid }),
      });
      const j = await res.json();
      clearInterval(timer); clearInterval(poller); pb.div.remove();
      if (j.status !== "ok") { bubble("bot", "出错：" + j.message); return; }
      const d = j.data;
      const log = (d.tool_calls && d.tool_calls.length)
        ? "调用了 " + d.tool_calls.length + " 个工具：" + d.tool_calls.map(toolDispOf).filter(Boolean).join("、")
        : "";
      bubble("bot", d.reply, log);
      renderSessions();  // 刷新标题与排序
    } catch (err) {
      clearInterval(timer); clearInterval(poller); pb.div.remove();
      bubble("bot", "请求失败：" + err);
    } finally {
      sending = false;
    }
  }

  document.getElementById("cw-send").addEventListener("click", send);
  document.getElementById("cw-input").addEventListener("keydown", e => {
    if (e.key === "Enter") send();
  });
  document.getElementById("cw-new").addEventListener("click", newSession);

  /* 初始化：载入会话列表，恢复上次选中的会话（不存在则选最近一条或显示问候） */
  (async () => {
    const items = await renderSessions();
    const ids = new Set(items.map(s => s.session_id));
    if (currentSid && ids.has(currentSid)) {
      await selectSession(currentSid);
    } else if (items.length) {
      await selectSession(items[0].session_id);
    } else {
      bubble("bot", {{ chat_greeting|tojson }});
    }
  })();
})();
</script>
