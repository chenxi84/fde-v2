<!-- 平台告警页：通用告警 -->
<div class="bd">
  <div class="card">
    <div class="hd">
      <h3>告警</h3>
      <span class="hint" x-text="'共 ' + alerts.length + ' 条'"></span>
      <button class="b-ghost b-sm" style="margin-left:auto" @click="load()">↻ 刷新</button>
    </div>
    <div class="bd">
      <!-- 来源过滤 chips -->
      <div class="chips" style="margin-bottom:12px">
        <button class="chip" :class="{ on: !sourceFilter }" @click="sourceFilter = ''">全部</button>
        <template x-for="s in sources" :key="s">
          <button class="chip" :class="{ on: sourceFilter === s }" @click="sourceFilter = s" x-text="s"></button>
        </template>
      </div>

      <template x-if="loading">
        <div class="empty">加载中…</div>
      </template>
      <template x-if="!loading && !filtered.length">
        <div class="empty">暂无告警</div>
      </template>
      <template x-if="!loading && filtered.length">
        <table class="tbl">
          <thead>
            <tr>
              <th>来源</th>
              <th>级别</th>
              <th>标题</th>
              <th>详情</th>
              <th>时间</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="a in filtered" :key="a.title + a.time">
              <tr class="data">
                <td><span class="tag t-slate" x-text="a.source"></span></td>
                <td><span class="tag" :class="'t-' + a.level" x-text="a.level === 'red' ? '严重' : '警告'"></span></td>
                <td x-text="a.title"></td>
                <td class="muted" x-text="a.detail"></td>
                <td class="muted" x-text="a.time"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>
    </div>
  </div>
</div>
