<!-- Agent 右栏（平台级跨应用）—— 窄栏形态：头 + 会话切换 + 消息流 + 输入 -->
<div class="agent-rail-inner">
  <div class="agent-rail-hd">
    <span class="overline" style="margin:0">✦ 平台级 Agent</span>
    <div class="right tagline" style="gap:6px">
      <button class="b-ghost b-sm" @click="newSession()" title="新建会话">＋ 新</button>
      <button class="b-ghost b-sm" @click="delSession()" title="删除当前会话">🗑</button>
    </div>
  </div>

  <select x-model="sid" @change="onSessionChange()" class="agent-rail-sel">
    <option value="">新对话（发送即建）</option>
    <template x-for="s in sessions" :key="s.session_id">
      <option :value="s.session_id" x-text="s.title || '新对话'"></option>
    </template>
  </select>

  <div class="chatbox agent-rail-chat">
    <template x-if="!msgs.length && !sending">
      <div class="empty" style="padding:24px 8px !important">
        我是平台级操作助手，可跨应用编排调用<strong>你有权限</strong>的服务。<br>
        <span class="muted" style="font-size:11px">例如：查一下 M1 的库存推移表并给出补库建议</span>
      </div>
    </template>
    <template x-for="(m, i) in msgs.filter(visible)" :key="i">
      <div class="msg" :class="m.role === 'user' ? 'me' : 'ai'">
        <div class="who" x-text="m.role === 'user' ? '你' : 'Agent'"></div>
        <div class="b" x-text="m.content"></div>
        <template x-if="m.tool_calls && m.tool_calls.length">
          <div style="margin-top:4px">
            <template x-for="(t, ti) in m.tool_calls" :key="ti">
              <span class="tcall" x-text="'⚙ ' + t"></span>
            </template>
          </div>
        </template>
      </div>
    </template>
    <template x-if="sending && live">
      <div class="msg ai"><div class="who">Agent</div>
        <div class="b" x-show="live.content" x-text="live.content"></div>
        <div class="b typing muted" x-show="!live.content" x-text="progress || '思考 / 调用工具中'"></div>
        <template x-if="live.tool_calls && live.tool_calls.length">
          <div style="margin-top:4px">
            <template x-for="(t, ti) in live.tool_calls" :key="ti">
              <span class="tcall" x-text="'⚙ ' + t"></span>
            </template>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- ── 文件面板（折叠，展开时展示当前应用 import/export 文件）── -->
  <div class="fp">
    <button class="fp-hd" @click="toggleFiles()">
      <span>📂 应用文件</span>
      <span class="fp-arrow" :class="{ open: filesOpen }">▾</span>
    </button>
    <div class="fp-body" x-show="filesOpen" x-cloak>
      <template x-if="!hasApp">
        <div class="fp-empty">当前页无关联应用</div>
      </template>
      <template x-if="hasApp && filesLoading">
        <div class="fp-empty">加载中…</div>
      </template>
      <template x-if="hasApp && !filesLoading && !importFiles.length && !exportFiles.length">
        <div class="fp-empty">当前页没有文件</div>
      </template>
      <template x-if="hasApp && !filesLoading && (importFiles.length || exportFiles.length)">
        <div class="fp-sections">
          <!-- 导入文件 -->
          <div class="fp-sec">
            <div class="fp-sec-hd">
              <span class="fp-sec-title">📥 导入文件</span>
              <label class="fp-upload-btn" title="上传到 import-file/">
                + 上传
                <input type="file" multiple style="display:none" @change="onFileUpload($event)">
              </label>
            </div>
            <template x-if="!importFiles.length">
              <div class="fp-empty-sm">暂无文件</div>
            </template>
            <template x-for="f in importFiles" :key="f.name">
              <div class="fp-row">
                <span class="fp-name" :title="f.name" x-text="f.name"></span>
                <span class="fp-meta" x-text="fmtSize(f.size)"></span>
                <a class="fp-act" :href="`/api/apps/${resolveUploadApp()}/files/import-file/${encodeURIComponent(f.name)}`"
                   title="下载">⬇</a>
                <button class="fp-act" @click="deleteFile('import-file', f.name)" title="删除">🗑</button>
              </div>
            </template>
          </div>
          <!-- 导出文件 -->
          <div class="fp-sec">
            <div class="fp-sec-hd">
              <span class="fp-sec-title">📤 导出文件</span>
            </div>
            <template x-if="!exportFiles.length">
              <div class="fp-empty-sm">暂无文件</div>
            </template>
            <template x-for="f in exportFiles" :key="f.name">
              <div class="fp-row">
                <span class="fp-name" :title="f.name" x-text="f.name"></span>
                <span class="fp-meta" x-text="fmtSize(f.size)"></span>
                <a class="fp-act" :href="`/api/apps/${resolveUploadApp()}/files/export-file/${encodeURIComponent(f.name)}`"
                   title="下载">⬇</a>
                <button class="fp-act" @click="deleteFile('export-file', f.name)" title="删除">🗑</button>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <div class="agent-rail-input">
    <textarea x-model="input" rows="4" @keydown.enter.prevent="send()"
      placeholder="告诉 Agent 要做什么（Enter 发送）…"></textarea>
    <input type="file" id="agent-rail-file" multiple style="display:none" @change="onAttachChange($event)">
    <div class="agent-rail-actions">
      <button class="b-ghost" :disabled="uploading" @click="attachFile()"
        title="上传附件（csv/xlsx/txt 等；解析不了的由 Agent 告知）">📎 上传文件</button>
      <button class="b-pri" :disabled="sending || !input.trim()" @click="send()">发送</button>
    </div>
  </div>
</div>
