<!-- 平台智能体总览：编排器 + 角色定义（只读）+ skill + 定时任务 + 运行时团队 -->
<div class="bd">
  <div class="card">
    <div class="hd">
      <h3>编排器</h3>
      <span class="hint">平台唯一顶层 agent · 用户直接对话的入口</span>
    </div>
    <div class="bd">
      <div style="padding:8px 0">
        <div><b x-text="leader.label"></b> <span class="tag t-teal">编排器</span></div>
        <div class="muted" style="margin-top:6px" x-text="leader.description"></div>
        <div class="muted" style="margin-top:8px; font-size:12px">
          <template x-for="(c, i) in leader.capabilities" :key="i">
            <div x-text="'· ' + c"></div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="hd">
      <h3>智能体角色</h3>
      <span class="hint" x-text="'共 ' + roles.length + ' 个角色 · 开发时定义（只读）'"></span>
    </div>
    <div class="bd">
      <div class="role-grid">
        <template x-for="r in roles" :key="r.type">
          <div class="role-card">
            <div class="role-hd">
              <span class="role-name" x-text="r.label"></span>
              <span class="tag" :class="r.kind === '平台' ? 't-amber' : 't-teal'" x-text="r.kind"></span>
              <span class="tag t-slate" x-text="r.group ? r.group + ' 组' : '跨组'"></span>
            </div>
            <div class="role-type" x-text="r.type"></div>
            <div class="role-desc" x-text="r.description"></div>
            <div class="role-bind">
              <template x-if="r.apps.length">
                <div x-text="'绑定应用：' + r.apps.map(appShort).join('、')"></div>
              </template>
              <template x-if="r.tools.length">
                <div x-text="'绑定工具：' + r.tools.map(toolShort).join('、')"></div>
              </template>
            </div>
            <button class="b-ghost b-sm" style="margin-top:8px" @click="toggleRole(r.type)"
              x-text="openRole === r.type ? '收起功能概述' : '查看功能概述'"></button>
            <template x-if="openRole === r.type">
              <pre style="margin-top:8px; padding:10px; background:#f8f9fb; border:1px solid var(--line);
                border-radius:6px; font-size:12px; white-space:pre-wrap; word-break:break-word"
                x-text="r.system_prompt"></pre>
            </template>
          </div>
        </template>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="hd">
      <h3>运行时状态</h3>
      <button class="b-ghost b-sm" style="margin-left:auto" @click="refresh()">↻ 刷新</button>
    </div>
    <div class="bd">
      <div class="runtime-stats">
        <span class="stat"><b x-text="runtime.session_count"></b> 会话</span>
        <span class="stat"><b x-text="runtime.agent_count"></b> Agent</span>
        <span class="stat"><b x-text="runtime.teams.length"></b> 活跃团队</span>
      </div>
      <template x-if="!runtime.teams.length">
        <div class="empty">暂无活跃团队 —— 在 Agent 对话中发起「组建团队」后此处可见</div>
      </template>
      <template x-for="(t, ti) in runtime.teams" :key="t.leader_session">
        <div class="team-row">
          <span class="team-leader" x-text="'团队 ' + (ti + 1)"></span>
          <span class="team-members">
            <template x-for="m in t.members" :key="m.session_id">
              <span class="tag t-teal" x-text="m.name"></span>
            </template>
          </span>
        </div>
      </template>
    </div>
  </div>

  <div class="card">
    <div class="hd">
      <h3>已沉淀技能库</h3>
      <span class="hint" x-text="'共 ' + skills.length + ' 个 · 经人工审批发布 · 触发条件匹配时智能体优先遵循'"></span>
    </div>
    <div class="bd">
      <template x-if="!skills.length">
        <div class="empty">暂无已沉淀技能 —— Agent 完成任务后可提议沉淀（platform_propose_skill）</div>
      </template>
      <template x-for="s in skills" :key="s.name">
        <div style="padding:8px 0; border-bottom:1px solid var(--line)">
          <div><b x-text="s.name"></b></div>
          <div class="muted" style="font-size:12px" x-text="s.trigger ? '触发条件：' + s.trigger : ''"></div>
          <div class="muted" style="font-size:12px; margin-top:2px">
            <template x-for="(st, i) in s.steps" :key="i">
              <div x-text="'  ' + (i + 1) + '. ' + stepShort(st.tool) + (st.note ? ' — ' + st.note : '')"></div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <div class="card">
    <div class="hd">
      <h3>自主运行定时任务</h3>
      <span class="hint" x-text="'共 ' + schedules.length + ' 个 · 定时唤醒 leader 自主执行'"></span>
    </div>
    <div class="bd">
      <template x-if="!schedules.length">
        <div class="empty">暂无定时任务 —— 可在「自主运行」页或 Agent 对话里配置</div>
      </template>
      <template x-for="s in schedules" :key="s.schedule_id">
        <div style="display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line)">
          <b x-text="s.name"></b>
          <span class="tag t-slate" x-text="s.cron"></span>
          <span class="tag" :class="s.enabled ? 't-teal' : 't-slate'" x-text="s.enabled ? '运行中' : '停用'"></span>
          <span class="tag t-amber" x-text="modeLabel(s.permission_mode)"></span>
        </div>
      </template>
    </div>
  </div>

  <div class="card">
    <div class="hd">
      <h3>编排执行</h3>
      <span class="hint">最近一次工作流（flow）执行进度</span>
    </div>
    <div class="bd">
      <template x-if="!flowRun">
        <div class="empty">暂无编排执行记录 —— 在 Agent 对话里说「跑产销协同链」触发</div>
      </template>
      <template x-if="flowRun">
        <div style="padding:8px 0">
          <div>
            <b x-text="flowRun.flow_name"></b>
            <span class="tag" :class="flowRun.status === 'done' ? 't-teal' : flowRun.status === 'error' ? 't-red' : 't-amber'"
              x-text="flowRun.status === 'done' ? '已完成' : flowRun.status === 'error' ? '失败' : '执行中'"></span>
          </div>
          <div class="muted" style="font-size:12px; margin-top:4px">
            <template x-if="flowRun.status === 'running'">
              <span x-text="'正在执行第 ' + flowRun.step_index + ' / ' + flowRun.step_total + ' 步' + (flowRun.current_role ? '（' + flowRun.current_role + '）' : '')"></span>
            </template>
            <template x-if="flowRun.status !== 'running'">
              <span x-text="'共 ' + flowRun.step_total + ' 步 · 更新于 ' + flowRun.updated_at"></span>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
