# nginx 代理参数（共用片段）—— 由 nginx.conf 里每个 location 各自 include 一次。
#
# 为什么抽成单独文件：原先同一组 proxy_set_header 在两个 location 里各抄了一份，
# 而"只改了其中一处"正是这类配置最容易出的缺陷（改 nginx.conf 时只想着一处）。
# 抽出来之后改一处全改到。挂载见 docker-compose.yml 的 nginx 服务。
#
# ⚠ 必须写在**每个 location 内部**，不能只在 server 层 include 一次：
#   nginx 的 proxy_set_header 是「本层一旦定义就不再继承上层」，
#   而 /mcp 里为了显式声明 Authorization 定义了自己的 proxy_set_header，
#   那一条会把 server 层继承下来的整组头**全部顶掉**（Host / X-Real-IP 一起没了）。
#   每个 location 各 include 一次，才能保证各自那组是完整的。

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# HTTP/1.1 + 清空 Connection —— 两行都要，各自的理由不同：
#   · proxy_http_version 1.1：nginx 默认用 HTTP/1.0 连上游，而 HTTP/1.0 没有
#     分块传输编码，流式响应（SSE）只能靠关连接标识结束。
#   · Connection ""：nginx 默认给上游发 Connection: close（它是逐跳头，由 nginx
#     自己生成、不转发客户端的），置空即"不发这个字段"，上游连接才有复用的余地。
#     ⚠ 它本身**不**带来复用 —— 复用由 upstream 块的 keepalive 决定（见 nginx.conf）。
proxy_http_version 1.1;
proxy_set_header Connection "";

# SSE 流式响应：关缓冲才能逐字到达浏览器；关缓存避免把别人的回答发给你。
# 不关 buffering 的表现是：界面转圈很久，然后所有字一次性蹦出来。
proxy_buffering off;
proxy_cache off;

# 「等上游两个包之间」的间隔上限，不是整个响应的总时长。
# Agent 一轮要跑几十秒到几分钟，默认 60s 会在思考中途断开。
proxy_read_timeout 300s;
