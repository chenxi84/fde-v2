server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # 远端 MCP 端点（Streamable HTTP）。location / 本来就转 :4000，单列出来是为了
    # 显式声明 Authorization 透传（nginx 默认会转发该头，写出来是为了让「令牌必须原样
    # 到达平台」这件事一目了然，将来若加 rewrite/鉴权子请求也不会被无意丢掉），
    # 并保留关缓冲——将来若补旧的 SSE 传输不用再改。
    location /mcp {
        proxy_pass http://fde-v2:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://fde-v2:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应（Agent 对话）：关闭缓冲实时转发 + 长超时
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }
}
