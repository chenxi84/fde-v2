# ── FDE v2 反向代理 ─────────────────────────────────────────────
#
# 2026-09-28 改造：只做两件**不改安全边界**的事，且必须一起做。
#
#   ① 带耗时字段的访问日志 —— 这是后面一切调优的量具。
#      官方 nginx 镜像默认的 combined 格式不含任何耗时字段，于是
#      「5ms 完成的请求」和「排队 4 分钟后 504 的请求」在日志里长得几乎一样，
#      唯一的差别是 $status —— 而你分不出那个 504 是排队排死的还是应用崩的。
#
#   ② 上游连接复用（upstream + keepalive）—— 原先每条请求都新建一条 TCP 到 :4000，
#      而 nginx 默认给上游发 Connection: close，所以响应完就关 —— **包括每个静态资源**
#      （本文件没有 root/try_files，view.js / view.html / alpine 全部经 Flask 供）。
#      后果：每个短请求都临时占一个 waitress 的连接名额，而它的上限是默认的 100。
#
# 为什么必须一起做：② 引入了一个**静默**故障模式（空闲竞态 → 偶发 502），
# 判据是 uct=0.000 配上低流量时段的 502；没有 ① 就无法诊断它，
# 也无法验证池化到底有没有生效 —— 而 ② 最可能的失败方式是「只改了一半」。
# ─────────────────────────────────────────────────────────────

# ① 日志格式。
#    必须是 http 上下文：本文件被 include 进 http{}，所以写在 server 块**之前**合法，
#    写进 server{} 里会报 "log_format directive is not allowed here"。
#    名字不能叫 main —— 官方镜像的 nginx.conf 里已经定义过 log_format main。
#    rt/urt/uct 三个字段就是这套量具的全部：request_time / upstream_response_time /
#    upstream_connect_time。uct=0.000 表示这条请求复用了池里的连接。
log_format fde '$remote_addr - $remote_user [$time_local] "$request" '
               '$status $body_bytes_sent rt=$request_time '
               'urt=$upstream_response_time uct=$upstream_connect_time '
               'uaddr=$upstream_addr "$http_referer" "$http_user_agent"';

# ② 上游连接复用。
#
# keepalive 是**每个 worker** 的空闲连接缓存，且**只限空闲、不限活跃**，所以要按预算取：
#
#     100(waitress connection_limit) ≥ worker_processes × keepalive
#                                      + 同时在跑的请求数(≤64) + 余量
#
# 先确认核数（容器里 auto = 可见核数）：
#     docker exec <nginx 容器> nginx -T | grep worker_processes
#
# 取值原则：**让总空闲数 ≈ 16，即 keepalive = 16 / worker_processes（下限 1~2）。**
#   2 核 → 8；4 核 → 4；8 核 → 2。这样 16 条空闲 + 64 条并发对话 ≈ 80，
#   离 100 还剩约 18 个名额。下面按 8 核写的 2。
#
# 为什么"宁可小"：空闲池只是个缓存，它的全部作用是不必每条请求都握手 ——
#   而连接是毫秒级就被复用的，1~2 条/worker 已经足够吃满这个收益。
#   放大它几乎买不到什么，代价却是**静默且致命**的：空闲连接照样计入 waitress 的
#   connection_limit，池子一大，单靠空闲连接就能把 waitress 顶到上限而**停止 accept**。
#   ⚠ 所以别照抄网上常见的 keepalive 32：16 核上那是 512 条空闲连接，
#   平台会在没有任何真实流量时就已经打不开。
#
# ⚠ keepalive_timeout（upstream 上下文，默认 60s）必须**小于**后端的空闲超时，
#   让 nginx 先关连接；否则后端先关、nginx 仍以为可复用，就会偶发 502
#   （error.log 里是 "upstream prematurely closed connection while reading response header"）。
#   waitress 的 channel_timeout 是 120s，60 < 120 正好安全 —— 但这是一个**耦合**：
#   谁把 waitress 的 channel_timeout 调到 60s 以下，就会开始出偶发 502。
#   下面这行写的是默认值，写出来只是为了让这个耦合可见。
upstream fde {
    server fde-v2:4000;
    keepalive 2;
    keepalive_timeout 60s;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # ① 只定义 log_format 而不在这里引用，格式不会生效（继续走默认的 combined）。
    #    写到 /var/log/fde/ 而不是 /var/log/nginx/：后者在官方镜像里是指向 stdout 的
    #    软链，往那儿挂卷会把它遮住，连带把 error.log 一起挤出 docker logs。
    #    目录由 docker-compose 的 ./logs 挂载提供；**不挂载则 nginx 启动会失败**。
    access_log /var/log/fde/access.log fde;

    # 远端 MCP 端点（Streamable HTTP）。location / 本来就转同一个上游，单列出来是为了
    # 显式声明 Authorization 透传（nginx 默认会转发该头，写出来是为了让「令牌必须原样
    # 到达平台」这件事一目了然，将来若加 rewrite/鉴权子请求也不会被无意丢掉），
    # 并保留关缓冲——将来若补旧的 SSE 传输不用再改。
    #
    # ⚠ 也要指向 http://fde（不能留 http://fde-v2:4000）：否则这条链拿不到连接复用，
    #   就是典型的「只改了一半」。
    location /mcp {
        proxy_pass http://fde;
        include /etc/nginx/fde_proxy_params.conf;
        # 这一条与本 location 自己 include 进来的那组是**不同的头名**，同层各条并存。
        # 换句话说：这里之所以要 include 一次，不是为了加这条，而是为了让本 location
        # 的 proxy_set_header 集合是**完整的** —— 一旦本层定义了任何一条就不再继承上层。
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://fde;
        include /etc/nginx/fde_proxy_params.conf;
    }
}
