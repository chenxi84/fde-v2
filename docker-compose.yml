services:
  fde-v2:
    build: .
    environment:
      - PLATFORM_HOST=0.0.0.0
      # 同时处理几个请求。Agent 对话是 SSE 长连接、一次对话占满一个线程，
      # 所以这个数约等于「同时能几个人对话」（超出的排队等，不报错）。
      # 线程很便宜（主要是虚拟栈），真实的墙通常是 LLM 的速率限制。
      - PLATFORM_THREADS=64
      - DATABASE_URL=postgresql://fde:fde@postgres:5432/fdev2
      - AGENT_SERVICE_URL=http://agent-service:4100
      - FDE_EMBED_URL=http://embed:9800
    volumes:
      - ./config:/app/config
      - ./app:/app/app
    depends_on:
      - postgres
      - agent-service
      - embed
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c = http.client.HTTPConnection('127.0.0.1', 4000); c.request('GET', '/'); c.getresponse()"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-service:
    build: .
    command: python -m fde_platform.agent_service
    environment:
      - AGENT_HOST=0.0.0.0
      - FDE_EMBED_URL=http://embed:9800
    volumes:
      - ./config:/app/config
      - ./app:/app/app
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c = http.client.HTTPConnection('127.0.0.1', 4100); c.request('GET', '/'); c.getresponse()"]
      interval: 30s
      timeout: 5s
      retries: 3

  embed:
    build:
      context: .
      dockerfile: Dockerfile.embed
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c = http.client.HTTPConnection('127.0.0.1', 9800); c.request('GET', '/'); c.getresponse()"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=fde
      - POSTGRES_PASSWORD=fde
      - POSTGRES_DB=fdev2
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde -d fdev2"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - fde-v2
    restart: always
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
