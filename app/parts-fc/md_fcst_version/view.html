<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
    <b>预测版本列表</b>
    <span class="muted">主数据 · 版本号严格按月（V+YYYYMM）</span>
    <div class="right tagline" style="gap:8px">
      <input x-model="keyword" @keydown.enter="search()" placeholder="版本号 / 期间" style="width:220px">
      <button class="b-ghost b-sm" @click="search()">查询</button>
      <button class="b-pri b-sm" @click="openCreate()">+ 新建版本</button>
    </div>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>版本号</th><th>期间</th><th>状态</th></tr>
      <template x-if="!list.items.length">
        <tr><td colspan="3" class="empty"
          x-text="keyword ? '无匹配版本' : '暂无版本 —— 点「新建版本」创建'"></td></tr>
      </template>
      <template x-for="d in list.items" :key="d.version_code">
        <tr class="data">
          <td><button class="b-link mono" @click="viewX(d)" x-text="d.version_code"></button></td>
          <td class="mono" x-text="d.period"></td>
          <td><span class="st" :class="'st-' + hue(d.status)" x-text="statusLabel(d.status)"></span></td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:10px 16px">
    <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
    <div class="right tagline" style="gap:8px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
      <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
      <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
    </div>
  </div>
</div></div>

<!-- 新建表单模态 -->
<div class="modal-mask" x-show="form.open" @click.self="closeCreate()" x-cloak>
  <div class="modal" style="max-width:450px">
    <div class="modal-hd"><div><div class="docno">新建预测版本</div></div>
      <button class="x" @click="closeCreate()">✕</button></div>
    <div class="modal-bd">
      <div class="frow"><div>
        <label class="f">版本号 <span class="req">*</span></label>
        <input x-model="form.version_code" @input="derivePeriod(form.version_code)" placeholder="如 V202601"></div><div>
        <label class="f">期间 <span class="req">*</span></label>
        <input x-model="form.period" placeholder="2026-01" readonly style="background:#f3f4f6"></div></div>
      <div class="frow"><div>
        <label class="f">状态</label>
        <select x-model="form.status">
          <option>活跃</option><option>已关闭</option>
        </select></div><div></div></div>
      <div class="muted mt8">版本号格式：V + 4位年份 + 2位月份（如 V202601 表示 2026年1月）</div>
      <div class="mt12 tagline">
        <button class="b-pri right" :disabled="form.busy" @click="saveForm()"
          x-text="form.busy ? '创建中...' : '创建版本'"></button>
      </div>
    </div>
  </div>
</div>
