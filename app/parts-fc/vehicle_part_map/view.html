<div>
  <!-- ══ 创建/编辑表单 ══ -->
  <div class="collapse" :class="{open: form.show}">
    <div class="card mb0">
      <div class="hd">
        <h3 x-text="form.mode === 'edit' ? ('编辑映射 · ' + form.edit_part_no + ' → ' + form.edit_veh_model) : '新建车型零件映射'"></h3>
        <span class="hint">主数据 · 量纲权威源 · 用量/份额/生命周期</span>
        <button class="b-ghost b-sm right" @click="closeForm()">收起</button>
      </div>
      <div class="bd">
        <div class="frow">
          <div><label class="f">零件号 <span class="req">*</span></label>
            <div style="position:relative; flex:1">
              <input x-model="form.part_no"
                     @click.stop="toggleAuto('form_part_no','part_no')"
                     @input="autoShow = 'form_part_no'; filterAuto('part_no', form.part_no)"
                     placeholder="搜索零件号或名称..."
                     autocomplete="off"
                     :disabled="form.mode === 'edit'"
                     style="width:100%">
              <div class="auto-drop" x-show="autoShow==='form_part_no'" @click.away="autoShow=''"
                   style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                          background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
                <div x-show="!autoFiltered.length" style="padding:8px; color:#999">无匹配结果</div>
                <template x-for="item in autoFiltered" :key="item['part_no']">
                  <div @mousedown.prevent="selectAuto(item, form, 'part_no')"
                       style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                       @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
                    <div style="font-weight:500" x-text="item['part_no']"></div>
                    <div style="font-size:12px; color:#888" x-text="autoDisplay[item['part_no']] || '—'"></div>
                  </div>
                </template>
              </div>
            </div></div>
          <div><label class="f">车型 <span class="req">*</span></label>
            <div style="position:relative; flex:1">
              <input x-model="form.veh_model"
                     @click.stop="toggleAuto('form_veh_model','vehicle_code')"
                     @input="autoShow = 'form_veh_model'; filterAuto('vehicle_code', form.veh_model)"
                     placeholder="搜索车型代码或名称..."
                     autocomplete="off"
                     :disabled="form.mode === 'edit'"
                     style="width:100%">
              <div class="auto-drop" x-show="autoShow==='form_veh_model'" @click.away="autoShow=''"
                   style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                          background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
                <div x-show="!autoFiltered.length" style="padding:8px; color:#999">无匹配结果</div>
                <template x-for="item in autoFiltered" :key="item['vehicle_code']">
                  <div @mousedown.prevent="selectAuto(item, form, 'veh_model', 'vehicle_code')"
                       style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                       @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
                    <div style="font-weight:500" x-text="item['vehicle_code']"></div>
                    <div style="font-size:12px; color:#888" x-text="autoDisplay[item['vehicle_code']] || '—'"></div>
                  </div>
                </template>
              </div>
            </div></div>
          <div><label class="f">平台</label>
            <input x-model="form.platform" placeholder="平台"></div>
          <template x-if="form.mode === 'create'">
            <div><label class="f">用量 <span class="req">*</span></label>
              <input type="number" x-model="form.usage" placeholder="每车用量"></div>
          </template>
          <template x-if="form.mode === 'create'">
            <div><label class="f">份额 % <span class="req">*</span></label>
              <input type="number" x-model="form.share" placeholder="如 100"></div>
          </template>
          <div style="display:flex; align-items:flex-end">
            <button class="b-ghost b-sm" @click="form.more = !form.more"
              x-text="form.more ? '收起字段 ▴' : '更多字段 ▾'"></button></div>
        </div>
        <div class="collapse" :class="{open: form.more}">
          <div class="frow" style="padding-top:10px">
            <div><label class="f">LC阶段 <span class="req">*</span></label>
              <select x-model="form.lc_stage">
                <option value="">— 选择阶段 —</option>
                <template x-for="s in lcStageOptions" :key="s">
                  <option :value="s" x-text="s"></option>
                </template>
              </select></div>
            <div><label class="f">LC形态 <span class="req">*</span></label>
              <select x-model="form.lc_shape">
                <option value="">— 选择形态 —</option>
                <template x-for="s in lcShapeOptions" :key="s">
                  <option :value="s" x-text="s"></option>
                </template>
              </select></div>
            <div><label class="f">SOP <span class="req">*</span></label>
              <input type="date" x-model="form.sop"></div>
            <div><label class="f">EOP</label>
              <input type="date" x-model="form.eop"></div>
            <div><label class="f">数据来源 <span class="req">*</span></label>
              <input x-model="form.source" placeholder="数据来源"></div>
            <template x-if="form.mode === 'edit'">
              <div><label class="f">状态</label>
                <select x-model="form.status">
                  <template x-for="s in statusOptions" :key="s">
                    <option :value="s" x-text="s"></option>
                  </template>
                </select></div>
            </template>
          </div>
        </div>
        <div class="mt12 tagline">
          <button class="b-pri right" :disabled="form.busy" @click="saveForm()"
            x-text="form.busy ? '处理中…' : (form.mode === 'edit' ? '保存修改' : '创建映射')"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ 列表 ══ -->
  <div class="card" :class="form.show ? 'mt12' : ''"><div class="bd" style="padding:0">
    <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
      <b>车型零件映射</b>
      <button class="b-pri b-sm" @click="openCreate()">＋ 新建映射</button>
      <div class="right tagline" style="gap:8px; flex-wrap:wrap">
        <input x-model="fPartNo" @keydown.enter="search()" placeholder="零件号" style="width:120px">
        <input x-model="fVehModel" @keydown.enter="search()" placeholder="车型" style="width:120px">
        <select x-model="fLcStage" @change="search()" style="width:120px">
          <option value="">LC阶段 ▾</option>
          <template x-for="s in lcStageOptions" :key="s">
            <option :value="s" x-text="s"></option>
          </template>
        </select>
        <div class="chips">
          <span class="fchip" :class="{on: fStatus === ''}" @click="fStatus = ''; search()">全部</span>
          <template x-for="s in statusOptions" :key="s">
            <span class="fchip" :class="{on: fStatus === s}"
              @click="fStatus = s; search()" x-text="s"></span>
          </template>
        </div>
      </div>
    </div>
    <div class="scroll-x">
      <table class="tbl tight">
        <tr><th>零件号</th><th>车型</th><th>平台</th><th>用量</th><th>份额%</th>
          <th>LC阶段</th><th>LC形态</th><th>来源</th><th>状态</th><th class="right">操作</th></tr>
        <template x-if="!list.items.length">
          <tr><td colspan="10" class="empty" x-text="(fPartNo || fVehModel || fLcStage || fStatus) ? '无匹配映射' : '暂无映射数据'"></td></tr>
        </template>
        <template x-for="d in list.items" :key="d.part_no + '|' + d.veh_model">
          <tr class="data">
            <td><button class="b-link mono" @click="viewDetail(d)" x-text="d.part_no"></button></td>
            <td x-text="dash(d.veh_model)"></td>
            <td x-text="dash(d.platform)"></td>
            <td class="num" x-text="fmt(d.usage)"></td>
            <td class="num" x-text="fmt(d.share)"></td>
            <td><span class="st" :class="'st-' + hue(d.lc_stage)" x-text="dash(d.lc_stage)"></span></td>
            <td x-text="dash(d.lc_shape)"></td>
            <td x-text="dash(d.source)"></td>
            <td><span class="st" :class="'st-' + hue(d.status)" x-text="dash(d.status)"></span></td>
            <td class="right rowact" style="white-space:nowrap">
              <template x-if="d.status !== '停用'">
                <button class="b-ghost b-sm" @click="openEdit(d)">编辑</button>
              </template>
            </td>
          </tr>
        </template>
      </table>
    </div>
    <div class="tagline" style="padding:10px 16px">
      <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
      <div class="right tagline" style="gap:8px">
        <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
        <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
        <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
      </div>
    </div>
  </div></div>

  <!-- ══ 详情模态 ══ -->
  <div class="modal-mask" x-show="modal.open" @click.self="closeModal()"
       @keydown.escape.window="closeModal()" x-cloak>
    <div class="modal">
      <div class="modal-hd">
        <div><div class="docno" x-text="modal.d ? modal.d.part_no + ' → ' + modal.d.veh_model : '映射详情'"></div>
          <div class="sub">主数据 · 量纲权威源 · VEHICLE PART MAP</div></div>
        <template x-if="modal.d">
          <span class="st" :class="'st-' + hue(modal.d.status)" x-text="modal.d.status"></span>
        </template>
        <button class="x" @click="closeModal()">✕</button>
      </div>
      <div class="modal-bd">
        <template x-if="modal.loading">
          <div class="loadbox"><span class="spin">◌</span><br>载入映射明细…</div>
        </template>
        <template x-if="!modal.loading && modal.d">
          <div>
            <div class="sec">基本信息</div>
            <div class="kv">
              <div><div class="k">零件号</div><div class="v mono" x-text="dash(modal.d.part_no)"></div></div>
              <div><div class="k">车型</div><div class="v" x-text="dash(modal.d.veh_model)"></div></div>
              <div><div class="k">平台</div><div class="v" x-text="dash(modal.d.platform)"></div></div>
              <div><div class="k">数据来源</div><div class="v" x-text="dash(modal.d.source)"></div></div>
              <div><div class="k">状态</div><div class="v"><span class="st" :class="'st-' + hue(modal.d.status)" x-text="dash(modal.d.status)"></span></div></div>
            </div>

            <div class="sec">量纲信息</div>
            <div class="kv">
              <div><div class="k">用量</div><div class="v" x-text="fmt(modal.d.usage)"></div></div>
              <div><div class="k">份额 %</div><div class="v" x-text="fmt(modal.d.share)"></div></div>
            </div>

            <div class="sec">生命周期</div>
            <div class="kv">
              <div><div class="k">LC阶段</div><div class="v"><span class="st" :class="'st-' + hue(modal.d.lc_stage)" x-text="dash(modal.d.lc_stage)"></span></div></div>
              <div><div class="k">LC形态</div><div class="v" x-text="dash(modal.d.lc_shape)"></div></div>
            </div>

            <div class="sec">时间信息</div>
            <div class="kv">
              <div><div class="k">SOP</div><div class="v mono" x-text="dash(modal.d.sop)"></div></div>
              <div><div class="k">EOP</div><div class="v mono" x-text="dash(modal.d.eop)"></div></div>
              <div><div class="k">创建时间</div><div class="v mono" x-text="fmtTime(modal.d.created_at)"></div></div>
              <div><div class="k">更新时间</div><div class="v mono" x-text="fmtTime(modal.d.updated_at)"></div></div>
            </div>

            <!-- 用量变更子模态 -->
            <template x-if="usageForm.show">
              <div>
                <div class="sec">变更用量</div>
                <div class="frow">
                  <div><label class="f">新用量 <span class="req">*</span></label>
                    <input type="number" x-model="usageForm.new_usage" placeholder="新用量"></div>
                  <div><label class="f">生效日期 <span class="req">*</span></label>
                    <input type="date" x-model="usageForm.effective_date"></div>
                  <div style="grid-column: span 2"><label class="f">变更依据 <span class="req">*</span></label>
                    <input x-model="usageForm.basis" placeholder="变更依据"></div>
                  <div style="display:flex; align-items:flex-end">
                    <button class="b-pri b-sm" :disabled="usageForm.busy" @click="saveUsage()"
                      x-text="usageForm.busy ? '保存中…' : '确认变更'"></button>
                    <button class="b-ghost b-sm" @click="closeUsageForm()" style="margin-left:6px">取消</button></div>
                </div>
              </div>
            </template>

            <!-- 份额变更子模态 -->
            <template x-if="shareForm.show">
              <div>
                <div class="sec">变更份额</div>
                <div class="frow">
                  <div><label class="f">新份额 % <span class="req">*</span></label>
                    <input type="number" x-model="shareForm.new_share" placeholder="新份额"></div>
                  <div><label class="f">生效日期 <span class="req">*</span></label>
                    <input type="date" x-model="shareForm.effective_date"></div>
                  <div style="grid-column: span 2"><label class="f">变更依据 <span class="req">*</span></label>
                    <input x-model="shareForm.basis" placeholder="变更依据"></div>
                  <div style="display:flex; align-items:flex-end">
                    <button class="b-pri b-sm" :disabled="shareForm.busy" @click="saveShare()"
                      x-text="shareForm.busy ? '保存中…' : '确认变更'"></button>
                    <button class="b-ghost b-sm" @click="closeShareForm()" style="margin-left:6px">取消</button></div>
                </div>
              </div>
            </template>

            <!-- 停用确认子模态 -->
            <template x-if="disableForm.show">
              <div>
                <div class="sec">停用映射</div>
                <div class="frow">
                  <div style="grid-column: span 3"><label class="f">停用原因 <span class="req">*</span></label>
                    <textarea x-model="disableForm.reason" placeholder="请填写停用原因" rows="2"></textarea></div>
                  <div style="display:flex; align-items:flex-end">
                    <button class="b-dng b-sm" :disabled="disableForm.busy" @click="saveDisable()"
                      x-text="disableForm.busy ? '处理中…' : '确认停用'"></button>
                    <button class="b-ghost b-sm" @click="closeDisable()" style="margin-left:6px">取消</button></div>
                </div>
              </div>
            </template>

            <!-- 量纲历史版本子表 -->
            <div class="sec" x-text="'量纲历史版本 · ' + ((modal.d.usage_history || []).length) + ' 条'"></div>
            <div class="scroll-x">
              <table class="tbl tight">
                <tr><th>字段类型</th><th>旧值</th><th>生效起</th><th>生效止</th><th>变更依据</th><th>变更时间</th></tr>
                <template x-if="!(modal.d.usage_history || []).length">
                  <tr><td colspan="6" class="empty">暂无历史版本</td></tr>
                </template>
                <template x-for="h in modal.d.usage_history || []" :key="h.changed_at || ''">
                  <tr>
                    <td x-text="dash(h.field_type)"></td>
                    <td x-text="dash(h.old_value)"></td>
                    <td class="mono" x-text="fmtTime(h.effective_from)"></td>
                    <td class="mono" x-text="fmtTime(h.effective_to)"></td>
                    <td x-text="dash(h.change_basis)"></td>
                    <td class="mono" x-text="fmtTime(h.changed_at)"></td>
                  </tr>
                </template>
              </table>
            </div>

            <details class="raw"><summary>原始数据</summary>
              <pre class="json" x-text="JSON.stringify(modal.d, null, 2)"></pre></details>
          </div>
        </template>
      </div>
      <div class="modal-ft" x-show="modal.d">
        <template x-if="modal.d">
          <div class="tagline" style="gap:8px">
            <template x-if="modal.d.status !== '停用'">
              <button class="b-ghost" @click="openEdit(modal.d)">编辑</button>
            </template>
            <template x-if="modal.d.status !== '停用'">
              <button class="b-ghost" @click="openUsageForm()" x-show="!usageForm.show">变更用量</button>
            </template>
            <template x-if="modal.d.status !== '停用'">
              <button class="b-ghost" @click="openShareForm()" x-show="!shareForm.show">变更份额</button>
            </template>
            <template x-if="modal.d.status !== '停用'">
              <button class="b-dng" @click="openDisable()" x-show="!disableForm.show">停用</button>
            </template>
            <button class="b-ghost right" @click="closeModal()">关闭</button>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
