<div>
  <!-- ══ 创建项目模态（项目 + 首个零件） ══ -->
  <div class="modal-mask" x-show="projectForm.show" @click.self="closeProjectForm()"
       @keydown.escape.window="closeProjectForm()" x-cloak>
    <div class="modal" style="max-width:680px">
      <div class="modal-hd">
        <div><div class="docno">新建项目</div>
          <div class="sub">创建项目编号并登记首个零件</div></div>
        <button class="x" @click="closeProjectForm()">✕</button>
      </div>
      <div class="modal-bd">
        <div class="sec">项目信息</div>
        <div class="frow">
          <div><label class="f">项目编号 <span class="req">*</span></label>
            <input x-model="projectForm.project_no" placeholder="如 P2024-001"></div>
          <div><label class="f">OEM代码 <span class="req">*</span></label>
            <div style="position:relative; flex:1">
              <input x-model="projectForm.oem_code"
                     @click.stop="toggleAuto('pf_oem_code','customer_code')"
                     @input="autoShow = 'pf_oem_code'; filterAuto('customer_code', projectForm.oem_code)"
                     placeholder="搜索客户编码或名称..."
                     autocomplete="off"
                     style="width:100%">
              <div class="auto-drop" x-show="autoShow==='pf_oem_code'" @click.away="autoShow=''"
                   style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                          background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
                <div x-show="!autoFiltered.length" style="padding:8px; color:#999">无匹配结果</div>
                <template x-for="item in autoFiltered" :key="item['customer_code']">
                  <div @mousedown.prevent="selectAuto(item, projectForm, 'oem_code', 'customer_code')"
                       style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                       @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
                    <div style="font-weight:500" x-text="item['customer_code']"></div>
                    <div style="font-size:12px; color:#888" x-text="autoDisplay[item['customer_code']] || '—'"></div>
                  </div>
                </template>
              </div>
            </div></div>
          <div><label class="f">工厂代码 <span class="req">*</span></label>
            <input x-model="projectForm.plant_code" placeholder="工厂代码"></div>
          <div><label class="f">车型 <span class="req">*</span></label>
            <div style="position:relative; flex:1">
              <input x-model="projectForm.veh_model"
                     @click.stop="toggleAuto('pf_veh_model','vehicle_code')"
                     @input="autoShow = 'pf_veh_model'; filterAuto('vehicle_code', projectForm.veh_model)"
                     placeholder="搜索车型代号或名称..."
                     autocomplete="off"
                     style="width:100%">
              <div class="auto-drop" x-show="autoShow==='pf_veh_model'" @click.away="autoShow=''"
                   style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                          background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
                <div x-show="!autoFiltered.length" style="padding:8px; color:#999">无匹配结果</div>
                <template x-for="item in autoFiltered" :key="item['vehicle_code']">
                  <div @mousedown.prevent="selectAuto(item, projectForm, 'veh_model', 'vehicle_code')"
                       style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                       @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
                    <div style="font-weight:500" x-text="item['vehicle_code']"></div>
                    <div style="font-size:12px; color:#888" x-text="autoDisplay[item['vehicle_code']] || '—'"></div>
                  </div>
                </template>
              </div>
            </div></div>
          <div><label class="f">阶段</label>
            <select x-model="projectForm.stage">
              <template x-for="s in stageOptions" :key="s"><option :value="s" x-text="s"></option></template>
            </select></div>
          <div><label class="f">零件类型 <span class="req">*</span></label>
            <select x-model="projectForm.part_kind">
              <template x-for="k in partKindOptions" :key="k"><option :value="k" x-text="k"></option></template>
            </select></div>
          <div><label class="f">平台</label>
            <input x-model="projectForm.platform" placeholder="平台"></div>
          <div><label class="f">生命周期形态</label>
            <select x-model="projectForm.lc_shape">
              <option value="">— 选择形态 —</option>
              <template x-for="s in lcShapeOptions" :key="s"><option :value="s" x-text="s"></option></template>
            </select></div>
        </div>

        <div class="sec" style="margin-top:16px">首个零件</div>
        <div class="frow">
          <div><label class="f">零件号 <span class="req">*</span></label>
            <div style="position:relative; flex:1">
              <input x-model="projectForm.part_no"
                     @click.stop="toggleAuto('pf_part_no','part_no')"
                     @input="autoShow = 'pf_part_no'; filterAuto('part_no', projectForm.part_no)"
                     placeholder="搜索零件号或名称..."
                     autocomplete="off"
                     style="width:100%">
              <div class="auto-drop" x-show="autoShow==='pf_part_no'" @click.away="autoShow=''"
                   style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                          background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
                <div x-show="!autoFiltered.length" style="padding:8px; color:#999">无匹配结果</div>
                <template x-for="item in autoFiltered" :key="item['part_no']">
                  <div @mousedown.prevent="selectAuto(item, projectForm, 'part_no')"
                       style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                       @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
                    <div style="font-weight:500" x-text="item['part_no']"></div>
                    <div style="font-size:12px; color:#888" x-text="autoDisplay[item['part_no']] || '—'"></div>
                  </div>
                </template>
              </div>
            </div></div>
          <div><label class="f">SOP <span class="req">*</span></label>
            <input type="date" x-model="projectForm.sop"></div>
          <div><label class="f">EOP</label>
            <input type="date" x-model="projectForm.eop"></div>
          <div><label class="f">销售负责人 <span class="req">*</span></label>
            <div style="position:relative; flex:1">
              <input x-model="projectForm.owner_sales"
                     @click.stop="toggleAuto('pf_owner_sales','user_code')"
                     @input="autoShow = 'pf_owner_sales'; filterAuto('user_code', projectForm.owner_sales)"
                     placeholder="搜索用户编码或名称..."
                     autocomplete="off"
                     style="width:100%">
              <div class="auto-drop" x-show="autoShow==='pf_owner_sales'" @click.away="autoShow=''"
                   style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                          background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
                <div x-show="!autoFiltered.length" style="padding:8px; color:#999">无匹配结果</div>
                <template x-for="item in autoFiltered" :key="item['user_code']">
                  <div @mousedown.prevent="selectAuto(item, projectForm, 'owner_sales')"
                       style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                       @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
                    <div style="font-weight:500" x-text="item['user_code']"></div>
                    <div style="font-size:12px; color:#888" x-text="autoDisplay[item['user_code']] || '—'"></div>
                  </div>
                </template>
              </div>
            </div></div>
          <div><label class="f">单车用量</label>
            <input type="number" x-model="projectForm.usage" placeholder="0" step="0.01"></div>
          <div><label class="f">份额</label>
            <input type="number" x-model="projectForm.share" placeholder="0" step="0.01"></div>
        </div>
        <div class="frow">
          <div><label class="f">零件状态</label>
            <select x-model="projectForm.status">
              <option>待启用</option><option>正常</option><option>停用</option>
            </select></div>
          <div><label class="f">替换物料</label>
            <input x-model="projectForm.replacement_for" placeholder="首个零件无需，后续零件可从项目内选择"></div>
            <span class="hint" style="font-size:11px; color:#888">后续添加零件时可从项目已有物料中选择</span></div></div>
        </div>
      </div>
      <div class="modal-ft">
        <div class="tagline" style="gap:8px">
          <button class="b-pri" :disabled="projectForm.busy" @click="saveProjectForm()"
            x-text="projectForm.busy ? '处理中…' : '创建项目'"></button>
          <button class="b-ghost" @click="closeProjectForm()">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ 添加零件模态 ══ -->

                    <div style="font-weight:500" x-text="item['part_no']"></div>

                  </div>
                </template>
              </div>
            </div></div>

            <input type="date" x-model="partForm.sop"></div>
          <div><label class="f">EOP</label>

                     @input="autoShow = 'ptf_owner_sales'; filterAuto('user_code', partForm.owner_sales)"
                     placeholder="搜索用户编码或名称..."
                     autocomplete="off"
                     style="width:100%">
              <div class="auto-drop" x-show="autoShow==='ptf_owner_sales'" @click.away="autoShow=''"
                   style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                          background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
                <div x-show="!autoFiltered.length" style="padding:8px; color:#999">无匹配结果</div>
                <template x-for="item in autoFiltered" :key="item['user_code']">
                  <div @mousedown.prevent="selectAuto(item, partForm, 'owner_sales')"
                       style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                       @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
                    <div style="font-weight:500" x-text="item['user_code']"></div>
                    <div style="font-size:12px; color:#888" x-text="autoDisplay[item['user_code']] || '—'"></div>
                  </div>
                </template>
              </div>
            </div></div>
          <div><label class="f">单车用量</label>
            <input type="number" x-model="partForm.usage" placeholder="0" step="0.01"></div>
          <div><label class="f">份额</label>
            <input type="number" x-model="partForm.share" placeholder="0" step="0.01"></div>
        </div>
        <div class="frow">
          <div><label class="f">零件状态</label>
            <select x-model="partForm.status">
              <option>待启用</option><option>正常</option><option>停用</option>
            </select></div>
          <div><label class="f">替换物料</label>
            <select x-model="partForm.replacement_for">
              <option value="">— 非替换件 —</option>
              <template x-for="p in partForm.projectParts" :key="p.part_no">
                <option :value="p.part_no" x-text="p.part_no"></option>
              </template>
            </select></div></div>
        </div>
      </div>
      <div class="modal-ft">
        <div class="tagline" style="gap:8px">
          <button class="b-pri" :disabled="partForm.busy" @click="savePartForm()"
            x-text="partForm.busy ? '处理中…' : '添加零件'"></button>
          <button class="b-ghost" @click="closePartForm()">取消</button>

      </div>
    </div>
  </div>

                <template x-for="item in autoFiltered" :key="item['vehicle_code']">
                  <div @mousedown.prevent="selectAuto(item, form, 'veh_model', 'vehicle_code')"
                       style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                       @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
                    <div style="font-weight:500" x-text="item['vehicle_code']"></div>
                    <div style="font-size:12px; color:#888" x-text="autoDisplay[item['vehicle_code']] || '—'"></div>
                  </div>
                </template>
              </div>
            </div></div>
          <div><label class="f">平台</label>
            <input x-model="form.platform" placeholder="平台"></div>
          <div><label class="f">零件类型 <span class="req">*</span></label>
            <select x-model="form.part_kind">
              <template x-for="k in partKindOptions" :key="k"><option :value="k" x-text="k"></option></template>
            </select></div>
          <div><label class="f">SOP <span class="req">*</span></label>
            <input type="date" x-model="form.sop"></div>
          <div><label class="f">EOP</label>
            <input type="date" x-model="form.eop"></div>
          <div><label class="f">销售负责人 <span class="req">*</span></label>
            <div style="position:relative; flex:1">
              <input x-model="form.owner_sales"
                     @click.stop="toggleAuto('edit_owner_sales','user_code')"
                     @input="autoShow = 'edit_owner_sales'; filterAuto('user_code', form.owner_sales)"
                     placeholder="搜索用户编码或名称..."
                     autocomplete="off"
                     style="width:100%">
              <div class="auto-drop" x-show="autoShow==='edit_owner_sales'" @click.away="autoShow=''"
                   style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                          background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
                <div x-show="!autoFiltered.length" style="padding:8px; color:#999">无匹配结果</div>
                <template x-for="item in autoFiltered" :key="item['user_code']">
                  <div @mousedown.prevent="selectAuto(item, form, 'owner_sales')"
                       style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                       @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
                    <div style="font-weight:500" x-text="item['user_code']"></div>
                    <div style="font-size:12px; color:#888" x-text="autoDisplay[item['user_code']] || '—'"></div>
                  </div>
                </template>
              </div>
            </div></div>
          <div><label class="f">定点概率</label>
            <input type="number" x-model="form.award_prob" placeholder="如 0.8" step="0.01" min="0" max="1"></div>
          <div><label class="f">生命周期形态</label>
            <select x-model="form.lc_shape">
              <option value="">— 选择形态 —</option>
              <template x-for="s in lcShapeOptions" :key="s"><option :value="s" x-text="s"></option></template>
            </select></div>
          <div><label class="f">单车用量</label>
            <input type="number" x-model="form.usage" placeholder="0" step="0.01"></div>
          <div><label class="f">份额</label>
            <input type="number" x-model="form.share" placeholder="0" step="0.01"></div>
        </div>
        <div class="frow">
          <div><label class="f">零件状态</label>
            <select x-model="form.status">
              <option>待启用</option><option>正常</option><option>停用</option>
            </select></div>
          <div><label class="f">替换物料</label>
            <select x-model="form.replacement_for">
              <option value="">— 非替换件 —</option>
              <template x-for="p in editProjectParts" :key="p.part_no">
                <option :value="p.part_no" x-text="p.part_no"></option>
              </template>
            </select></div></div>
        </div>
      <div class="modal-ft">
        <div class="tagline" style="gap:8px">
          <button class="b-pri" :disabled="form.busy" @click="saveForm()"
            x-text="form.busy ? '处理中…' : '保存修改'"></button>
          <button class="b-ghost" @click="closeForm()">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ 项目清单（两级 Project → Parts） ══ -->
  <div class="card"><div class="bd" style="padding:0">
    <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
      <b>项目清单</b>
      <button class="b-pri b-sm" @click="openProjectForm()">＋ 新建项目</button>
      <div class="right tagline" style="gap:8px; flex-wrap:wrap">
        <div class="chips">
          <span class="fchip" :class="{on: fStage === ''}" @click="fStage = ''; search()">全部</span>
          <template x-for="s in stageOptions" :key="s">
            <span class="fchip" :class="{on: fStage === s}"
              @click="fStage = s; search()" x-text="s"></span>
          </template>
        </div>
        <select x-model="fOemCode" @change="search()" style="width:140px">
          <option value="">OEM代码 ▾</option>
          <template x-for="o in oemCodeOptions" :key="o">
            <option :value="o" x-text="o"></option>
          </template>
        </select>
        <select x-model="fOwnerSales" @change="search()" style="width:140px">
          <option value="">销售负责人 ▾</option>
          <template x-for="s in ownerSalesOptions" :key="s">
            <option :value="s" x-text="s"></option>
          </template>
        </select>
      </div>
    </div>

    <template x-if="!projects.length">
      <div class="empty" style="padding:40px 16px" x-text="(fStage || fOemCode || fOwnerSales) ? '无匹配项目' : '暂无项目数据'"></div>
    </template>

    <template x-for="proj in projects" :key="proj.project_no">
      <div style="border-bottom:1px solid #e2e8f0">
        <!-- 项目组头部 -->
        <div class="tagline" style="padding:10px 16px; cursor:pointer; background:#f8fafc"
             @click="toggleProject(proj.project_no)">
          <span style="width:16px; font-size:12px; color:#94a3b8" x-text="proj.expanded ? '▼' : '▶'"></span>
          <b class="mono" style="color:#175e54" x-text="proj.project_no"></b>
          <span class="st" :class="'st-' + hue(proj.stage)" x-text="proj.stage"></span>
          <span class="muted" style="font-size:12px" x-text="proj.oem_code"></span>
          <span class="muted" style="font-size:12px" x-text="proj.plant_code"></span>
          <span class="muted" style="font-size:12px" x-text="proj.part_kind"></span>
          <span class="muted" style="font-size:12px" x-text="dash(proj.lc_shape)"></span>
          <span class="muted" style="font-size:12px" x-text="proj.parts.length + ' 零件'"></span>
          <div class="right tagline" style="gap:4px" @click.stop>
            <button class="b-ghost b-sm" @click="openPartForm(proj)">＋ 零件</button>
            <button class="b-ghost b-sm" @click="openEditProjectForm(proj)">编辑项目</button>
            <button class="b-ghost b-sm" @click="openStageForm(proj)">转阶段</button>
          </div>
        </div>
        <!-- 展开的零件表格 -->
        <div x-show="proj.expanded" class="scroll-x">
          <table class="tbl tight" style="margin-bottom:0">
            <tr><th>零件号</th><th>状态</th><th>替换物料</th><th>单台用量</th><th>份额</th><th>SOP</th><th>EOP</th>
              <th>负责人</th><th>定点概率</th><th class="right">操作</th></tr>
            <template x-for="part in proj.parts" :key="part.part_no">
              <tr class="data">
                <td><button class="b-link mono" @click="viewDetail(part)" x-text="part.part_no"></button></td>
                <td><span class="st" :class="part.status==='正常'?'st-info':part.status==='停用'?'st-dng':'st-warn'" x-text="part.status || '待启用'"></span></td>
                <td class="mono" x-text="dash(part.replacement_for)"></td>
                <td class="num" x-text="fmt(part.usage)"></td>
                <td class="num" x-text="fmt(part.share)"></td>
                <td class="mono" x-text="part.sop"></td>
                <td class="mono" x-text="dash(part.eop)"></td>
                <td x-text="dash(part.owner_sales)"></td>
                <td class="num" x-text="fmt(part.award_prob)"></td>
                <td class="right rowact" style="white-space:nowrap">
                  <button class="b-ghost b-sm" @click="openEdit(part)">编辑</button>
                  <button class="b-ghost b-sm" @click="removePart(part)">移除</button>
                </td>
              </tr>
            </template>
          </table>
        </div>
      </div>
    </template>

    <div class="tagline" style="padding:10px 16px">
      <span class="muted" x-text="'共 ' + list.total + ' 条记录，' + projects.length + ' 个项目'"></span>
      <div class="right tagline" style="gap:8px">
        <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1).then(() => rebuildProjects())">‹ 上一页</button>
        <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
        <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1).then(() => rebuildProjects())">下一页 ›</button>
      </div>
    </div>
  </div></div>

  <!-- ══ 详情模态 ══ -->
  <div class="modal-mask" x-show="modal.open" @click.self="closeModal()"
       @keydown.escape.window="closeModal()" x-cloak>
    <div class="modal">
      <div class="modal-hd">
        <div><div class="docno" x-text="modal.d ? modal.d.project_no : '项目详情'"></div>
          <div class="sub" x-text="modal.d ? '零件 ' + modal.d.part_no : ''"></div></div>
        <template x-if="modal.d">
          <span class="st" :class="'st-' + hue(modal.d.stage)" x-text="modal.d.stage"></span>
        </template>
        <button class="x" @click="closeModal()">✕</button>
      </div>
      <div class="modal-bd">
        <template x-if="modal.loading">
          <div class="loadbox"><span class="spin">◌</span><br>载入项目明细…</div>
        </template>
        <template x-if="!modal.loading && modal.d">
          <div>
            <div class="sec">基本信息</div>
            <div class="kv">
              <div><div class="k">项目编号</div><div class="v mono" x-text="dash(modal.d.project_no)"></div></div>
              <div><div class="k">零件号</div><div class="v mono" x-text="dash(modal.d.part_no)"></div></div>
              <div><div class="k">阶段</div><div class="v"><span class="st" :class="'st-' + hue(modal.d.stage)" x-text="dash(modal.d.stage)"></span></div></div>
              <div><div class="k">零件状态</div><div class="v"><span class="st" :class="modal.d.status==='正常'?'st-info':modal.d.status==='停用'?'st-dng':'st-warn'" x-text="dash(modal.d.status)"></span></div></div>
              <div><div class="k">替换物料</div><div class="v mono" x-text="dash(modal.d.replacement_for)"></div></div>
              <div><div class="k">OEM代码</div><div class="v mono" x-text="dash(modal.d.oem_code)"></div></div>
              <div><div class="k">工厂代码</div><div class="v mono" x-text="dash(modal.d.plant_code)"></div></div>
            </div>

            <div class="sec">客户产品</div>
            <div class="kv">
              <div><div class="k">车型</div><div class="v" x-text="dash(modal.d.veh_model)"></div></div>
              <div><div class="k">平台</div><div class="v" x-text="dash(modal.d.platform)"></div></div>
              <div><div class="k">零件类型</div><div class="v" x-text="dash(modal.d.part_kind)"></div></div>
            </div>

            <div class="sec">量纲</div>
            <div class="kv">
              <div><div class="k">用量</div><div class="v" x-text="fmt(modal.d.usage)"></div></div>
              <div><div class="k">份额</div><div class="v" x-text="fmt(modal.d.share)"></div></div>
            </div>

            <div class="sec">生命周期</div>
            <div class="kv">
              <div><div class="k">生命周期形态</div><div class="v" x-text="dash(modal.d.lc_shape)"></div></div>
              <div><div class="k">定点概率</div><div class="v" x-text="fmt(modal.d.award_prob)"></div></div>
            </div>

            <div class="sec">责任信息</div>
            <div class="kv">
              <div><div class="k">销售负责人</div><div class="v mono" x-text="dash(modal.d.owner_sales)"></div></div>
            </div>

            <div class="sec">时间信息</div>
            <div class="kv">
              <div><div class="k">SOP</div><div class="v mono" x-text="dash(modal.d.sop)"></div></div>
              <div><div class="k">EOP</div><div class="v mono" x-text="dash(modal.d.eop)"></div></div>
              <div><div class="k">创建时间</div><div class="v mono" x-text="fmtTime(modal.d.created_at)"></div></div>
              <div><div class="k">更新时间</div><div class="v mono" x-text="fmtTime(modal.d.updated_at)"></div></div>
            </div>

            <!-- 阶段流转子模态 -->
            <template x-if="stageForm.show && !stageForm.project">
              <div>
                <div class="sec">阶段流转</div>
                <div class="frow">
                  <div><label class="f">目标阶段 <span class="req">*</span></label>
                    <select x-model="stageForm.new_stage">
                      <option value="">— 选择目标阶段 —</option>
                      <template x-for="s in stageOptions" :key="s">
                        <option :value="s" x-text="s" :disabled="s === modal.d.stage"></option>
                      </template>
                    </select></div>
                  <div style="grid-column: span 2"><label class="f">变更原因 <span class="req">*</span></label>
                    <textarea x-model="stageForm.reason" placeholder="请填写阶段变更原因" rows="2"></textarea></div>
                  <div style="display:flex; align-items:flex-end">
                    <button class="b-pri b-sm" :disabled="stageForm.busy" @click="saveStage()"
                      x-text="stageForm.busy ? '处理中…' : '确认流转'"></button>
                    <button class="b-ghost b-sm" @click="closeStageForm()" style="margin-left:6px">取消</button></div>
                </div>
              </div>
            </template>

            <!-- 变更日志子表 -->
            <div class="sec" x-text="'变更日志 · ' + ((modal.d.change_log || []).length) + ' 条'"></div>
            <div class="scroll-x">
              <table class="tbl tight">
                <tr><th>变更日期</th><th>字段名</th><th>旧值</th><th>新值</th><th>原因</th><th>操作人</th></tr>
                <template x-if="!(modal.d.change_log || []).length">
                  <tr><td colspan="6" class="empty">暂无变更记录</td></tr>
                </template>
                <template x-for="l in modal.d.change_log || []" :key="l.change_date || ''">
                  <tr>
                    <td class="mono" x-text="fmtTime(l.change_date)"></td>
                    <td x-text="dash(l.field_name)"></td>
                    <td x-text="dash(l.old_value)"></td>
                    <td x-text="dash(l.new_value)"></td>
                    <td x-text="dash(l.reason)"></td>
                    <td x-text="dash(l.operator)"></td>
                  </tr>
                </template>
              </table>
            </div>

            <details class="raw"><summary>原始数据</summary>
              <pre class="json" x-text="JSON.stringify(modal.d, null, 2)"></pre></details>
          </div>
        </template>
      </div>
      <div class="modal-ft" x-show="modal.d">
        <template x-if="modal.d">
          <div class="tagline" style="gap:8px">
            <button class="b-ghost" @click="openEdit(modal.d)">编辑</button>
            <button class="b-pri" @click="openStageForm()" x-show="!stageForm.show">阶段迁移</button>
            <button class="b-ghost right" @click="closeModal()">关闭</button>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ══ 项目级阶段迁移模态 ══ -->
  <div class="modal-mask" x-show="stageForm.show && stageForm.project" @click.self="closeStageForm()"
       @keydown.escape.window="closeStageForm()" x-cloak>
    <div class="modal" style="max-width:480px">
      <div class="modal-hd">
        <div><div class="docno" x-text="'阶段迁移 · ' + (stageForm.project ? stageForm.project.project_no : '')"></div>
          <div class="sub">将该项目下全部零件的阶段统一迁移</div></div>
        <button class="x" @click="closeStageForm()">✕</button>
      </div>
      <div class="modal-bd">
        <template x-if="stageForm.project">
          <div class="kv" style="margin-bottom:12px">
            <div><div class="k">当前阶段</div><div class="v"><span class="st" :class="'st-' + hue(stageForm.project.stage)" x-text="stageForm.project.stage"></span></div></div>
            <div><div class="k">零件数</div><div class="v" x-text="stageForm.project.parts.length"></div></div>
          </div>
        </template>
        <div class="frow">
          <div><label class="f">目标阶段 <span class="req">*</span></label>
            <select x-model="stageForm.new_stage">
              <option value="">— 选择目标阶段 —</option>
              <template x-for="s in stageOptions" :key="s">
                <option :value="s" x-text="s"
                  :disabled="stageForm.project && s === stageForm.project.stage"></option>
              </template>
            </select></div>
          <div style="grid-column: span 2"><label class="f">变更原因 <span class="req">*</span></label>
            <textarea x-model="stageForm.reason" placeholder="请填写阶段变更原因" rows="2"></textarea></div>
        </div>
      </div>
      <div class="modal-ft">
        <div class="tagline" style="gap:8px">
          <button class="b-pri" :disabled="stageForm.busy" @click="saveStage()"
            x-text="stageForm.busy ? '处理中…' : '确认迁移'"></button>
          <button class="b-ghost" @click="closeStageForm()">取消</button>
        </div>
      </div>
    </div>
  </div>

</div>
