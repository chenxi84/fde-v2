<div>
  <!-- 新建表单 -->
  <div class="collapse" :class="{open: form.show}">
    <div class="card mb0">
      <div class="hd">
        <h3 x-text="form.editMode ? '编辑借用单 · ' + form.editJyNo : '新建基线借用单'"></h3>
        <span class="hint">登记历史不足零件的基线例外 · BR-02 校准优先</span>
        <button class="b-ghost b-sm right" @click="form.show = false; resetForm()">收起</button>
      </div>
      <div class="bd">
        <div class="frow">
          <div><label class="f">零件号 <span class="req">*</span></label>
            <div style="position:relative; flex:1">
              <input x-model="form.part_no"
                     @click.stop="toggleAuto('form_part_no','part_no')"
                     @input="autoShow = 'form_part_no'; filterAuto('part_no', form.part_no)"
                     placeholder="搜索零件号或名称..."
                     autocomplete="off"
                     style="width:100%">
              <div class="auto-drop" x-show="autoShow==='form_part_no'" @click.away="autoShow=''"
                   style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                          background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
                <div x-show="!autoFiltered.length" style="padding:8px; color:#999">无匹配结果</div>
                <template x-for="item in autoFiltered" :key="item['part_no']">
                  <div @mousedown.prevent="selectAuto(item, form, 'part_no')"
                       style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                       @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
                    <div style="font-weight:500" x-text="item['part_no']"></div>
                    <div style="font-size:12px; color:#888" x-text="autoDisplay[item['part_no']] || '—'"></div>
                  </div>
                </template>
              </div>
            </div></div>
          <div><label class="f">适用车型 <span class="req">*</span></label>
            <div style="position:relative; flex:1">
              <input x-model="form.veh_model"
                     @click.stop="toggleAuto('form_veh_model','vehicle_code')"
                     @input="autoShow = 'form_veh_model'; filterAuto('vehicle_code', form.veh_model)"
                     placeholder="搜索车型代码或名称..."
                     autocomplete="off"
                     style="width:100%">
              <div class="auto-drop" x-show="autoShow==='form_veh_model'" @click.away="autoShow=''"
                   style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                          background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
                <div x-show="!autoFiltered.length" style="padding:8px; color:#999">无匹配结果</div>
                <template x-for="item in autoFiltered" :key="item['vehicle_code']">
                  <div @mousedown.prevent="selectAuto(item, form, 'veh_model', 'vehicle_code')"
                       style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                       @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
                    <div style="font-weight:500" x-text="item['vehicle_code']"></div>
                    <div style="font-size:12px; color:#888" x-text="autoDisplay[item['vehicle_code']] || '—'"></div>
                  </div>
                </template>
              </div>
            </div></div>
          <div><label class="f">历史月数 <span class="req">*</span></label>
            <input type="number" x-model="form.hist_months" placeholder="如 6" min="0"></div>
          <div><label class="f">关联加工批次 <span class="req">*</span></label>
            <input x-model="form.proc_batch" placeholder="D04 批次编号"></div>
          <div style="display:flex; align-items:flex-end">
            <button class="b-ghost b-sm" @click="form.more = !form.more"
              x-text="form.more ? '收起字段 ▴' : '更多字段 ▾'"></button></div>
        </div>
        <div class="collapse" :class="{open: form.more}">
          <div class="frow" style="padding-top:10px">
            <div><label class="f">借用方法 <span class="req">*</span></label>
              <select x-model="form.borrow_method">
                <option value="">— 选择借法 —</option>
                <option>先导指标</option><option>类比</option><option>模板拟合</option><option>上移</option><option>池化</option>
              </select></div>
            <div><label class="f">借用来源 <span class="req">*</span></label>
              <input x-model="form.borrow_source" placeholder="相似车型 / 模板编号 / OEM 预测版本"></div>
            <div style="grid-column: span 2"><label class="f">来源参数（峰值/衰减率/分摊权重，JSON）<span class="req">*</span></label>
              <textarea x-model="form.source_params" rows="2" placeholder="JSON"></textarea></div>
            <div style="grid-column: span 2"><label class="f">推导基线值（M0~M+N 各期，JSON）<span class="req">*</span></label>
              <textarea x-model="form.derived_qty" rows="3" placeholder='{"M0":1200,"M1":1250,...}'></textarea></div>
            <div style="grid-column: span 2"><label class="f">校准记录 <span class="req" x-show="form.hist_months > 0">*</span></label>
              <textarea x-model="form.calibration" rows="2" placeholder="若有早期数据，必须填写校准记录"></textarea></div>
          </div>
          <div class="muted mt8" x-show="form.hist_months > 0 && !form.calibration">
            提醒：有自身早期数据必须校准参数，纯照搬模板不予审核通过（BR-02）</div>
        </div>
        <div class="muted mt8">五种借法（先导指标/类比/模板拟合/上移/池化）保证"借来的基线"可复核、可回溯</div>
        <div class="mt12 tagline">
          <button class="b-pri right" :disabled="form.busy" @click="saveForm()"
            x-text="form.busy ? '处理中…' : '创建借用单'"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 列表 -->
  <div class="card" :class="form.show ? 'mt12' : ''"><div class="bd" style="padding:0">
    <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
      <b>借用单列表</b>
      <button class="b-pri b-sm" @click="resetForm(); form.show = !form.show">＋ 新建借用单</button>
      <div class="right tagline" style="gap:8px; flex-wrap:wrap">
        <div class="chips">
          <template x-for="s in ['', '待审核', '生效', '已转自产', '已关闭']" :key="s || '全部'">
            <span class="fchip" :class="{on: fStatus === s}"
              @click="fStatus = s; list.load(1)" x-text="s || '全部'"></span>
          </template>
        </div>
        <select x-model="fMethod" @change="search()" style="width:130px">
          <option value="">全部方法</option>
          <option value="先导指标">先导指标</option>
          <option value="类比">类比</option>
          <option value="模板拟合">模板拟合</option>
          <option value="上移">上移</option>
          <option value="池化">池化</option>
        </select>
        <input x-model="fPartNo" @keydown.enter="search()" placeholder="零件号" style="width:120px">
        <button class="b-ghost b-sm" @click="search()">查询</button>
      </div>
    </div>
    <div class="scroll-x">
      <table class="tbl tight">
        <tr><th>借用单号</th><th>零件号</th><th>车型</th><th>历史月数</th><th>借法</th><th>借用来源</th><th>推导基线</th><th>加工批次</th><th>状态</th><th>审核人</th><th>审核时间</th><th class="right">操作</th></tr>
        <template x-if="!list.items.length">
          <tr><td colspan="12" class="empty"
            x-text="(fStatus || fMethod || fPartNo) ? '无符合条件的借用单' : '暂无借用单 —— 点「新建借用单」创建'"></td></tr>
        </template>
        <template x-for="d in list.items" :key="d.jy_no">
          <tr class="data">
            <td><button class="b-link mono" @click="viewJy(d)" x-text="d.jy_no"></button></td>
            <td class="mono" x-text="dash(d.part_no)"></td>
            <td x-text="dash(d.veh_model)"></td>
            <td class="num" x-text="dash(d.hist_months)"></td>
            <td x-text="dash(d.borrow_method)"></td>
            <td x-text="dash(d.borrow_source)"></td>
            <td class="mono"><span x-text="tryParse(d.derived_qty) ? Object.entries(tryParse(d.derived_qty)).filter((_,i)=>i===0).map(e=>e[0]':'+e[1]).join('') : dash(d.derived_qty)"></span></td>
            <td class="mono" x-text="dash(d.proc_batch)"></td>
            <td><span class="st" :class="'st-' + hue(d.status)" x-text="statusLabel(d.status)"></span></td>
            <td x-text="dash(d.reviewer)"></td>
            <td class="mono" x-text="fmtTime(d.review_date)"></td>
            <td class="right rowact" style="white-space:nowrap">
              <button class="b-pri b-sm" x-show="d.status === '待审核'" @click="viewJy(d)">审核</button>
              <button class="b-pri b-sm" x-show="d.status === '生效'" @click="getDerivedBaseline(d)">取推导基线</button>
              <button class="b-ghost b-sm" @click="viewJy(d)">查看</button>
            </td>
          </tr>
        </template>
      </table>
    </div>
    <div class="tagline" style="padding:10px 16px">
      <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
      <div class="right tagline" style="gap:8px">
        <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
        <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
        <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
      </div>
    </div>
  </div></div>

  <!-- 详情模态 -->
  <div class="modal-mask" x-show="modal.open" @click.self="closeModal()"
       @keydown.escape.window="closeModal()" x-cloak>
    <div class="modal">
      <div class="modal-hd">
        <div>
          <div class="docno" x-text="modal.d ? modal.d.jy_no : '基线借用单'"></div>
          <div class="sub">基线借用台账 · BASELINE BORROWING</div>
        </div>
        <template x-if="modal.d">
          <span class="st" :class="'st-' + hue(modal.d.status)" x-text="statusLabel(modal.d.status)"></span>
        </template>
        <button class="x" @click="closeModal()">✕</button>
      </div>
      <div class="modal-bd">
        <template x-if="modal.loading">
          <div class="loadbox"><span class="spin">◌</span><br>载入借用单明细…</div>
        </template>
        <template x-if="!modal.loading && modal.d">
          <div>
            <!-- 基本信息 -->
            <div class="sec">基本信息</div>
            <div class="kv">
              <div><div class="k">借用单号</div><div class="v mono" x-text="dash(modal.d.jy_no)"></div></div>
              <div><div class="k">零件号</div><div class="v mono" x-text="dash(modal.d.part_no)"></div></div>
              <div><div class="k">适用车型</div><div class="v" x-text="dash(modal.d.veh_model)"></div></div>
              <div><div class="k">历史月数</div><div class="v" x-text="dash(modal.d.hist_months)"></div></div>
              <div><div class="k">加工批次</div><div class="v mono" x-text="dash(modal.d.proc_batch)"></div></div>
            </div>

            <!-- 借用信息 -->
            <div class="sec">借用信息</div>
            <div class="kv">
              <div><div class="k">借用方法</div><div class="v" x-text="dash(modal.d.borrow_method)"></div></div>
              <div><div class="k">借用来源</div><div class="v" x-text="dash(modal.d.borrow_source)"></div></div>
            </div>

            <!-- 来源参数 -->
            <div class="sec">来源参数</div>
            <div class="kv">
              <div style="grid-column: span 2"><div class="k">来源参数</div><div class="v">
                <pre class="json" x-text="tryParse(modal.d.source_params) ? JSON.stringify(tryParse(modal.d.source_params), null, 2) : dash(modal.d.source_params)"></pre>
              </div></div>
            </div>

            <!-- 早期校准 -->
            <div class="sec">早期校准</div>
            <div class="kv">
              <div style="grid-column: span 2"><div class="k">校准记录</div><div class="v pre-wrap" x-text="dash(modal.d.calibration)"></div></div>
            </div>

            <!-- 推导基线 -->
            <div class="sec">推导基线</div>
            <div class="kv">
              <div style="grid-column: span 2"><div class="k">推导基线值（derived_qty）</div><div class="v">
                <pre class="json" x-text="tryParse(modal.d.derived_qty) ? JSON.stringify(tryParse(modal.d.derived_qty), null, 2) : dash(modal.d.derived_qty)"></pre>
              </div></div>
            </div>

            <!-- 关联信息 -->
            <div class="sec">关联信息</div>
            <div class="kv">
            </div>

            <!-- 时间 -->
            <div class="sec">时间</div>
            <div class="kv">
              <div><div class="k">审核时间</div><div class="v mono" x-text="fmtTime(modal.d.review_date)"></div></div>
              <div><div class="k">创建时间</div><div class="v mono" x-text="fmtTime(modal.d.created_at)"></div></div>
            </div>

            <!-- 人员 -->
            <div class="sec">人员</div>
            <div class="kv">
              <div><div class="k">审核人</div><div class="v" x-text="dash(modal.d.reviewer)"></div></div>
            </div>

            <!-- 审核表单 -->
            <template x-if="review.show && modal.d.status === '待审核'">
              <div>
                <div class="sec">审核操作</div>
                <div class="frow">
                  <div><label class="f">审核结论 <span class="req">*</span></label>
                    <select x-model="review.approved">
                      <option :value="true">通过（状态→生效）</option>
                      <option :value="false">驳回（状态保留待审核）</option>
                    </select></div>
                  <div style="grid-column: span 2"><label class="f">审核意见 <span class="req">*</span></label>
                    <textarea x-model="review.comment" rows="2" placeholder="审核意见必填"></textarea></div>
                  <div style="display:flex; align-items:flex-end">
                    <button class="b-pri b-sm" :disabled="review.busy" @click="submitReview()"
                      x-text="review.busy ? '提交中…' : (review.approved ? '审核通过' : '驳回')"></button></div>
                </div>
                <div class="muted mt8" x-show="modal.d.hist_months > 0 && !modal.d.calibration">
                  注意：有早期数据但无校准记录——BR-02 校验将驳回</div>
              </div>
            </template>

            <!-- 校准表单 -->
            <template x-if="calibrateForm.show && (modal.d.status === '待审核' || modal.d.status === '生效')">
              <div>
                <div class="sec">校准操作</div>
                <div class="frow">
                  <div style="grid-column: span 3"><label class="f">校准数据 <span class="req">*</span></label>
                    <textarea x-model="calibrateForm.calibration_data" rows="3" placeholder="校准数据 JSON 或描述"></textarea></div>
                  <div style="display:flex; align-items:flex-end">
                    <button class="b-pri b-sm" :disabled="calibrateForm.busy" @click="submitCalibrate()"
                      x-text="calibrateForm.busy ? '处理中…' : '提交校准'"></button></div>
                </div>
              </div>
            </template>

            <!-- 关闭表单 -->
            <template x-if="closeDlg.show && modal.d.status === '生效'">
              <div>
                <div class="sec">关闭借用单</div>
                <div class="frow">
                  <div style="grid-column: span 2"><label class="f">关闭原因 <span class="req">*</span></label>
                    <textarea x-model="closeDlg.reason" rows="2" placeholder="含"转自产"→已转自产，否则→已关闭"></textarea></div>
                  <div style="display:flex; align-items:flex-end">
                    <button class="b-dng b-sm" :disabled="closeDlg.busy" @click="submitClose()"
                      x-text="closeDlg.busy ? '处理中…' : '确认关闭'"></button></div>
                </div>
                <div class="muted mt8">含"转自产"/"历史充足"/"切换"关键词→已转自产；否则→已关闭</div>
              </div>
            </template>

            <details class="raw"><summary>原始数据</summary>
              <pre class="json" x-text="JSON.stringify(modal.d, null, 2)"></pre></details>
          </div>
        </template>
      </div>
      <div class="modal-ft" x-show="modal.d">
        <template x-if="modal.d">
          <div class="tagline" style="gap:8px">
            <!-- 待审核: 审核, 校准, 编辑 -->
            <template x-if="modal.d.status === '待审核' && !review.show">
              <button class="b-pri" @click="openReview()">审核</button>
            </template>
            <template x-if="modal.d.status === '待审核' && review.show">
              <button class="b-ghost" @click="review.show = false">收起审核</button>
            </template>
            <template x-if="modal.d.status === '待审核' && !calibrateForm.show">
              <button class="b-pri" @click="openCalibrate()">校准</button>
            </template>
            <template x-if="modal.d.status === '待审核' && calibrateForm.show">
              <button class="b-ghost" @click="calibrateForm.show = false">收起校准</button>
            </template>
            <template x-if="modal.d.status === '待审核'">
              <button class="b-ghost" @click="editJy(modal.d); closeModal()">编辑</button>
            </template>
            <!-- 生效: 校准, 关闭, 取推导基线 -->
            <template x-if="modal.d.status === '生效' && !calibrateForm.show">
              <button class="b-pri" @click="openCalibrate()">校准</button>
            </template>
            <template x-if="modal.d.status === '生效' && calibrateForm.show">
              <button class="b-ghost" @click="calibrateForm.show = false">收起校准</button>
            </template>
            <template x-if="modal.d.status === '生效' && !closeDlg.show">
              <button class="b-dng" @click="openClose()">关闭借用单</button>
            </template>
            <template x-if="modal.d.status === '生效' && closeDlg.show">
              <button class="b-ghost" @click="closeDlg.show = false">收起关闭</button>
            </template>
            <template x-if="modal.d.status === '生效'">
              <button class="b-ghost" @click="getDerivedBaseline(modal.d)">取推导基线</button>
            </template>
            <!-- 已转自产 / 已关闭: readonly -->
            <span class="muted" x-show="['已转自产', '已关闭'].includes(modal.d.status)">已终态 · 不可操作</span>
            <button class="b-ghost right" @click="closeModal()">关闭</button>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
