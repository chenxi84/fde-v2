<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
    <b>物料历史数据</b>
    <span class="muted">实际调拨量 · 零件×期间×OEM×工厂</span>
    <div class="right tagline" style="gap:8px">
      <input x-model="keyword" @keydown.enter="search()" placeholder="零件号 / OEM" style="width:180px">
      <select x-model="fOem" @change="list.load(1)" style="width:130px">
        <option value="">全部OEM</option>
        <template x-for="o in oemOptions" :key="o"><option x-text="o" :value="o"></option></template>
      </select>
      <button class="b-ghost b-sm" @click="search()">查询</button>
      <button class="b-pri b-sm" @click="openCreate()">+ 单条录入</button>
      <button class="b-pri b-sm" @click="openImport()">批量导入</button>
    </div>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>零件号</th><th>项目号</th><th>期间</th><th>实际量</th><th>OEM</th><th>工厂</th><th>来源</th></tr>
      <template x-if="!list.items.length">
        <tr><td colspan="7" class="empty" x-text="keyword ? '无匹配数据' : '暂无数据'"></td></tr>
      </template>
      <template x-for="d in list.items" :key="d.part_no + '|' + d.project_no + '|' + d.period + '|' + d.oem_code + '|' + d.plant_code">
        <tr class="data">
          <td class="mono" x-text="d.part_no"></td>
          <td class="mono" x-text="dash(d.project_no)"></td>
          <td class="mono" x-text="d.period"></td>
          <td class="mono" x-text="fmt(d.actual_qty)"></td>
          <td x-text="d.oem_code"></td>
          <td x-text="d.plant_code"></td>
          <td x-text="d.source"></td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:10px 16px">
    <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
    <div class="right tagline" style="gap:8px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">上一页</button>
      <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
      <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页</button>
    </div>
  </div>
</div></div>

<!-- 单条录入 -->
<div class="modal-mask" x-show="form.open" @click.self="closeCreate()" x-cloak>
  <div class="modal" style="max-width:480px">
    <div class="modal-hd"><div><div class="docno">录入实际调拨量</div></div>
      <button class="x" @click="closeCreate()">✕</button></div>
    <div class="modal-bd">
      <div class="frow"><div>
        <label class="f">零件号 <span class="req">*</span></label>
        <input x-model="form.part_no" placeholder="如 8620A-001"></div><div>
        <label class="f">项目号</label>
        <input x-model="form.project_no" placeholder="如 PROJ-001"></div></div>
      <div class="frow"><div>
        <label class="f">期间 <span class="req">*</span></label>
        <input x-model="form.period" placeholder="如 2026-08"></div><div>
        <label class="f">实际量 <span class="req">*</span></label>
        <input type="number" step="0.01" x-model="form.actual_qty"></div></div>
      <div class="frow"><div>
        <label class="f">OEM <span class="req">*</span></label>
        <input x-model="form.oem_code" placeholder="如 OEM-TOYOTA"></div><div>
        <label class="f">工厂</label>
        <input x-model="form.plant_code" placeholder="如 PLANT-A1"></div></div>
      <div class="frow"><div>
        <label class="f">来源</label>
        <select x-model="form.source"><option>手工</option><option>自动</option></select></div><div></div></div>
      <div class="mt12 tagline">
        <button class="b-pri right" :disabled="form.busy" @click="saveForm()"
          x-text="form.busy ? '录入中...' : '录入'"></button>
      </div>
    </div>
  </div>
</div>

<!-- 批量导入 -->
<div class="modal-mask" x-show="importForm.open" @click.self="closeImport()" x-cloak>
  <div class="modal" style="max-width:640px">
    <div class="modal-hd"><div><div class="docno">批量导入历史数据</div></div>
      <button class="x" @click="closeImport()">✕</button></div>
    <div class="modal-bd">
      <div class="muted mb8">粘贴 JSON 数组，每项含 part_no, project_no, period, actual_qty, oem_code, plant_code（source 可选）</div>
      <textarea x-model="importForm.text" rows="12" style="width:100%; font-family:monospace; font-size:12px"
        placeholder='[{"part_no":"P001","project_no":"PRJ1","period":"2026-06","actual_qty":100,"oem_code":"OEM-TOYOTA","plant_code":"PLANT-A1"}, ...]'></textarea>
      <template x-if="importForm.result">
        <div class="mt8" style="color:#166534; font-weight:500" x-text="'成功导入 ' + importForm.result.imported + ' 条'"></div>
      </template>
    </div>
    <div class="modal-ft">
      <div class="right tagline" style="gap:8px">
        <button class="b-ghost" @click="closeImport()">取消</button>
        <button class="b-pri" :disabled="importForm.busy" @click="submitImport()"
          x-text="importForm.busy ? '导入中...' : '批量导入'"></button>
      </div>
    </div>
  </div>
</div>
