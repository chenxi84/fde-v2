<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
    <b>车型列表</b>
    <span class="muted">主数据 · 车型/平台</span>
    <div class="right tagline" style="gap:8px">
      <input x-model="keyword" @keydown.enter="search()" placeholder="编号 / 名称" style="width:220px">
      <button class="b-ghost b-sm" @click="search()">查询</button>
      <button class="b-pri b-sm" @click="openCreate()">+ 新建车型</button>
    </div>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>车型编号</th><th>车型名称</th><th>状态</th><th>创建时间</th></tr>
      <template x-if="!list.items.length">
        <tr><td colspan="4" class="empty"
          x-text="keyword ? '无符合条件的车型' : '暂无车型 —— 点「新建车型」创建'"></td></tr>
      </template>
      <template x-for="d in list.items" :key="d.vehicle_code">
        <tr class="data">
          <td><button class="b-link mono" @click="viewX(d)" x-text="d.vehicle_code"></button></td>
          <td x-text="dash(d.vehicle_name)"></td>
          <td><span class="st" :class="'st-' + hue(d.status)" x-text="statusLabel(d.status)"></span></td>
          <td class="mono" x-text="fmtTime(d.created_at)"></td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:10px 16px">
    <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
    <div class="right tagline" style="gap:8px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
      <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
      <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
    </div>
  </div>
</div></div>

<!-- 详情模态 -->
<div class="modal-mask" x-show="modalX.open" @click.self="closeModal()"
     @keydown.escape.window="closeModal()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div class="docno" x-text="modalX.d ? '车型详情 · ' + modalX.d.vehicle_code : '车型详情'"></div>
        <div class="sub">车型主数据 · VEHICLE MASTER</div>
      </div>
      <template x-if="modalX.d">
        <span class="st" :class="'st-' + hue(modalX.d.status)" x-text="statusLabel(modalX.d.status)"></span>
      </template>
      <button class="x" @click="closeModal()">✕</button>
    </div>
    <div class="modal-bd">
      <template x-if="modalX.loading">
        <div class="loadbox"><span class="spin">◌</span><br>载入车型明细…</div>
      </template>
      <template x-if="!modalX.loading && modalX.d">
        <div>
          <div class="sec">基本信息</div>
          <div class="kv">
            <div><div class="k">车型编号</div><div class="v mono" x-text="dash(modalX.d.vehicle_code)"></div></div>
            <div><div class="k">车型名称</div><div class="v" x-text="dash(modalX.d.vehicle_name)"></div></div>
          </div>
          <div class="sec">状态</div>
          <div class="kv">
            <div><div class="k">状态</div><div class="v"><span class="st" :class="'st-' + hue(modalX.d.status)" x-text="statusLabel(modalX.d.status)"></span></div></div>
          </div>
          <div class="sec">审计信息</div>
          <div class="kv">
            <div><div class="k">创建时间</div><div class="v mono" x-text="fmtTime(modalX.d.created_at)"></div></div>
          </div>
          <details class="raw"><summary>原始数据</summary>
            <pre class="json" x-text="JSON.stringify(modalX.d, null, 2)"></pre>
          </details>
        </div>
      </template>
    </div>
    <div class="modal-ft" x-show="modalX.d">
      <div class="tagline" style="gap:8px">
        <span class="muted">车型主数据</span>
        <button class="b-ghost right" @click="closeModal()">关闭</button>
      </div>
    </div>
  </div>
</div>

<!-- 创建模态 -->
<div class="modal-mask" x-show="form.open" @click.self="closeCreate()"
     @keydown.escape.window="closeCreate()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div class="docno">新建车型</div>
        <div class="sub">车型主数据 · NEW VEHICLE</div>
      </div>
      <button class="x" @click="closeCreate()">✕</button>
    </div>
    <div class="modal-bd">
      <div class="frow">
        <div>
          <label class="f">车型编号 <span class="req">*</span></label>
          <input x-model="form.vehicle_code" placeholder="如 V001">
        </div>
        <div>
          <label class="f">车型名称 <span class="req">*</span></label>
          <input x-model="form.vehicle_name" placeholder="车型名称">
        </div>
      </div>
      <div class="frow">
        <div>
          <label class="f">状态</label>
          <select x-model="form.status">
            <option value="active">启用</option>
            <option value="inactive">停用</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <div class="tagline" style="gap:8px">
        <span class="muted">编号唯一性由后端校验</span>
        <div class="right tagline" style="gap:8px">
          <button class="b-ghost" @click="closeCreate()">取消</button>
          <button class="b-pri" :disabled="form.busy" @click="saveForm()"
            x-text="form.busy ? '创建中…' : '创建'"></button>
        </div>
      </div>
    </div>
  </div>
</div>
