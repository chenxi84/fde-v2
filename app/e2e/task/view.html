<div class="card mt12"><div class="bd" style="padding:0">
  <!-- ══ 过滤区：标题 + 状态 chips + 负责人/优先级下拉（与 task.list 参数一一对应；契约无 keyword，不设搜索框） ══ -->
  <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
    <b>任务台账</b>
    <span class="muted" style="font-size:12px">状态机 · 待办 → 进行中 → 已完成</span>
    <div class="right tagline" style="gap:8px; flex-wrap:wrap">
      <div class="chips">
        <template x-for="s in ['', '待办', '进行中', '已完成']" :key="s || '全部'">
          <span class="fchip" :class="{on: fStatus === s}"
            @click="fStatus = s; list.load(1)" x-text="s || '全部'"></span>
        </template>
      </div>
      <select x-model="fAssignee" @change="search()" style="width:150px">
        <option value="">全部负责人</option>
        <template x-for="m in memberList" :key="m.member_no">
          <option :value="m.member_no" x-text="m.name || m.member_no"></option>
        </template>
      </select>
      <select x-model="fPriority" @change="search()" style="width:120px">
        <option value="">全部优先级</option>
        <option value="low">low</option>
        <option value="high">high</option>
      </select>
      <button class="b-ghost b-sm" @click="resetFilters()">重置</button>
      <button class="b-pri b-sm" @click="openCreate()">＋ 新建任务</button>
    </div>
  </div>
  <!-- ══ 表格：列 ⊆ 详情字段集；序 = 单号 → 状态 → 归属 → 属性 → 时间 ══ -->
  <div class="scroll-x">
    <table class="tbl tight">
      <tr>
        <th>任务编号</th><th>标题</th><th>状态</th><th>负责人</th><th>优先级</th>
        <th>描述</th><th>创建时间</th><th>更新时间</th><th class="right">操作</th>
      </tr>
      <template x-if="!list.items.length"><tr><td colspan="9" class="empty">无匹配数据</td></tr></template>
      <template x-for="d in list.items" :key="d.task_no">
        <tr class="data">
          <td><button class="b-link mono" @click="viewX(d)" x-text="d.task_no"></button></td>
          <td><div style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="d.title" x-text="dash(d.title)"></div></td>
          <td><span class="st" :class="'st-' + hue(d.status)" x-text="d.status"></span></td>
          <td>
            <span class="mono" x-text="dash(d.assignee_member_no)"></span>
            <template x-if="memberName(d.assignee_member_no)">
              <div class="muted" style="font-size:11px" x-text="memberName(d.assignee_member_no)"></div>
            </template>
          </td>
          <td><span class="st" :class="'st-' + hue(d.priority)" x-text="dash(d.priority)"></span></td>
          <td><div class="cell-ellipsis" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="dash(d.description)"></div></td>
          <td class="mono" x-text="fmtTime(d.created_at)"></td>
          <td class="mono" x-text="fmtTime(d.updated_at)"></td>
          <td class="right rowact">
            <button class="b-pri b-sm" x-show="d.status === '待办'" @click="act(d, 'start')">启动</button>
            <button class="b-pri b-sm" x-show="d.status === '进行中'" @click="act(d, 'complete')">完成</button>
            <button class="b-ghost b-sm" x-show="d.status === '进行中'" @click="act(d, 'reopen')">退回</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <!-- ══ 分页条 ══ -->
  <div class="tagline" style="padding:10px 16px">
    <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
    <div class="right tagline" style="gap:8px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
      <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
      <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
    </div>
  </div>
</div></div>

<!-- ════════════ 详情模态（查全：task.get 全字段） ════════════ -->
<div class="modal-mask" x-show="modalX.open" @click.self="closeX()"
     @keydown.escape.window="closeX()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div><div class="docno" x-text="modalX.d ? modalX.d.task_no : '任务详情'"></div>
        <div class="sub">任务详情 · TASK DETAIL</div></div>
      <template x-if="modalX.d">
        <span class="st" :class="'st-' + hue(modalX.d.status)" x-text="modalX.d.status"></span>
      </template>
      <button class="x" @click="closeX()">✕</button>
    </div>
    <div class="modal-bd">
      <template x-if="modalX.loading">
        <div class="loadbox"><span class="spin">◌</span><br>载入明细…</div>
      </template>
      <template x-if="!modalX.loading && modalX.d">
        <div>
          <div class="sec">基本信息</div>
          <div class="kv">
            <div><div class="k">任务编号</div><div class="v mono" x-text="dash(modalX.d.task_no)"></div>
              <div class="muted" style="font-size:11px">系统生成 · 全局唯一</div></div>
            <div><div class="k">状态</div><div class="v"><span class="st" :class="'st-' + hue(modalX.d.status)" x-text="dash(modalX.d.status)"></span></div>
              <div class="muted" style="font-size:11px">初始恒为「待办」</div></div>
            <div style="grid-column: span 2"><div class="k">标题</div><div class="v" x-text="dash(modalX.d.title)"></div></div>
            <div><div class="k">优先级</div><div class="v"><span class="st" :class="'st-' + hue(modalX.d.priority)" x-text="dash(modalX.d.priority)"></span></div></div>
          </div>

          <div class="sec">指派信息</div>
          <div class="kv">
            <div><div class="k">负责人编号</div><div class="v mono" x-text="dash(modalX.d.assignee_member_no)"></div>
              <div class="muted" style="font-size:11px">弱引用 member 主数据</div></div>
            <div><div class="k">负责人姓名</div><div class="v" x-text="memberName(modalX.d.assignee_member_no) || dash(modalX.d.assignee_member_no)"></div></div>
          </div>

          <div class="sec">任务描述</div>
          <div style="white-space:pre-wrap; line-height:1.7; padding:2px 0 6px" x-text="dash(modalX.d.description)"></div>

          <div class="sec">时间信息</div>
          <div class="kv">
            <div><div class="k">创建时间</div><div class="v mono" x-text="fmtTime(modalX.d.created_at)"></div></div>
            <div><div class="k">更新时间</div><div class="v mono" x-text="fmtTime(modalX.d.updated_at)"></div>
              <div class="muted" style="font-size:11px">状态变更时刷新</div></div>
          </div>

          <details class="raw"><summary>原始数据</summary>
            <pre class="json" x-text="JSON.stringify(modalX.d, null, 2)"></pre></details>
        </div>
      </template>
    </div>
    <div class="modal-ft" x-show="modalX.d">
      <template x-if="modalX.d">
        <div class="tagline" style="gap:8px">
          <span class="muted" x-show="modalX.d.status === '已完成'">已完成 · 终态，无可用操作</span>
          <button class="b-pri" x-show="modalX.d.status === '待办'" @click="act(modalX.d, 'start')">启动</button>
          <button class="b-pri" x-show="modalX.d.status === '进行中'" @click="act(modalX.d, 'complete')">完成</button>
          <button class="b-ghost" x-show="modalX.d.status === '进行中'" @click="act(modalX.d, 'reopen')">退回</button>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- ════════════ 创建表单模态（task.create 全参数：title / assignee_member_no / priority / description） ════════════ -->
<div class="modal-mask" x-show="form.open" @click.self="closeCreate()"
     @keydown.escape.window="closeCreate()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div><div class="docno">新建任务</div>
        <div class="sub">任务管理 · CREATE</div></div>
      <button class="x" @click="closeCreate()">✕</button>
    </div>
    <div class="modal-bd">
      <div class="frow">
        <div style="grid-column: span 2"><label class="f">任务标题 <span class="req">*</span></label>
          <input x-model="form.title" maxlength="200" placeholder="必填 · 最多 200 字" @keydown.enter="save()"></div>
        <div><label class="f">负责人 <span class="req">*</span></label>
          <select x-model="form.assignee_member_no">
            <option value="">请选择负责人</option>
            <template x-if="!memberList.length"><option value="" disabled>暂无可指派成员</option></template>
            <template x-for="m in memberList" :key="m.member_no">
              <option :value="m.member_no" x-text="(m.name || m.member_no) + ' · ' + m.member_no"></option>
            </template>
          </select></div>
        <div><label class="f">优先级 <span class="req">*</span></label>
          <select x-model="form.priority">
            <option value="low">low</option>
            <option value="high">high</option>
          </select></div>
      </div>
      <div class="l more" style="margin-top:14px; cursor:pointer" @click="form.more = !form.more"
        x-text="'更多字段 ' + (form.more ? '▴' : '▾')"></div>
      <div class="collapse" :class="{open: form.more}">
        <div style="padding-top:12px">
          <label class="f">任务描述 <span class="muted" style="font-weight:400; font-size:11px">可选</span></label>
          <textarea x-model="form.description" maxlength="2000" rows="4" placeholder="可选 · 最多 2000 字"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <div class="right tagline" style="gap:8px">
        <button class="b-ghost" @click="closeCreate()">取消</button>
        <button class="b-pri" :disabled="form.busy" @click="save()"
          x-text="form.busy ? '处理中…' : '创建任务'"></button>
      </div>
    </div>
  </div>
</div>
