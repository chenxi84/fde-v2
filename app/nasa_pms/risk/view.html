<!-- 风险台账 · 独立创建（保留新建入口）· 评估/缓解/关闭 -->
<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
    <b>风险台账</b>
    <span class="muted">识别 · 评估 · 缓解 · 关闭（等级由 可能性 × 后果 推导）</span>
    <div class="right tagline" style="gap:8px">
      <select x-model="f_category" @change="search()" style="width:140px">
        <option value="">全部类别</option>
        <template x-for="c in categories" :key="c[0]">
          <option :value="c[0]" x-text="c[1]"></option>
        </template>
      </select>
      <select x-model="f_status" @change="search()" style="width:130px">
        <option value="">全部状态</option>
        <option value="identified">识别</option>
        <option value="analyzing">分析中</option>
        <option value="mitigating">缓解中</option>
        <option value="closed">已关闭</option>
        <option value="accepted">已接受</option>
      </select>
      <select x-model="f_level" @change="search()" style="width:130px">
        <option value="">全部等级</option>
        <template x-for="l in levels" :key="l[0]">
          <option :value="l[0]" x-text="l[1]"></option>
        </template>
      </select>
      <button class="b-pri b-sm" @click="openForm()">新建风险</button>
    </div>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>风险编号</th><th>标题</th><th>风险类别</th><th>风险值</th><th>风险等级</th><th>状态</th><th>责任人</th><th>操作</th></tr>
      <template x-if="!list.items.length">
        <tr><td colspan="8" class="empty">暂无风险 —— 点「新建风险」识别第一条</td></tr>
      </template>
      <template x-for="d in list.items" :key="d.risk_no">
        <tr class="data">
          <td><button class="b-link mono" @click="openDetail(d, 'view')" x-text="d.risk_no"></button></td>
          <td x-text="d.title"></td>
          <td x-text="categoryName(d.category)"></td>
          <td class="num" x-text="dash(d.risk_score)"></td>
          <td><span class="st" :class="levelCls(d.risk_level)" x-text="levelName(d.risk_level)"></span></td>
          <td><span class="st" :class="statusCls(d.status)" x-text="statusName(d.status)"></span></td>
          <td x-text="dash(d.owner)"></td>
          <!-- ⚠ 终态（已关闭/已接受）用 x-if **移出 DOM**（BR-06）；用 x-show 只隐藏，
               DOM 里仍在，测试的 count() 会误判「按钮还在」 -->
          <td>
            <button class="b-link" @click="openDetail(d, 'view')">详情</button>
            <template x-if="!terminal(d)">
              <div style="display:contents">
                <button class="b-link" x-show="!frozen(d)" @click="openDetail(d, 'edit')">编辑</button>
                <button class="b-link" @click="openDetail(d, 'assess')">评估</button>
                <!-- ⚠ 动作入口与服务端**同口径**（别显示一个点了必被拒的入口 —— 本组 FE-54 的教训）：
                     · `mitigate` 要求已评估等级（服务端：`尚未评估等级…`）⇒ 未评估不显示
                     · `close` 只认「缓解中」（§3.4 状态机）⇒ 其它状态不显示 -->
                <template x-if="d.risk_level">
                  <button class="b-link" @click="openDetail(d, 'mitigate')">缓解</button>
                </template>
                <template x-if="d.status === 'mitigating'">
                  <button class="b-link" @click="openDetail(d, 'close')">关闭</button>
                </template>
              </div>
            </template>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:8px 16px" x-show="list && list.total > list.size">
    <span class="muted" x-text="'共 ' + (list ? list.total : 0) + ' 条'"></span>
    <div class="right tagline" style="gap:6px">
      <button class="b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">上一页</button>
      <span class="muted" x-text="'第 ' + (list ? list.page : 1) + ' 页'"></span>
      <button class="b-sm" :disabled="list.page * list.size >= list.total" @click="list.load(list.page + 1)">下一页</button>
    </div>
  </div>
</div></div>

<!-- 详情 / 编辑 / 评估 / 缓解 / 关闭 —— 同一模态，mode 切换 -->
<div x-show="modal.open" x-cloak class="modal-mask" style="position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(14,27,42,.35)">
  <div class="card" style="width:720px;max-height:88vh;overflow:auto;margin:0">
    <div class="tagline" style="padding:12px 16px;border-bottom:1px solid var(--line)">
      <b x-text="modalTitle()"></b>
      <div class="right"><button class="b-sm" @click="closeModal()">关闭</button></div>
    </div>
    <!-- ⚠ 必须用 x-if 而不是 x-show：x-show 只隐藏，Alpine **仍会求值**内部绑定，
         而 modal.d 初始为 null → 满屏 "Cannot read properties of null" 报错（实测踩过） -->
    <template x-if="modal.d">
    <div class="bd">
      <!-- 只读信息条：等级与风险值恒为**推导值**，永不出现输入框（BR-01）
           data-role 供 e2e 断言这段「纯文本」——不像 select 会把选项文本也带进 inner_text -->
      <div class="muted" data-role="risk-head" style="font-size:12px;margin-bottom:10px">
        风险编号 <span class="mono" x-text="modal.d.risk_no"></span>
        <span x-text="' · 状态 '"></span><span class="st" :class="statusCls(modal.d.status)" x-text="statusName(modal.d.status)"></span>
        <span x-text="' · 风险值 ' + dash(modal.d.risk_score)"></span>
        <span x-text="' · 风险等级 '"></span><span class="st" :class="levelCls(modal.d.risk_level)" x-text="levelName(modal.d.risk_level)"></span>
        <span x-show="modal.d && modal.d.disposition" x-text="' · 处置 ' + dispositionName(modal.d.disposition)"></span>
      </div>
      <div style="display:grid;grid-template-columns:96px 1fr;gap:8px 12px;align-items:center">
        <label>标题</label>
        <input x-model="modal.d.title" :disabled="modal.mode !== 'edit'">
        <label>风险情景</label>
        <textarea x-model="modal.d.statement" rows="3" :disabled="modal.mode !== 'edit'"></textarea>
        <label>风险类别</label>
        <select x-model="modal.d.category" :disabled="modal.mode !== 'edit'">
          <option value="technical">技术风险</option><option value="cost">成本风险</option><option value="schedule">进度风险</option><option value="programmatic">程序性风险</option><option value="safety">安全风险</option>
        </select>
        <label>受影响需求</label>
        <select x-model="modal.d.req_no" :disabled="modal.mode !== 'edit'">
          <option value="">（不关联）</option>
          <template x-for="r in reqs" :key="r.req_no">
            <option :value="r.req_no" x-text="r.req_no + ' · ' + r.title"></option>
          </template>
        </select>
        <label>责任人</label>
        <!-- 文本输入 + datalist 建议（**不用 select + x-for**：回填会静默停第一项，见本组前端详设附）；
             候选来自跨应用 `stakeholder.list`，值仍是文本姓名。 -->
        <div>
          <input x-model="modal.d.owner" list="sh-options-modal" placeholder="选填（可从利益相关者里选）"
            :disabled="modal.mode !== 'edit'" style="width:100%">
          <datalist id="sh-options-modal">
            <template x-for="s in owners" :key="s.sh_no">
              <option :value="s.name" x-text="s.name + ' · ' + s.sh_no"></option>
            </template>
          </datalist>
        </div>
        <label>可能性</label>
        <select x-model="modal.assess.likelihood" :disabled="modal.mode !== 'assess'">
          <option value="">未评估</option>
          <option :value="1">1 · 极低</option><option :value="2">2 · 低</option><option :value="3">3 · 中</option><option :value="4">4 · 高</option><option :value="5">5 · 极高</option>
        </select>
        <label>后果</label>
        <select x-model="modal.assess.consequence" :disabled="modal.mode !== 'assess'">
          <option value="">未评估</option>
          <option :value="1">1 · 极低</option><option :value="2">2 · 低</option><option :value="3">3 · 中</option><option :value="4">4 · 高</option><option :value="5">5 · 极高</option>
        </select>
        <label>缓解措施</label>
        <textarea x-model="modal.mit.text" rows="2" :disabled="modal.mode !== 'mitigate'"></textarea>
        <!-- BR-02 / BR-03：处置结论只在「关闭」动作里出现 -->
        <template x-if="modal.mode === 'close'">
          <div style="display:contents">
            <label style="color:var(--amber)">处置结论</label>
            <div>
              <select x-model="modal.close.disposition">
                <option value="">请选择处置结论（必选）</option>
                <template x-for="o in dispositions" :key="o[0]">
                  <option :value="o[0]" :disabled="optDisabled(o[0])" x-text="o[1]"></option>
                </template>
              </select>
              <div class="muted" style="font-size:11px;margin-top:2px">
                「缓解完成」须已登记缓解措施；等级为「高」/「严重」时不可选「接受」（BR-02 / BR-03）
              </div>
            </div>
            <label>处置说明</label>
            <input x-model="modal.close.note" placeholder="选填" style="width:100%">
          </div>
        </template>
      </div>
      <div class="muted" style="font-size:11px;margin-top:8px">
        风险等级 = 可能性 × 后果（分档：≤4 低 · ≤9 中 · ≤15 高 · ≥16 严重）—— <b>推导值，不可直接填写</b>（BR-01）
      </div>
      <div class="tagline" style="margin-top:12px">
        <span class="muted" style="font-size:11px" x-show="modal.mode === 'view'">
          只读视图 —— 改写走列表的「编辑」，改等级走「评估」
        </span>
        <div class="right" style="gap:8px">
          <button class="b-pri b-sm" x-show="modal.mode === 'edit'" :disabled="modal.saving" @click="saveEdit()"
            x-text="modal.saving ? '保存中…' : '保存'"></button>
          <button class="b-pri b-sm" x-show="modal.mode === 'assess'" :disabled="!canAssess() || modal.saving" @click="saveAssess()"
            x-text="modal.saving ? '提交中…' : '重评等级'"></button>
          <button class="b-pri b-sm" x-show="modal.mode === 'mitigate'" :disabled="!canMitigate() || modal.saving" @click="saveMitigate()"
            x-text="modal.saving ? '提交中…' : '登记缓解措施'"></button>
          <button class="b-pri b-sm" x-show="modal.mode === 'close'" :disabled="!canClose() || modal.saving" @click="saveClose()"
            x-text="modal.saving ? '提交中…' : '确认关闭'"></button>
        </div>
      </div>
    </div>
    </template>
  </div>
</div>

<!-- 新建 模态 -->
<div x-show="form.open" x-cloak class="modal-mask" style="position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(14,27,42,.35)">
  <div class="card" style="width:720px;max-height:88vh;overflow:auto;margin:0">
    <div class="tagline" style="padding:12px 16px;border-bottom:1px solid var(--line)">
      <b>新建风险</b>
      <div class="right"><button class="b-sm" @click="closeForm()">取消</button></div>
    </div>
    <!-- ⚠ 同详情模态：必须 x-if（x-show 仍会求值 null 上的绑定） -->
    <template x-if="form.d">
    <div class="bd">
      <div style="display:grid;grid-template-columns:96px 1fr;gap:8px 12px;align-items:center">
        <label>标题</label><input x-model="form.d.title" placeholder="一句话概括">
        <label>风险情景</label><textarea x-model="form.d.statement" rows="3" placeholder="触发事件 → 不良后果（材料 §6.4 风险三元组）"></textarea>
        <label>风险类别</label>
        <select x-model="form.d.category">
          <option value="technical">技术风险</option><option value="cost">成本风险</option><option value="schedule">进度风险</option><option value="programmatic">程序性风险</option><option value="safety">安全风险</option>
        </select>
        <!-- 可能性 / 后果可留空（尚未评估）；两栏都在，避免「只填一半」被后端拒 —— 等级不可填（BR-01） -->
        <label>可能性</label>
        <select x-model="form.d.likelihood">
          <option value="">暂不评估</option>
          <option :value="1">1 · 极低</option><option :value="2">2 · 低</option><option :value="3">3 · 中</option><option :value="4">4 · 高</option><option :value="5">5 · 极高</option>
        </select>
        <label>后果</label>
        <select x-model="form.d.consequence">
          <option value="">暂不评估</option>
          <option :value="1">1 · 极低</option><option :value="2">2 · 低</option><option :value="3">3 · 中</option><option :value="4">4 · 高</option><option :value="5">5 · 极高</option>
        </select>
        <label>受影响需求</label>
        <select x-model="form.d.req_no">
          <option value="">（不关联）</option>
          <template x-for="r in reqs" :key="r.req_no">
            <option :value="r.req_no" x-text="r.req_no + ' · ' + r.title"></option>
          </template>
        </select>
        <label>责任人</label>
        <div>
          <input x-model="form.d.owner" list="sh-options-form" placeholder="选填（可从利益相关者里选）"
            style="width:100%">
          <datalist id="sh-options-form">
            <template x-for="s in owners" :key="s.sh_no">
              <option :value="s.name" x-text="s.name + ' · ' + s.sh_no"></option>
            </template>
          </datalist>
        </div>
      </div>
      <div class="muted" style="font-size:11px;margin-top:6px">
        表单里<b>没有「风险等级」</b> —— 它恒由 可能性 × 后果 推导（BR-01）；两项都要选，只选其一会被拒绝
      </div>
      <div class="tagline" style="margin-top:12px">
        <span class="muted" style="font-size:11px">标题 / 风险情景 / 风险类别 为必填</span>
        <div class="right"><button class="b-pri b-sm" :disabled="!canSubmit() || form.saving" @click="saveForm()"
          x-text="form.saving ? '提交中…' : '提交'"></button></div>
      </div>
    </div>
    </template>
  </div>
</div>
