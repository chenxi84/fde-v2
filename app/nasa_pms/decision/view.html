<!-- 决策台账 · 独立创建（保留新建议题入口）· 提出/权衡中/已决策/已实施
     评价准则与备选方案都是**聚合内子表**（无独立标识）；决策本身必须有权衡（I-2） -->
<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
    <b>决策台账</b>
    <span class="muted">提出 · 权衡中 · 已决策 · 已实施</span>
    <div class="right tagline" style="gap:8px">
      <!-- ⚠ 枚举下拉的 <option> 一律**静态元素**：x-model + x-for 渲染的 option 会让回填静默停在第一项 -->
      <select x-model="f_eval" @change="search()" style="width:160px">
        <option value="">全部评价方法</option>
        <option value="weighted_matrix">加权决策矩阵</option>
        <option value="trade_study">权衡研究</option>
        <option value="cost_benefit">成本收益分析</option>
        <option value="decision_tree">决策树</option>
        <option value="influence_diagram">影响图</option>
        <option value="ahp">层次分析法</option>
        <option value="borda">波达计数</option>
        <option value="utility">效用分析</option>
        <option value="simulation">仿真</option>
        <option value="testing">测试验证</option>
        <option value="review_meeting">评审会商</option>
      </select>
      <select x-model="f_status" @change="search()" style="width:120px">
        <option value="">全部状态</option>
        <option value="proposed">提出</option>
        <option value="weighing">权衡中</option>
        <option value="decided">已决策</option>
        <option value="implemented">已实施</option>
      </select>
      <input x-model="f_owner" @keydown.enter="search()" placeholder="责任人" style="width:120px">
      <button class="b-ghost b-sm" @click="search()">搜索</button>
      <button class="b-pri b-sm" @click="openForm()">新建议题</button>
    </div>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr>
        <th>决策编号</th><th>决策议题</th><th>评价方法</th><th>状态</th><th>选中方案</th>
        <th>最高分</th><th>已打分</th><th>准则</th><th>责任人</th><th>来源度量</th>
        <th>议题说明</th><th>决策依据</th><th>风险与收益</th><th>异议</th>
        <th>实施说明</th><th>所属项目</th><th>操作</th>
      </tr>
      <template x-if="!list.items.length">
        <tr><td colspan="17" class="empty">暂无决策 —— 点「新建议题」登记第一次权衡</td></tr>
      </template>
      <template x-for="d in list.items" :key="d.dec_no">
        <tr class="data">
          <td><button class="b-link mono" @click="openDetail(d, 'view')" x-text="d.dec_no"></button></td>
          <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="d.topic"></td>
          <td x-text="methodOf(d)"></td>
          <td><span class="st" :class="statusCls(d.status)" x-text="statusName(d.status)"></span></td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
            data-role="chosen" x-text="chosenText(d)"></td>
          <td class="mono" data-role="top" x-text="topText(d)"></td>
          <td class="mono" data-role="scored" x-text="scoredText(d)"></td>
          <td class="mono" data-role="criteria-n" x-text="d.criterion_total || 0"></td>
          <td x-text="dash(d.owner)"></td>
          <td class="mono" x-text="dash(d.measure_no)"></td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="dash(d.issue)"></td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="dash(d.rationale)"></td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="dash(d.risk_note)"></td>
          <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="dash(d.dissent)"></td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="dash(d.implement_note)"></td>
          <td x-text="dash(d.project_no)"></td>
          <!-- ⚠ 动作按钮用 x-show 隐藏（元素仍在 DOM），e2e 断言存在性必须带 `:visible` -->
          <td>
            <button class="b-link" @click="openDetail(d, 'view')">详情</button>
            <button class="b-link" x-show="!frozen(d)" @click="openDetail(d, 'edit')">编辑</button>
            <button class="b-link" x-show="d.status === 'proposed'" :disabled="!canStart(d)"
              @click="start(d)">启动权衡</button>
            <button class="b-link" x-show="d.status === 'weighing'"
              @click="openWeigh(d)">权衡打分</button>
            <button class="b-link" x-show="d.status === 'weighing'" :disabled="!canDecide(d)"
              @click="openConclude(d)">决策</button>
            <button class="b-link" x-show="d.status === 'decided'" @click="implement(d)">实施</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:8px 16px" x-show="list && list.total > list.size">
    <span class="muted" x-text="'共 ' + (list ? list.total : 0) + ' 条'"></span>
    <div class="right tagline" style="gap:6px">
      <button class="b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">上一页</button>
      <span class="muted" x-text="'第 ' + (list ? list.page : 1) + ' 页'"></span>
      <button class="b-sm" :disabled="list.page * list.size >= list.total" @click="list.load(list.page + 1)">下一页</button>
    </div>
  </div>
</div></div>

<!-- 详情 / 编辑 模态 -->
<div x-show="modal.open" x-cloak class="modal-mask" style="position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(14,27,42,.35)">
  <div class="card" style="width:860px;max-height:88vh;overflow:auto;margin:0">
    <div class="tagline" style="padding:12px 16px;border-bottom:1px solid var(--line)">
      <b x-text="modal.mode === 'edit' ? '编辑议题' : '决策详情'"></b>
      <div class="right"><button class="b-sm" @click="closeModal()">关闭</button></div>
    </div>
    <!-- ⚠ 必须用 x-if 而不是 x-show：x-show 只隐藏，Alpine **仍会求值**内部绑定，
         而 modal.d 初始为 null → 满屏 "Cannot read properties of null" 报错（实测踩过） -->
    <template x-if="modal.d">
    <div class="bd">
      <!-- 只读信息条：`data-role` 供 e2e 精确断言这一段（不像 select 会把全部 option 文本带进 inner_text） -->
      <div class="muted" data-role="decision-head" style="font-size:12px;margin-bottom:10px">
        决策编号 <span class="mono" x-text="modal.d.dec_no"></span>
        <span x-text="' · 状态 '"></span><span class="st" :class="stCls(modal.d)" x-text="stName(modal.d)"></span>
        <span data-role="criteria-count" x-text="' · 准则 ' + (modal.d.criterion_total || 0)"></span>
        <span data-role="option-count" x-text="' · 备选方案 ' + (modal.d.option_total || 0)"></span>
        <span data-role="scored-count"
          x-text="' · 已打分 ' + (modal.d.scored_total || 0) + '/' + (modal.d.option_total || 0)"></span>
        <span x-show="modal.d && modal.d.chosen_name" x-text="' · 选中方案 '"></span>
        <span x-show="modal.d && modal.d.chosen_name" data-role="head-chosen"
          x-text="chosenText(modal.d)"></span>
      </div>
      <div style="display:grid;grid-template-columns:96px 1fr;gap:8px 12px;align-items:center">
        <label>决策议题</label>
        <input x-model="modal.d.topic" :disabled="modal.mode === 'view' || frozen(modal.d)">
        <label>评价方法</label>
        <!-- 静态 option（回填才停得住） -->
        <select x-model="modal.d.eval_method" :disabled="modal.mode === 'view' || frozen(modal.d)">
          <option value="weighted_matrix">加权决策矩阵</option>
          <option value="trade_study">权衡研究</option>
          <option value="cost_benefit">成本收益分析</option>
          <option value="decision_tree">决策树</option>
          <option value="influence_diagram">影响图</option>
          <option value="ahp">层次分析法</option>
          <option value="borda">波达计数</option>
          <option value="utility">效用分析</option>
          <option value="simulation">仿真</option>
          <option value="testing">测试验证</option>
          <option value="review_meeting">评审会商</option>
        </select>
        <label>来源度量</label>
        <!-- 文本输入 + datalist 建议（**不用 select + x-for**：x-model 的选项回填会静默停在
             第一项，见本组前端详设附）；候选来自跨应用只读调用，值仍是文本 -->
        <div>
          <input x-model="modal.d.measure_no" list="tm-options-modal" placeholder="选填，如 TPM-001（弱引用技术度量）"
            :disabled="modal.mode === 'view' || frozen(modal.d)" style="width:100%">
          <datalist id="tm-options-modal">
            <template x-for="x in measures" :key="x.tpm_no">
              <option :value="x.tpm_no" x-text="x.tpm_no + ' · ' + (x.name || '')"></option>
            </template>
          </datalist>
        </div>
        <label>责任人</label>
        <!-- 文本输入 + datalist 建议（**不用 select + x-for**：x-model 的选项回填会静默停在
             第一项，见本组前端详设附）；候选来自跨应用只读调用，值仍是文本 -->
        <div>
          <input x-model="modal.d.owner" list="sh-options-modal" placeholder="选填（可从利益相关者里选）"
            :disabled="modal.mode === 'view' || frozen(modal.d)" style="width:100%">
          <datalist id="sh-options-modal">
            <template x-for="x in owners" :key="x.name">
              <option :value="x.name" x-text="x.name + ' · ' + (x.sh_no || '')"></option>
            </template>
          </datalist>
        </div>
        <label>所属项目</label>
        <input x-model="modal.d.project_no" :disabled="modal.mode === 'view' || frozen(modal.d)">
        <label>议题说明</label>
        <textarea x-model="modal.d.issue" rows="2" placeholder="选填：问题的背景、历史、决策者"
          :disabled="modal.mode === 'view' || frozen(modal.d)"></textarea>
        <!-- 结论 / 依据 / 风险收益 / 异议 / 实施说明都是 conclude、implement 的产物，本模态只读回显（BR-06） -->
        <label>决策依据</label>
        <div class="muted" data-role="modal-rationale" x-text="dash(modal.d.rationale)"></div>
        <label>风险与收益</label>
        <div class="muted" x-text="dash(modal.d.risk_note)"></div>
        <label>异议</label>
        <div class="muted" x-text="dash(modal.d.dissent)"></div>
        <label>实施说明</label>
        <div class="muted" x-text="dash(modal.d.implement_note)"></div>
      </div>

      <!-- 评价准则（聚合内子表；材料 §6.8.1.2.1 的第一步） -->
      <div class="muted" style="font-size:12px;font-weight:700;margin:14px 0 6px"
        data-role="criterion-title" x-text="'评价准则（' + criteriaOf(modal.d).length + '）'"></div>
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th>序号</th><th>评价准则</th><th>权重</th></tr>
          <template x-if="!criteriaOf(modal.d).length">
            <tr><td colspan="3" class="empty">还没有评价准则 —— 准则先于备选方案的评估，空清单不能启动权衡（BR-01）</td></tr>
          </template>
          <template x-for="c in criteriaOf(modal.d)" :key="c.seq">
            <tr class="sub" data-role="criterion-row">
              <td class="mono" data-role="criterion-seq" x-text="c.seq"></td>
              <td data-role="criterion-text" x-text="c.criterion"></td>
              <td class="mono" data-role="criterion-weight" x-text="c.weight"></td>
            </tr>
          </template>
        </table>
      </div>
      <!-- 加准则：未决策 / 未实施时可见（写操作放编辑态，避免只读视图被误改） -->
      <div class="tagline" style="gap:8px;margin-top:8px" x-show="modal.mode === 'edit' && !frozen(modal.d)">
        <input x-model="modal.criterion" placeholder="评价准则（必填，如 成本 / 进度 / 风险）" style="width:300px">
        <input x-model="modal.weight" placeholder="权重（正整数）" style="width:120px">
        <button class="b-ghost b-sm" :disabled="!canAddCriterion() || modal.saving"
          @click="saveCriterion()">加准则</button>
      </div>

      <!-- 备选方案（聚合内子表；卡片核心属性「备选方案」，无独立标识） -->
      <div class="muted" style="font-size:12px;font-weight:700;margin:14px 0 6px"
        data-role="option-title" x-text="'备选方案（' + optionsOf(modal.d).length + '）'"></div>
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th>序号</th><th>方案</th><th>说明</th><th>评价得分</th><th>打分说明</th></tr>
          <template x-if="!optionsOf(modal.d).length">
            <tr><td colspan="5" class="empty">还没有备选方案 —— 少于两个不允许作结论（BR-02）</td></tr>
          </template>
          <template x-for="o in optionsOf(modal.d)" :key="o.seq">
            <tr class="sub" data-role="option-row">
              <td class="mono" data-role="option-seq" x-text="o.seq"></td>
              <td data-role="option-name" x-text="o.name"></td>
              <td class="muted" data-role="option-desc" x-text="dash(o.description)"></td>
              <td class="mono" data-role="option-score"
                x-text="o.score === null || o.score === undefined ? '未打分' : o.score"></td>
              <td class="muted" data-role="option-note" x-text="dash(o.note)"></td>
            </tr>
          </template>
        </table>
      </div>
      <!-- 加方案：未决策 / 未实施时可见（打分走「权衡打分」模态，不在这里） -->
      <div class="tagline" style="gap:8px;margin-top:8px" x-show="modal.mode === 'edit' && !frozen(modal.d)">
        <input x-model="modal.option" placeholder="备选方案名称（必填）" style="width:300px">
        <input x-model="modal.description" placeholder="方案说明（选填）" style="width:240px">
        <button class="b-ghost b-sm" :disabled="!canAddOption() || modal.saving"
          @click="saveOption()">加方案</button>
      </div>

      <div class="tagline" style="margin-top:12px">
        <!-- BR-06：已决策 → 内容冻结；已实施 → 硬终态。两者的前端表现都是只读，文案区分 -->
        <span class="muted" style="font-size:11px" data-role="frozen-hint" x-show="frozen(modal.d)"
          x-text="frozenText(modal.d)"></span>
        <!-- BR-01：准则为空时给出**为什么不能启动权衡**，而不是只把按钮藏掉 -->
        <span class="muted" style="font-size:11px" data-role="start-block-hint"
          x-show="showStartBlock(modal.d)">还没有评价准则 —— 准则先于备选方案的评估（BR-01）</span>
        <!-- I-2 / I-1：方案少于两个或没有方案打分时，给出为什么不能决策 -->
        <span class="muted" style="font-size:11px" data-role="decide-block-hint"
          x-show="showDecideBlock(modal.d)" x-text="decideBlockText(modal.d)"></span>
        <span class="muted" style="font-size:11px" x-show="modal.mode === 'view' && isStatus(modal.d, 'proposed')">
          提出态 —— 先「启动权衡」进入权衡中，才能给方案打分与作决策
        </span>
        <div class="right" style="gap:8px">
          <button class="b-pri b-sm" x-show="modal.mode === 'edit' && !frozen(modal.d)"
            :disabled="modal.saving" @click="saveEdit()"
            x-text="modal.saving ? '保存中…' : '保存'"></button>
          <button class="b-ghost b-sm" x-show="modal.mode === 'view' && isStatus(modal.d, 'proposed')"
            :disabled="!canStart(modal.d)" @click="start(modal.d)">启动权衡</button>
          <button class="b-ghost b-sm" x-show="modal.mode === 'view' && isStatus(modal.d, 'weighing')"
            @click="openWeigh(modal.d)">权衡打分</button>
          <button class="b-pri b-sm" x-show="modal.mode === 'view' && isStatus(modal.d, 'weighing')"
            :disabled="!canDecide(modal.d)" @click="openConclude(modal.d)">决策</button>
          <button class="b-pri b-sm" x-show="modal.mode === 'view' && isStatus(modal.d, 'decided')"
            @click="implement(modal.d)">实施</button>
        </div>
      </div>
    </div>
    </template>
  </div>
</div>

<!-- 权衡打分 模态（仅权衡中；0 分是有效的分） -->
<div x-show="wm.open" x-cloak class="modal-mask" style="position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(14,27,42,.35)">
  <div class="card" style="width:780px;max-height:88vh;overflow:auto;margin:0">
    <div class="tagline" style="padding:12px 16px;border-bottom:1px solid var(--line)">
      <b>权衡打分</b>
      <div class="right"><button class="b-sm" @click="closeWeigh()">取消</button></div>
    </div>
    <!-- ⚠ 同详情模态：必须 x-if -->
    <template x-if="wm.open">
    <div class="bd">
      <div class="muted" style="font-size:12px;margin-bottom:8px">
        <span class="mono" x-text="wm.dec_no"></span>
        <span x-text="' · ' + (wm.topic || '')"></span>
        <span data-role="weigh-hint"> · 得分 0~100 的整数（0 分也是有效的分）</span>
      </div>
      <div class="muted" style="font-size:12px;font-weight:700;margin:8px 0 6px"
        data-role="weigh-criterion-title" x-text="'评价准则（' + wm.criteria.length + '）—— 打分的依据'"></div>
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th>序号</th><th>评价准则</th><th>权重</th></tr>
          <template x-if="!wm.criteria.length">
            <tr><td colspan="3" class="empty">还没有评价准则（BR-01）</td></tr>
          </template>
          <template x-for="c in wm.criteria" :key="c.seq">
            <tr class="sub" data-role="weigh-criterion-row">
              <td class="mono" x-text="c.seq"></td>
              <td data-role="weigh-criterion-text" x-text="c.criterion"></td>
              <td class="mono" x-text="c.weight"></td>
            </tr>
          </template>
        </table>
      </div>

      <div class="muted" style="font-size:12px;font-weight:700;margin:12px 0 6px"
        data-role="weigh-option-title" x-text="'备选方案评分（' + wm.rows.length + '）'"></div>
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th>序号</th><th>方案</th><th>评价得分</th><th>打分说明</th><th>操作</th></tr>
          <template x-if="!wm.rows.length">
            <tr><td colspan="5" class="empty">还没有备选方案 —— 先在详情里「加方案」（BR-02）</td></tr>
          </template>
          <template x-for="r in wm.rows" :key="r.seq">
            <tr class="sub" data-role="weigh-row">
              <td class="mono" x-text="r.seq"></td>
              <td data-role="weigh-name" x-text="r.name"></td>
              <td><input data-role="weigh-score" x-model="r.score" placeholder="0~100" style="width:90px"></td>
              <td><input data-role="weigh-note" x-model="r.note" placeholder="选填" style="width:100%"></td>
              <td>
                <button class="b-link" data-role="weigh-save"
                  :disabled="!rowOk(r) || wm.busySeq === r.seq || wm.saving"
                  @click="saveRow(r)" x-text="wm.busySeq === r.seq ? '保存中…' : '保存'"></button>
              </td>
            </tr>
          </template>
        </table>
      </div>
      <div class="tagline" style="margin-top:10px">
        <span class="muted" style="font-size:11px">打分是迭代的：随时可改，直到「决策」落库后冻结（BR-06）</span>
      </div>
    </div>
    </template>
  </div>
</div>

<!-- 决策 模态（选一个已打分的方案；选非最高分必须给依据） -->
<div x-show="cm.open" x-cloak class="modal-mask" style="position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(14,27,42,.35)">
  <div class="card" style="width:760px;max-height:88vh;overflow:auto;margin:0">
    <div class="tagline" style="padding:12px 16px;border-bottom:1px solid var(--line)">
      <b>决策</b>
      <div class="right"><button class="b-sm" @click="closeConclude()">取消</button></div>
    </div>
    <!-- ⚠ 同详情模态：必须 x-if -->
    <template x-if="cm.open">
    <div class="bd">
      <div class="muted" style="font-size:12px;margin-bottom:8px">
        <span class="mono" x-text="cm.dec_no"></span>
        <span x-text="' · ' + (cm.topic || '')"></span>
      </div>

      <div class="muted" data-role="cm-hint" style="font-size:12px;margin-bottom:6px"
        x-text="cmHint()"></div>

      <!-- 方案单选：未打分的方案**不可选**（I-1：结论必须指向一个有权衡结果的方案） -->
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th style="width:40px"></th><th>序号</th><th>方案</th><th>评价得分</th></tr>
          <template x-if="!cm.options.length">
            <tr><td colspan="4" class="empty">还没有备选方案 —— 少于两个不允许作结论（BR-02）</td></tr>
          </template>
          <template x-for="o in cm.options" :key="o.seq">
            <tr class="sub" data-role="cm-option" :style="o.score === null ? 'opacity:.55' : ''">
              <td><input type="radio" name="decision-chosen" :value="o.seq" x-model.number="cm.chosen"
                :disabled="o.score === null"></td>
              <td class="mono" x-text="o.seq"></td>
              <td data-role="cm-option-name" x-text="o.name"></td>
              <td class="mono" data-role="cm-option-score"
                x-text="o.score === null ? '未打分（不可选）' : (o.score + ' 分')"></td>
            </tr>
          </template>
        </table>
      </div>

      <div style="display:grid;grid-template-columns:96px 1fr;gap:8px 12px;align-items:center;margin-top:10px">
        <label>决策依据</label>
        <textarea x-model="cm.rationale" rows="2"
          placeholder="选中非最高分方案时必填（BR-04）；选最高分时选填"></textarea>
        <label>风险与收益</label>
        <textarea x-model="cm.risk_note" rows="2" placeholder="选填：选中方案的风险与收益（决策报告第 6 节）"></textarea>
        <label>异议</label>
        <textarea x-model="cm.dissent" rows="2" placeholder="选填：与建议不一致的异议及处置（决策报告第 8 节）"></textarea>
      </div>

      <div class="tagline" style="margin-top:12px">
        <span class="muted" style="font-size:11px" data-role="cm-block" x-show="!canConclude()"
          x-text="canConcludeReason()"></span>
        <div class="right"><button class="b-pri b-sm" :disabled="!canConclude() || cm.saving"
          @click="saveConclude()" x-text="cm.saving ? '提交中…' : '提交决策'"></button></div>
      </div>
    </div>
    </template>
  </div>
</div>

<!-- 新建议题 模态 -->
<div x-show="form.open" x-cloak class="modal-mask" style="position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(14,27,42,.35)">
  <div class="card" style="width:720px;max-height:88vh;overflow:auto;margin:0">
    <div class="tagline" style="padding:12px 16px;border-bottom:1px solid var(--line)">
      <b>新建议题</b>
      <div class="right"><button class="b-sm" @click="closeForm()">取消</button></div>
    </div>
    <!-- ⚠ 同详情模态：必须 x-if（x-show 仍会求值 null 上的绑定） -->
    <template x-if="form.d">
    <div class="bd">
      <div style="display:grid;grid-template-columns:96px 1fr;gap:8px 12px;align-items:center">
        <label>决策议题</label><input x-model="form.d.topic" placeholder="如：飞控计算机选用（必填）">
        <label>评价方法</label>
        <select x-model="form.d.eval_method">
          <option value="weighted_matrix">加权决策矩阵</option>
          <option value="trade_study">权衡研究</option>
          <option value="cost_benefit">成本收益分析</option>
          <option value="decision_tree">决策树</option>
          <option value="influence_diagram">影响图</option>
          <option value="ahp">层次分析法</option>
          <option value="borda">波达计数</option>
          <option value="utility">效用分析</option>
          <option value="simulation">仿真</option>
          <option value="testing">测试验证</option>
          <option value="review_meeting">评审会商</option>
        </select>
        <label>来源度量</label>
        <div>
          <input x-model="form.d.measure_no" list="tm-options-form" placeholder="选填，如 TPM-001" style="width:100%">
          <datalist id="tm-options-form">
            <template x-for="x in measures" :key="x.tpm_no">
              <option :value="x.tpm_no" x-text="x.tpm_no + ' · ' + (x.name || '')"></option>
            </template>
          </datalist>
        </div>
        <label>责任人</label>
        <div>
          <input x-model="form.d.owner" list="sh-options-form" placeholder="选填（可从利益相关者里选）" style="width:100%">
          <datalist id="sh-options-form">
            <template x-for="x in owners" :key="x.name">
              <option :value="x.name" x-text="x.name + ' · ' + (x.sh_no || '')"></option>
            </template>
          </datalist>
        </div>
        <label>所属项目</label><input x-model="form.d.project_no" placeholder="选填，如 P-2026-01">
        <label>议题说明</label>
        <textarea x-model="form.d.issue" rows="2" placeholder="选填：问题背景与决策者"></textarea>
      </div>
      <div class="tagline" style="margin-top:12px">
        <span class="muted" style="font-size:11px">新议题以「提出」状态落库，编号自动生成（DC-001 起）；议题与评价方法齐备才可提交</span>
        <div class="right"><button class="b-pri b-sm" :disabled="!canSubmit() || form.saving" @click="saveForm()"
          x-text="form.saving ? '提交中…' : '提交'"></button></div>
      </div>
    </div>
    </template>
  </div>
</div>
