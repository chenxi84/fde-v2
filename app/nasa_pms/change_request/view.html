<!-- 变更请求台账 · 独立创建（保留「提出变更」入口）· 影响分析 / 审批 / 实施 -->
<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
    <b>变更请求台账</b>
    <span class="muted">提出 · 影响分析 · 审批 · 实施（内容只在「已提交」可改）</span>
    <div class="right tagline" style="gap:8px">
      <select x-model="f_status" @change="search()" style="width:124px">
        <option value="">全部状态</option>
        <option value="submitted">已提交</option>
        <option value="analyzing">影响分析</option>
        <option value="reviewing">审批中</option>
        <option value="approved">已批准</option>
        <option value="rejected">已拒绝</option>
        <option value="implemented">已实施</option>
      </select>
      <select x-model="f_ci" @change="search()" style="width:170px">
        <option value="">全部配置项</option>
        <template x-for="c in cis" :key="c.ci_no">
          <option :value="c.ci_no" x-text="c.ci_no + ' · ' + c.name"></option>
        </template>
      </select>
      <select x-model="f_req" @change="search()" style="width:170px">
        <option value="">全部需求</option>
        <template x-for="r in reqs" :key="r.req_no">
          <option :value="r.req_no" x-text="r.req_no + ' · ' + r.title"></option>
        </template>
      </select>
      <input x-model="f_requester" @change="search()" @keyup.enter="search()"
             placeholder="按申请方筛选" style="width:130px">
      <button class="b-pri b-sm" @click="openForm()">提出变更</button>
    </div>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>变更请求编号</th><th>标题</th><th>申请方</th><th>影响的配置项</th><th>影响的需求</th><th>状态</th><th>操作</th></tr>
      <template x-if="!list.items.length">
        <tr><td colspan="7" class="empty">暂无变更请求 —— 点「提出变更」提交第一条</td></tr>
      </template>
      <template x-for="d in list.items" :key="d.cr_no">
        <tr class="data">
          <td><button class="b-link mono" @click="openDetail(d, 'view')" x-text="d.cr_no"></button></td>
          <td x-text="d.title"></td>
          <td x-text="dash(d.requester)"></td>
          <td class="mono" data-role="row-ci" x-text="join(d.ci_nos)"></td>
          <td class="mono" data-role="row-req" x-text="join(d.req_nos)"></td>
          <td><span class="st" data-role="cr-status" :class="statusCls(d.status)" x-text="statusName(d.status)"></span></td>
          <!-- 动作按钮按状态显隐（状态机 §3.4）。用 x-show 隐藏（元素仍在 DOM）⇒
               e2e 断言按钮存在性**必须带 `:visible`**，否则 count() 会把隐藏的也数进去 -->
          <td>
            <button class="b-link" @click="openDetail(d, 'view')">详情</button>
            <button class="b-link" x-show="d.status === 'submitted'" @click="openDetail(d, 'edit')">编辑</button>
            <button class="b-link" x-show="d.status === 'submitted'" @click="openDetail(d, 'analyze')">提交影响分析</button>
            <button class="b-link" x-show="d.status === 'analyzing'" @click="submitReview(d)">提交审批</button>
            <button class="b-link" x-show="d.status === 'reviewing'" @click="openDetail(d, 'disposition')">审批</button>
            <button class="b-link" x-show="d.status === 'approved'" @click="openDetail(d, 'implement')">实施</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:8px 16px" x-show="list && list.total > list.size">
    <span class="muted" x-text="'共 ' + (list ? list.total : 0) + ' 条'"></span>
    <div class="right tagline" style="gap:6px">
      <button class="b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">上一页</button>
      <span class="muted" x-text="'第 ' + (list ? list.page : 1) + ' 页'"></span>
      <button class="b-sm" :disabled="list.page * list.size >= list.total" @click="list.load(list.page + 1)">下一页</button>
    </div>
  </div>
</div></div>

<!-- 详情 / 编辑 / 影响分析 / 审批 / 实施 —— 同一模态，mode 切换 -->
<div x-show="modal.open" x-cloak class="modal-mask" style="position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(14,27,42,.35)">
  <div class="card" style="width:720px;max-height:88vh;overflow:auto;margin:0">
    <div class="tagline" style="padding:12px 16px;border-bottom:1px solid var(--line)">
      <b x-text="modalTitle()"></b>
      <div class="right"><button class="b-sm" @click="closeModal()">关闭</button></div>
    </div>
    <!-- ⚠ 必须用 x-if 而不是 x-show：x-show 只隐藏，Alpine **仍会求值**内部绑定，
         而 modal.d 初始为 null → 满屏 "Cannot read properties of null" 报错（实测踩过） -->
    <template x-if="modal.d">
    <div class="bd">
      <!-- 只读信息条：编号恒为纯文本（BR-03：无参数可改）
           data-role 供 e2e 只断言这一段 —— 不像 select，不会把全部 option 文本带进 inner_text -->
      <div class="muted" data-role="cr-head" style="font-size:12px;margin-bottom:10px">
        变更请求编号 <span class="mono" x-text="modal.d.cr_no"></span>
        <span x-text="' · 状态 '"></span><span class="st" :class="statusCls(modal.d.status)" x-text="statusName(modal.d.status)"></span>
        <span x-text="' · 影响范围 '"></span><span class="mono" x-text="join(modal.d.ci_nos) + ' / ' + join(modal.d.req_nos)"></span>
      </div>
      <div style="display:grid;grid-template-columns:96px 1fr;gap:8px 12px;align-items:center">
        <label>标题</label>
        <input x-model="modal.d.title" :disabled="!editable()">
        <label>申请方</label>
        <!-- 文本输入 + datalist 建议（**不用 select + x-for**：x-model 的选项回填会静默停在
             第一项，见本组前端详设附）；候选来自跨应用只读调用，值仍是文本 -->
        <div>
          <input x-model="modal.d.requester" list="sh-options-modal" placeholder="提出人 / 组织（必填，可从利益相关者里选）"
            :disabled="!editable()" style="width:100%">
          <datalist id="sh-options-modal">
            <template x-for="x in owners" :key="x.name">
              <option :value="x.name" x-text="x.name + ' · ' + (x.sh_no || '')"></option>
            </template>
          </datalist>
        </div>
        <label>变更说明</label>
        <textarea x-model="modal.d.description" rows="3" :disabled="!editable()"></textarea>
        <!-- F-4：影响范围只在「已提交」的编辑态可改；其余状态是只读文本（BR-06）
             ⚠ 只读态用纯文本 + data-role，不用 disabled 的 select ——
             inner_text 会把 select 的全部 option 文本吃进来，「字段显示 X」这类断言会假过 -->
        <label>影响配置项</label>
        <template x-if="editable()">
          <select multiple size="4" x-model="modal.d.ci_nos">
            <template x-for="c in cis" :key="c.ci_no">
              <option :value="c.ci_no" x-text="c.ci_no + ' · ' + c.name"></option>
            </template>
          </select>
        </template>
        <template x-if="!editable()">
          <div class="mono" data-role="scope-ci" x-text="join(modal.d.ci_nos)"></div>
        </template>
        <label>影响需求</label>
        <template x-if="editable()">
          <select multiple size="4" x-model="modal.d.req_nos">
            <template x-for="r in reqs" :key="r.req_no">
              <option :value="r.req_no" x-text="r.req_no + ' · ' + r.title"></option>
            </template>
          </select>
        </template>
        <template x-if="!editable()">
          <div class="mono" data-role="scope-req" x-text="join(modal.d.req_nos)"></div>
        </template>
        <label>所属项目</label>
        <div x-text="dash(modal.d.project_no)"></div>
        <!-- 影响分析：只在「提交影响分析」动作里可写（BR-02 的审批前置） -->
        <label>影响分析</label>
        <template x-if="modal.mode === 'analyze'">
          <div>
            <textarea x-model="modal.d.impact_analysis" rows="4"
                      placeholder="必填：改动波及哪些配置项 / 需求、代价与风险（BR-02）"></textarea>
            <div class="muted" style="font-size:11px;margin-top:2px">
              分析内容是审批的**唯一前置** —— 没有它进不了审批（BR-02）
            </div>
          </div>
        </template>
        <template x-if="modal.mode !== 'analyze'">
          <div data-role="impact" x-text="dash(modal.d.impact_analysis)"></div>
        </template>
        <!-- 审批：批准与拒绝共用一份意见（未填两个按钮都禁用，BR-02） -->
        <template x-if="modal.mode === 'disposition'">
          <div style="display:contents">
            <label style="color:var(--amber)">审批意见</label>
            <div>
              <textarea x-model="modal.dec.comment" rows="3"
                        placeholder="必填：批准或拒绝的理由（BR-02：审批意见与状态同事务落库）"></textarea>
              <div class="muted" style="font-size:11px;margin-top:2px">未填时「确认批准」与「确认拒绝」都不可点</div>
            </div>
            <label>审批人</label>
            <input x-model="modal.dec.approver" placeholder="选填，如 CCB-主席">
          </div>
        </template>
        <template x-if="modal.mode !== 'disposition' && (modal.d.decision_note || modal.d.approver)">
          <div style="display:contents">
            <label>审批意见</label>
            <div>
              <div data-role="decision" x-text="dash(modal.d.decision_note)"></div>
              <div class="muted" x-show="modal.d && modal.d.approver" x-text="'审批人：' + (modal.d.approver || '—')"></div>
            </div>
          </div>
        </template>
        <!-- 实施：只有已批准才能执行（BR-04） -->
        <template x-if="modal.mode === 'implement'">
          <div style="display:contents">
            <label>实施说明</label>
            <input x-model="modal.imp.note" placeholder="选填，如 CI-001 已在配置项侧版本变更到 v2">
          </div>
        </template>
        <template x-if="modal.mode !== 'implement' && modal.d.implement_note">
          <div style="display:contents">
            <label>实施说明</label>
            <div data-role="implement" x-text="modal.d.implement_note"></div>
          </div>
        </template>
      </div>
      <div class="tagline" style="margin-top:12px">
        <span class="muted" style="font-size:11px" x-show="terminal(modal.d)">已处于终态 —— 不可再修改、分析、审批或实施（BR-04）</span>
        <span class="muted" style="font-size:11px" x-show="modal.mode === 'view' && !terminal(modal.d)">只读视图 —— 改写走列表上按状态出现的动作按钮</span>
        <div class="right" style="gap:8px">
          <button class="b-pri b-sm" x-show="modal.mode === 'edit'" :disabled="!canSaveEdit() || modal.saving"
            @click="saveEdit()" x-text="modal.saving ? '保存中…' : '保存'"></button>
          <button class="b-pri b-sm" x-show="modal.mode === 'analyze'" :disabled="!canAnalyze() || modal.saving"
            @click="saveAnalyze()" x-text="modal.saving ? '提交中…' : '提交影响分析'"></button>
          <button class="b-pri b-sm" x-show="modal.mode === 'disposition'" :disabled="!canDispose() || modal.saving"
            @click="saveDispose('approve')" x-text="modal.saving ? '提交中…' : '确认批准'"></button>
          <button class="b-sm" x-show="modal.mode === 'disposition'" :disabled="!canDispose() || modal.saving"
            @click="saveDispose('reject')" x-text="'确认拒绝'"></button>
          <button class="b-pri b-sm" x-show="modal.mode === 'implement'" :disabled="modal.saving"
            @click="saveImplement()" x-text="modal.saving ? '提交中…' : '确认实施'"></button>
        </div>
      </div>
    </div>
    </template>
  </div>
</div>

<!-- 提出变更 模态 -->
<div x-show="form.open" x-cloak class="modal-mask" style="position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(14,27,42,.35)">
  <div class="card" style="width:720px;max-height:88vh;overflow:auto;margin:0">
    <div class="tagline" style="padding:12px 16px;border-bottom:1px solid var(--line)">
      <b>提出变更</b>
      <div class="right"><button class="b-sm" @click="closeForm()">取消</button></div>
    </div>
    <!-- ⚠ 同详情模态：必须 x-if（x-show 仍会求值 null 上的绑定） -->
    <template x-if="form.d">
    <div class="bd">
      <div style="display:grid;grid-template-columns:96px 1fr;gap:8px 12px;align-items:center">
        <label>标题</label><input x-model="form.d.title" placeholder="这次要改什么（必填）">
        <label>申请方</label>
        <div>
          <input x-model="form.d.requester" list="sh-options-form" placeholder="提出人 / 组织（必填，可从利益相关者里选）" style="width:100%">
          <datalist id="sh-options-form">
            <template x-for="x in owners" :key="x.name">
              <option :value="x.name" x-text="x.name + ' · ' + (x.sh_no || '')"></option>
            </template>
          </datalist>
        </div>
        <label>变更说明</label><textarea x-model="form.d.description" rows="2" placeholder="为什么改、改成什么（选填）"></textarea>
        <!-- F-2：影响范围是**多选**下拉，选项来自跨应用（配置项台账 / 需求台账） -->
        <label>影响配置项</label>
        <select multiple size="4" x-model="form.d.ci_nos">
          <template x-for="c in cis" :key="c.ci_no">
            <option :value="c.ci_no" x-text="c.ci_no + ' · ' + c.name"></option>
          </template>
        </select>
        <label>影响需求</label>
        <select multiple size="4" x-model="form.d.req_nos">
          <template x-for="r in reqs" :key="r.req_no">
            <option :value="r.req_no" x-text="r.req_no + ' · ' + r.title"></option>
          </template>
        </select>
        <label>所属项目</label><input x-model="form.d.project_no" placeholder="选填">
      </div>
      <div class="tagline" style="margin-top:12px">
        <span class="muted" style="font-size:11px">
          标题 / 申请方必填，且**影响范围至少选一个配置项或一条需求**（BR-01：没有影响范围无从评估）
        </span>
        <div class="right"><button class="b-pri b-sm" :disabled="!canSubmit() || form.saving" @click="saveForm()"
          x-text="form.saving ? '提交中…' : '提交'"></button></div>
      </div>
    </div>
    </template>
  </div>
</div>
