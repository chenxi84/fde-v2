<!-- 列表三段式：过滤条 / 表格 / 分页条 -->
<div class="card mt12"><div class="bd" style="padding:0">
  <!-- ══ 标题区：标题 + 说明 + 主操作（新建） ══ -->
  <div class="tagline" style="padding:12px 16px">
    <b>出库计划</b>
    <span class="muted" style="font-size:12px">手工登记 · 到期自动关闭 · 关闭后可编辑延期恢复</span>
    <div class="right tagline" style="gap:8px">
      <button class="b-pri b-sm" @click="openCreate()">+ 新建出库计划</button>
    </div>
  </div>
  <!-- ══ 过滤条：物料 autocomplete + 客户下拉 + 状态 chips（与 list 参数一一对应） ══ -->
  <div class="tagline" style="padding:10px 16px; border-top:1px solid var(--line); flex-wrap:wrap">
    <span class="muted" style="font-size:12px">台账</span>
    <div class="right tagline" style="gap:8px; flex-wrap:wrap">
      <div style="position:relative">
        <input :value="fMaterial" @focus="openAc('filter')" @click.stop="openAc('filter')"
          @input="fMaterial = $event.target.value; openAc('filter')" @keydown.enter="search()"
          placeholder="搜索物料号 / 名称…" autocomplete="off" style="width:180px">
        <div class="autocomplete-drop" x-show="acShow === 'filter' && matFiltered.length" @click.away="acShow = ''"
          style="position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);max-height:220px;overflow:auto;z-index:100;border-radius:4px">
          <template x-for="no in matFiltered" :key="no">
            <div @click="pickMat(no)" style="padding:6px 8px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line-sub)">
              <div class="mono" x-text="no"></div>
              <div class="muted" style="font-size:11px" x-text="dash(matName(no))"></div>
            </div>
          </template>
        </div>
      </div>
      <select x-model="fCustomer" @change="search()" style="width:160px">
        <option value="">全部客户</option>
        <template x-for="c in custOptions" :key="c.customer_no">
          <option :value="c.customer_no" x-text="c.customer_no + ' · ' + (c.customer_name || '')"></option>
        </template>
      </select>
      <div class="chips">
        <template x-for="s in ['', '待出库', '已关闭']" :key="s || '全部'">
          <span class="fchip" :class="{on: fStatus === s}" @click="fStatus = s; search()" x-text="s || '全部'"></span>
        </template>
      </div>
      <button class="b-ghost b-sm" @click="search()">查询</button>
      <button class="b-ghost b-sm" @click="resetFilters()">重置</button>
    </div>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr>
        <th>计划号</th><th>客户</th><th>物料</th><th class="right">数量</th>
        <th>计划出库日期</th><th>实际出库单号</th><th>状态</th><th class="right">操作</th>
      </tr>
      <template x-if="!list.items.length">
        <tr><td colspan="8" class="empty">无符合条件的出库计划 —— 点「新建出库计划」创建</td></tr>
      </template>
      <template x-for="d in list.items" :key="d.plan_no">
        <tr class="data">
          <td><button class="b-link mono" @click="viewX(d)" x-text="d.plan_no"></button></td>
          <td><span class="mono" x-text="d.customer_no"></span>
            <span class="muted" style="font-size:11px" x-show="custName(d.customer_no)" x-text="' · ' + custName(d.customer_no)"></span></td>
          <td><span class="mono" x-text="d.material_no"></span>
            <span class="muted" style="font-size:11px" x-show="matName(d.material_no)" x-text="' · ' + matName(d.material_no)"></span></td>
          <td class="right mono" x-text="fmt(d.qty)"></td>
          <td class="mono" x-text="d.out_date"></td>
          <td class="mono" x-text="dash(d.actual_out_no)"></td>
          <td><span class="st" :class="'st-' + statusHue(d.status)" x-text="d.status"></span></td>
          <td class="right rowact">
            <button class="b-ghost b-sm" @click="openEdit(d)">编辑</button>
            <button class="b-ghost b-sm" x-show="d.status === '待出库'" @click="removeX(d)">删除</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:10px 16px">
    <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
    <div class="right tagline" style="gap:8px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
      <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
      <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
    </div>
  </div>
</div></div>

<!-- ════════════ 详情模态（outbound_plan.get 全字段） ════════════ -->
<div class="modal-mask" x-show="modalX.open" @click.self="closeX()"
     @keydown.escape.window="closeX()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div class="docno" x-text="modalX.d ? ('出库计划 · ' + modalX.d.plan_no) : '出库计划详情'"></div>
        <div class="sub">出库计划 · OUTBOUND PLAN</div>
      </div>
      <template x-if="modalX.d">
        <span class="st" :class="'st-' + statusHue(modalX.d.status)" x-text="modalX.d.status"></span>
      </template>
      <button class="x" @click="closeX()">✕</button>
    </div>
    <div class="modal-bd">
      <template x-if="modalX.loading">
        <div class="loadbox"><span class="spin">◌</span><br>载入明细…</div>
      </template>
      <template x-if="!modalX.loading && modalX.d">
        <div>
          <div class="sec">计划信息</div>
          <div class="kv">
            <div><div class="k">计划号</div><div class="v mono" x-text="dash(modalX.d.plan_no)"></div>
              <div class="muted" style="font-size:11px">系统自动生成 · 主键</div></div>
            <div><div class="k">客户</div><div class="v mono"><span x-text="dash(modalX.d.customer_no)"></span>
              <span class="muted" style="font-size:11px" x-show="custName(modalX.d.customer_no)"
                x-text="' · ' + custName(modalX.d.customer_no)"></span></div></div>
            <div><div class="k">物料</div><div class="v mono"><span x-text="dash(modalX.d.material_no)"></span>
              <span class="muted" style="font-size:11px" x-show="matName(modalX.d.material_no)"
                x-text="' · ' + matName(modalX.d.material_no)"></span></div></div>
            <div><div class="k">数量</div><div class="v mono" x-text="fmt(modalX.d.qty)"></div></div>
            <div><div class="k">计划出库日期</div><div class="v mono" x-text="dash(modalX.d.out_date)"></div>
              <div class="muted" style="font-size:11px">早于今日自动关闭；编辑延期到今日及以后恢复待出库</div></div>
            <div><div class="k">实际出库单号</div><div class="v mono" x-text="dash(modalX.d.actual_out_no)"></div>
              <div class="muted" style="font-size:11px">执行后回填的 ERP 出库单号（可选）</div></div>
          </div>

          <details class="raw"><summary>原始数据</summary>
            <pre class="json" x-text="JSON.stringify(modalX.d, null, 2)"></pre></details>
        </div>
      </template>
    </div>
    <div class="modal-ft" x-show="modalX.d">
      <template x-if="modalX.d">
        <div class="tagline" style="gap:8px">
          <button class="b-pri" @click="editFromDetail()">编辑</button>
          <button class="b-ghost" @click="closeX()">关闭</button>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- ════════════ 新建 / 编辑共用表单模态 ════════════ -->
<div class="modal-mask" x-show="form.open" @click.self="closeForm()"
     @keydown.escape.window="closeForm()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div class="docno" x-text="formTitle()"></div>
        <div class="sub">到期自动关闭 · 关闭后编辑延期到今日及以后即恢复待出库</div>
      </div>
      <button class="x" @click="closeForm()">✕</button>
    </div>
    <div class="modal-bd">
      <div class="frow">
        <div>
          <label class="f">客户 <span class="req">*</span></label>
          <select x-model="form.customer_no">
            <option value="">请选择客户</option>
            <template x-for="c in custOptions" :key="c.customer_no">
              <option :value="c.customer_no" x-text="c.customer_no + ' · ' + (c.customer_name || '')"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="f">物料 <span class="req">*</span></label>
          <span style="position:relative; display:block">
            <input :value="form.material_no" @focus="openAc('form')" @click.stop="openAc('form')"
              @input="form.material_no = $event.target.value; openAc('form')"
              placeholder="搜索物料号 / 名称…">
            <div class="autocomplete-drop" x-show="acShow === 'form' && matFiltered.length" @click.away="acShow = ''"
              style="position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);max-height:220px;overflow:auto;z-index:100;border-radius:4px">
              <template x-for="no in matFiltered" :key="no">
                <div @click="pickMat(no)" style="padding:6px 8px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line-sub)">
                  <div class="mono" x-text="no"></div>
                  <div class="muted" style="font-size:11px" x-text="dash(matName(no))"></div>
                </div>
              </template>
            </div>
          </span>
        </div>
      </div>
      <div class="frow">
        <div>
          <label class="f">数量 <span class="req">*</span></label>
          <input type="number" min="0" step="any" x-model="form.qty" placeholder="出库数量（大于 0）">
        </div>
        <div>
          <label class="f">计划出库日期 <span class="req">*</span></label>
          <input type="date" x-model="form.out_date">
          <div class="muted" style="font-size:11px;margin-top:4px">早于今日将直接记为已关闭</div>
        </div>
        <div>
          <label class="f">实际出库单号</label>
          <input x-model="form.actual_out_no" maxlength="50" placeholder="执行后回填（可选）">
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <div class="tagline" style="gap:8px">
        <span class="muted">客户 / 物料 / 数量 / 计划出库日期为必填</span>
        <div class="right tagline" style="gap:8px">
          <button class="b-ghost" @click="closeForm()">取消</button>
          <button class="b-pri" :disabled="form.busy" @click="save()"
            x-text="form.busy ? '处理中…' : (form.mode === 'create' ? '创建' : '保存修改')"></button>
        </div>
      </div>
    </div>
  </div>
</div>
