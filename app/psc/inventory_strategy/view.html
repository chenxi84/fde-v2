<!-- ══ 计算入口条（替代创建表单 —— 自动参考创建：水位/对冲工具均为系统派生，禁止手工录入） ══ -->
<div class="card mt12"><div class="bd">
  <div class="tagline" style="flex-wrap:wrap; gap:8px">
    <b>计算入口</b>
    <span class="muted" style="font-size:12px">三层水位 / 对冲工具为系统计算派生值 · 禁止手工录入</span>
    <div class="right tagline" style="gap:8px; flex-wrap:wrap">
      <select x-model="calc.version_no" style="width:140px">
        <option value="">选择月度版本…</option>
        <template x-if="!versionOptions.length"><option value="" disabled>暂无版本</option></template>
        <template x-for="v in versionOptions" :key="v.version_no">
          <option :value="v.version_no" x-text="v.version_no"></option>
        </template>
      </select>
      <div style="position:relative">
        <input x-model="calc.material_no"
               @click.stop="openMaterial('c')"
               @input="matOpen='c'; filterMaterial(calc.material_no)"
               placeholder="物料号 / 名称…" autocomplete="off" style="width:180px">
        <div x-show="matOpen==='c'" @click.away="matOpen=''"
             style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                    background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
          <div x-show="!materialFiltered.length" style="padding:8px; color:#999">无匹配物料</div>
          <template x-for="m in materialFiltered" :key="m.material_no">
            <div @mousedown.prevent="pickMaterial(m, 'c')"
                 style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                 @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
              <div class="mono" style="font-weight:500" x-text="m.material_no"></div>
              <div style="font-size:12px; color:#888" x-text="m.material_name || '—'"></div>
            </div>
          </template>
        </div>
      </div>
      <button class="b-pri b-sm" :disabled="calc.busy" @click="calcOne()"
        x-text="calc.busy ? '计算中…' : '计算'"></button>
      <button class="b-ghost b-sm" :disabled="calc.batchBusy" @click="calcBatch()"
        x-text="calc.batchBusy ? '批量计算中…' : '批量计算'"></button>
    </div>
  </div>
  <div class="muted" style="font-size:11px; margin-top:6px">
    「计算」需版本 + 物料；「批量计算」仅需版本，对整版本全部正常物料逐条计算，单个失败不中断其余。
  </div>
</div></div>

<!-- ══ 列表：过滤区 + 表格 + 分页条（与 inventory_strategy.list 参数一一对应） ══ -->
<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
    <b>库存策略台账</b>
    <span class="muted" style="font-size:12px">三层水位 · 最低 A / 安全 C / 组批 B · 水位带下限 A+C · 上限 A+C+B</span>
    <div class="right tagline" style="gap:8px; flex-wrap:wrap">
      <div class="chips">
        <template x-for="s in ['', '库存', '速度']" :key="s || '全部'">
          <span class="fchip" :class="{on: fHedge === s}"
            @click="fHedge = s; list.load(1)" x-text="s || '全部'"></span>
        </template>
      </div>
      <select x-model="fVersion" @change="search()" style="width:140px">
        <option value="">全部版本</option>
        <template x-if="!versionOptions.length"><option value="" disabled>暂无版本</option></template>
        <template x-for="v in versionOptions" :key="v.version_no">
          <option :value="v.version_no" x-text="v.version_no"></option>
        </template>
      </select>
      <div style="position:relative">
        <input x-model="fMaterial"
               @click.stop="openMaterial('f')"
               @input="matOpen='f'; filterMaterial(fMaterial)"
               @keydown.enter="matOpen=''; search()"
               placeholder="物料号 / 名称…" autocomplete="off" style="width:180px">
        <div x-show="matOpen==='f'" @click.away="matOpen=''"
             style="position:absolute; top:100%; left:0; right:0; max-height:240px; overflow-y:auto;
                    background:#fff; border:1px solid #ccc; border-radius:4px; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.1)">
          <div x-show="!materialFiltered.length" style="padding:8px; color:#999">无匹配物料</div>
          <template x-for="m in materialFiltered" :key="m.material_no">
            <div @mousedown.prevent="pickMaterial(m, 'f'); search()"
                 style="padding:6px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0"
                 @mouseenter="$el.style.background='#f5f5f5'" @mouseleave="$el.style.background=''">
              <div class="mono" style="font-weight:500" x-text="m.material_no"></div>
              <div style="font-size:12px; color:#888" x-text="m.material_name || '—'"></div>
            </div>
          </template>
        </div>
      </div>
      <button class="b-ghost b-sm" @click="resetFilters()">重置</button>
    </div>
  </div>
  <!-- ══ 表格：列 ⊆ 详情字段集；序 = 版本 → 物料 → 分层 → 水位 → 参数 → 操作 ══ -->
  <div class="scroll-x">
    <table class="tbl tight">
      <tr>
        <th>版本</th><th>物料</th><th>对冲工具</th>
        <th>最低水位 A</th><th>安全水位 C</th><th>组批水位 B</th>
        <th>下限 A+C</th><th>上限 A+C+B</th>
        <th>服务系数</th><th>响应波动 σ_L</th><th>组批窗口</th>
        <th class="right">操作</th>
      </tr>
      <template x-if="!list.items.length">
        <tr><td colspan="12" class="empty"
          x-text="(fVersion || fMaterial || fHedge) ? '无匹配数据' : '暂无库存策略 —— 请选择版本与物料后点击「计算」'"></td></tr>
      </template>
      <template x-for="d in list.items" :key="d.version_no + '|' + d.material_no">
        <tr class="data">
          <td class="mono" x-text="dash(d.version_no)"></td>
          <td>
            <button class="b-link mono" @click="viewX(d)" x-text="d.material_no"></button>
            <span class="st" style="margin-left:6px" x-show="switchInfo(d.material_no)"
                  :class="switchInfo(d.material_no) ? switchInfo(d.material_no).cls : ''"
                  :title="switchInfo(d.material_no) ? switchInfo(d.material_no).time : ''"
                  x-text="switchInfo(d.material_no) ? switchInfo(d.material_no).label : ''"></span>
            <template x-if="materialName(d.material_no)">
              <div class="muted" style="font-size:11px" x-text="materialName(d.material_no)"></div>
            </template>
          </td>
          <td><span class="st" :class="'st-' + hue(d.hedge_tool)" x-text="dash(d.hedge_tool)"></span></td>
          <td class="num" x-text="fmt(d.min_level)"></td>
          <td class="num" x-text="fmt(d.safety_level)"></td>
          <td class="num" x-text="fmt(d.batch_level)"></td>
          <td class="num" x-text="fmt(d.lower)">
            <div class="muted" style="font-size:11px">补货触发线</div>
          </td>
          <td class="num" x-text="fmt(d.upper)">
            <div class="muted" style="font-size:11px">组批封顶线</div>
          </td>
          <td class="num" x-text="dash(d.service_factor)"></td>
          <td class="num" x-text="fmt(d.resp_volatility)"></td>
          <td class="num" x-text="batchDays(d.batch_window)"></td>
          <td class="right rowact" style="white-space:nowrap">
            <button class="b-ghost b-sm" @click="recalc(d)">重算</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <!-- ══ 分页条 ══ -->
  <div class="tagline" style="padding:10px 16px">
    <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
    <div class="right tagline" style="gap:8px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
      <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
      <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
    </div>
  </div>
</div></div>

<!-- ════════════ 详情模态（查全：inventory_strategy.get 全字段） ════════════ -->
<div class="modal-mask" x-show="modalX.open" @click.self="closeX()"
     @keydown.escape.window="closeX()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div class="docno" x-text="modalX.d ? modalX.d.material_no : '库存策略'"></div>
        <div class="sub" x-text="modalX.d ? ('版本 ' + modalX.d.version_no + ' · 库存策略') : '库存策略 · INVENTORY STRATEGY'"></div>
      </div>
      <template x-if="modalX.d">
        <span class="st" :class="'st-' + hue(modalX.d.hedge_tool)" x-text="modalX.d.hedge_tool"></span>
      </template>
      <button class="x" @click="closeX()">✕</button>
    </div>
    <div class="modal-bd">
      <template x-if="modalX.loading">
        <div class="loadbox"><span class="spin">◌</span><br>载入明细…</div>
      </template>
      <template x-if="!modalX.loading && modalX.d">
        <div>
          <div class="sec">版本与物料</div>
          <div class="kv">
            <div><div class="k">月度版本</div><div class="v mono" x-text="dash(modalX.d.version_no)"></div>
              <div class="muted" style="font-size:11px">主数据引用：md_monthly_version</div></div>
            <div><div class="k">物料号</div><div class="v mono" x-text="dash(modalX.d.material_no)"></div>
              <div class="muted" style="font-size:11px" x-text="materialName(modalX.d.material_no) || '主数据引用：md_material'"></div></div>
          </div>

          <div class="sec">品种分层</div>
          <div class="kv">
            <div><div class="k">对冲工具</div><div class="v">
              <span class="st" :class="'st-' + hue(modalX.d.hedge_tool)" x-text="dash(modalX.d.hedge_tool)"></span></div>
              <div class="muted" style="font-size:11px">库存=备货对冲波动；速度=不备货靠快速响应。系统判定 · 禁止手工录入</div></div>
          </div>

          <div class="sec">三层水位</div>
          <div class="kv">
            <div><div class="k">最低水位 A</div><div class="v mono" x-text="fmt(modalX.d.min_level)"></div>
              <div class="muted" style="font-size:11px">兜"时间缺口"= 日需求 × max(0, 生产+物流 − 可用缓冲)，防断货</div></div>
            <div><div class="k">安全水位 C</div><div class="v mono" x-text="fmt(modalX.d.safety_level)"></div>
              <div class="muted" style="font-size:11px">兜"需求波动"= 服务系数 × 响应窗口波动</div></div>
            <div><div class="k">组批水位 B</div><div class="v mono" x-text="fmt(modalX.d.batch_level)"></div>
              <div class="muted" style="font-size:11px">= 日需求 × 组批窗口，组批封顶上限（非补货目标）</div>
              <div class="muted" style="font-size:11px" x-show="modalX.d.hedge_tool === '速度'">速度对冲物料 B=0</div></div>
          </div>

          <div class="sec">水位带（派生）</div>
          <div class="kv">
            <div><div class="k">下限 A+C</div><div class="v mono" x-text="fmt(modalX.d.lower)"></div>
              <div class="muted" style="font-size:11px">补货触发线</div></div>
            <div><div class="k">上限 A+C+B</div><div class="v mono" x-text="fmt(modalX.d.upper)"></div>
              <div class="muted" style="font-size:11px">组批封顶线</div></div>
            <div class="muted" style="grid-column: span 2; font-size:11px">派生值 · 不单独存储 · 下限=A+C · 上限=A+C+B</div>
          </div>

          <div class="sec">计算参数</div>
          <div class="kv">
            <div><div class="k">服务系数</div><div class="v mono" x-text="dash(modalX.d.service_factor)"></div>
              <div class="muted" style="font-size:11px">满足率目标对应 z 值（90%→1.28 / 95%→1.65 / 98%→2.05 / 99%→2.33），由物料满足率目标推导</div></div>
            <div><div class="k">响应窗口波动 σ_L</div><div class="v mono" x-text="fmt(modalX.d.resp_volatility)"></div>
              <div class="muted" style="font-size:11px">响应窗口（生产+物流）内累计需求的标准差，安全库存的波动项</div></div>
            <div><div class="k">组批窗口</div><div class="v mono" x-text="batchDays(modalX.d.batch_window)"></div>
              <div class="muted" style="font-size:11px">一次组批覆盖的天数，越长切线越少但库存越高</div></div>
          </div>

          <div class="sec">设定依据</div>
          <div style="white-space:pre-wrap; line-height:1.7; padding:2px 0 6px" x-text="dash(modalX.d.basis)"></div>

          <details class="raw"><summary>原始数据</summary>
            <pre class="json" x-text="JSON.stringify(modalX.d, null, 2)"></pre></details>
        </div>
      </template>
    </div>
    <div class="modal-ft" x-show="modalX.d">
      <template x-if="modalX.d">
        <div class="tagline" style="gap:8px">
          <span class="muted" style="font-size:11px">重复计算即覆盖更新（BR-01）</span>
          <button class="b-pri right" @click="recalc(modalX.d)">重算</button>
        </div>
      </template>
    </div>
  </div>
</div>
