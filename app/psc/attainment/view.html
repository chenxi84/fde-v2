<!-- 达成率与置信度 · 只读台账（自动参考创建，无新建/编辑/删除入口） -->
<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
    <b>达成率与置信度</b>
    <span class="muted">派生指标 · 历史台账单表计算 · 只读</span>
    <div class="right tagline" style="gap:8px">
      <!-- 客户 autocomplete（主数据选择铁律：内联 autocomplete，非 <select>） -->
      <div style="position:relative">
        <input x-model="custQuery" placeholder="客户编码 / 名称…" style="width:170px"
          @click.stop="custOpen = true" @input="custOpen = true"
          @keydown.enter="custOpen = false" @keydown.escape="custOpen = false">
        <button x-show="customer_no" @click="clearCust()" title="清除客户筛选"
          style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px">✕</button>
        <div x-show="custOpen" @click.away="custOpen = false" x-cloak
          style="position:absolute;z-index:20;top:100%;left:0;right:0;margin-top:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(14,27,42,.12);max-height:240px;overflow:auto">
          <template x-for="o in custFiltered()" :key="o.customer_no">
            <div @click="pickCust(o)" style="padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px">
              <span class="mono" style="font-weight:700" x-text="o.customer_no"></span>
              <span class="muted" style="font-size:11px" x-text="dash(o.customer_name)"></span>
            </div>
          </template>
          <div x-show="!custFiltered().length" class="muted" style="padding:8px 10px;font-size:12px">无匹配客户</div>
        </div>
      </div>
      <!-- 物料 autocomplete -->
      <div style="position:relative">
        <input x-model="matQuery" placeholder="物料号 / 名称…" style="width:170px"
          @click.stop="matOpen = true" @input="matOpen = true"
          @keydown.enter="matOpen = false" @keydown.escape="matOpen = false">
        <button x-show="material_no" @click="clearMat()" title="清除物料筛选"
          style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px">✕</button>
        <div x-show="matOpen" @click.away="matOpen = false" x-cloak
          style="position:absolute;z-index:20;top:100%;left:0;right:0;margin-top:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(14,27,42,.12);max-height:240px;overflow:auto">
          <template x-for="o in matFiltered()" :key="o.material_no">
            <div @click="pickMat(o)" style="padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px">
              <span class="mono" style="font-weight:700" x-text="o.material_no"></span>
              <span class="muted" style="font-size:11px" x-text="dash(o.material_name)"></span>
            </div>
          </template>
          <div x-show="!matFiltered().length" class="muted" style="padding:8px 10px;font-size:12px">无匹配物料</div>
        </div>
      </div>
      <button class="b-pri b-sm" :disabled="computing" @click="runCompute()"
        x-text="computing ? '运算中…' : '运算达成率'"></button>
    </div>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>客户编码</th><th>物料号</th><th>平均绝对百分比误差</th><th>预测偏差</th></tr>
      <template x-if="!list.items.length">
        <tr><td colspan="4" class="empty"
          x-text="(customer_no || material_no) ? '无符合条件的达成率数据' : '暂无达成率数据 —— 点「运算达成率」由历史台账计算生成'"></td></tr>
      </template>
      <template x-for="d in list.items" :key="d.customer_no + '|' + d.material_no">
        <tr class="data">
          <td>
            <button class="b-link mono" @click="viewAtt(d)" x-text="d.customer_no"></button>
            <div x-show="custName(d.customer_no)" style="font-size:11px;color:var(--muted)" x-text="custName(d.customer_no)"></div>
          </td>
          <td>
            <span class="mono" x-text="d.material_no"></span>
            <div x-show="matName(d.material_no)" style="font-size:11px;color:var(--muted)" x-text="matName(d.material_no)"></div>
          </td>
          <td class="mono" x-text="pct(d.mape)"></td>
          <td class="mono" :style="biasStyle(d.bias)" x-text="spct(d.bias)"></td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:10px 16px">
    <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
    <div class="right tagline" style="gap:8px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
      <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
      <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
    </div>
  </div>
</div></div>

<!-- 详情模态：点 customer_no → attainment.get 全量字段 -->
<div class="modal-mask" x-show="modalX.open" @click.self="closeModal()"
     @keydown.escape.window="closeModal()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div class="docno" x-text="modalX.d ? modalX.d.customer_no + ' · ' + modalX.d.material_no : '达成率详情'"></div>
        <div class="sub">达成率与置信度 · 客户×物料派生指标 · ATTAINMENT</div>
      </div>
      <button class="x" @click="closeModal()">✕</button>
    </div>
    <div class="modal-bd">
      <template x-if="modalX.loading">
        <div class="loadbox"><span class="spin">◌</span><br>载入明细…</div>
      </template>
      <template x-if="!modalX.loading && !modalX.d">
        <div class="empty" style="padding:40px 0">记录不存在或已被 ERP 覆盖回写</div>
      </template>
      <template x-if="!modalX.loading && modalX.d">
        <div>
          <div class="sec">标识信息</div>
          <div class="kv">
            <div><div class="k">客户编码</div><div class="v mono" x-text="dash(modalX.d.customer_no)"></div></div>
            <div><div class="k">物料号</div><div class="v mono" x-text="dash(modalX.d.material_no)"></div></div>
            <div style="grid-column: span 2"><div class="k">主键</div><div class="v muted">联合主键 · 客户+物料唯一（BR-01）</div></div>
          </div>
          <div class="sec">主数据回显</div>
          <div class="kv">
            <div><div class="k">客户名称</div><div class="v" x-text="dash(custName(modalX.d.customer_no))"></div></div>
            <div><div class="k">物料名称</div><div class="v" x-text="dash(matName(modalX.d.material_no))"></div></div>
            <div style="grid-column: span 2"><div class="k">来源</div><div class="v muted">弱引用主数据，来源 md_customer / md_material（BR-02）</div></div>
          </div>
          <div class="sec">达成率指标</div>
          <div class="kv">
            <div style="grid-column: span 2"><div class="k">平均绝对百分比误差（MAPE）</div><div class="v mono" x-text="pct(modalX.d.mape)"></div></div>
            <div style="grid-column: span 2"><div class="k">说明</div><div class="v muted">平均绝对百分比误差 · 越小越准 · 非负（BR-04）</div></div>
          </div>
          <div class="sec">置信度指标</div>
          <div class="kv">
            <div style="grid-column: span 2"><div class="k">预测偏差（bias）</div><div class="v mono" :style="biasStyle(modalX.d.bias)" x-text="spct(modalX.d.bias)"></div></div>
            <div style="grid-column: span 2"><div class="k">说明</div><div class="v muted">多报为正、少报为负 · ERP 统计回写，本应用只存储不计算（BR-03）</div></div>
          </div>
          <details class="raw"><summary>原始数据</summary>
            <pre class="json" x-text="JSON.stringify(modalX.d, null, 2)"></pre></details>
        </div>
      </template>
    </div>
    <div class="modal-ft" x-show="modalX.d">
      <template x-if="modalX.d">
        <div class="tagline" style="gap:8px">
          <span class="muted">只读派生数据 · 由 ERP 统计回写 · 无修改 / 删除入口</span>
          <button class="b-ghost right" @click="closeModal()">关闭</button>
        </div>
      </template>
    </div>
  </div>
</div>
