<div>
  <!-- ══ Tab 导航 ══ -->
  <div class="card mt12">
    <div class="bd" style="padding:0">
      <div class="tagline" style="padding:12px 16px; gap:2px">
        <template x-for="t in ['customer', 'part', 'vehicle', 'user', 'calendar']" :key="t">
          <button class="tab" :class="{on: tab === t}" @click="switchTab(t)"
            x-text="tabLabel(t)"></button>
        </template>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- 客户 Tab -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div x-show="tab === 'customer'">
    <div class="card mt12"><div class="bd" style="padding:0">
      <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
        <b>客户列表</b>
        <span class="muted">OEM 客户主数据</span>
        <div class="right tagline" style="gap:8px">
          <span class="muted" x-text="'共 ' + customerList.total + ' 条'"></span>
        </div>
      </div>
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th>OEM 代码</th><th>OEM 名称</th><th>结算模式</th><th class="right">操作</th></tr>
          <template x-if="!customerList.items.length">
            <tr><td colspan="4" class="empty">暂无客户数据</td></tr>
          </template>
          <template x-for="d in customerList.items" :key="d.oem_code">
            <tr class="data">
              <td><button class="b-link mono" @click="viewCustomer(d)" x-text="d.oem_code"></button></td>
              <td x-text="dash(d.oem_name)"></td>
              <td x-text="dash(d.settle_mode)"></td>
              <td class="right rowact">
                <button class="b-ghost b-sm" @click="viewCustomer(d)">详情</button>
              </td>
            </tr>
          </template>
        </table>
      </div>
      <div class="tagline" style="padding:10px 16px">
        <span class="muted"></span>
        <div class="right tagline" style="gap:8px">
          <button class="b-ghost b-sm" :disabled="customerList.page <= 1" @click="customerList.load(customerList.page - 1)">‹ 上一页</button>
          <span class="muted mono" x-text="customerList.page + ' / ' + customerList.pages"></span>
          <button class="b-ghost b-sm" :disabled="customerList.page >= customerList.pages" @click="customerList.load(customerList.page + 1)">下一页 ›</button>
        </div>
      </div>
    </div></div>
  </div>

  <!-- 客户详情模态 -->
  <div class="modal-mask" x-show="customerModal.open" @click.self="closeCustomerModal()"
       @keydown.escape.window="closeCustomerModal()" x-cloak>
    <div class="modal">
      <div class="modal-hd">
        <div><div class="docno" x-text="customerModal.d ? customerModal.d.oem_code : '客户详情'"></div>
          <div class="sub">客户主数据 · CUSTOMER MASTER</div></div>
        <button class="x" @click="closeCustomerModal()">✕</button>
      </div>
      <div class="modal-bd">
        <template x-if="customerModal.loading">
          <div class="loadbox"><span class="spin">◌</span><br>载入客户明细…</div>
        </template>
        <template x-if="!customerModal.loading && customerModal.d">
          <div>
            <div class="sec">基本信息</div>
            <div class="kv">
              <div><div class="k">OEM 代码</div><div class="v mono" x-text="dash(customerModal.d.oem_code)"></div></div>
              <div><div class="k">OEM 名称</div><div class="v" x-text="dash(customerModal.d.oem_name)"></div></div>
              <div><div class="k">结算模式</div><div class="v" x-text="dash(customerModal.d.settle_mode)"></div></div>
              <div style="grid-column: span 2"><div class="k">地址</div><div class="v" x-text="dash(customerModal.d.address)"></div></div>
              <div style="grid-column: span 2"><div class="k">备注</div><div class="v" x-text="dash(customerModal.d.remark)"></div></div>
            </div>

            <div class="sec" x-text="'关联工厂 · ' + ((customerModal.d.plants || []).length) + ' 个'"></div>
            <div class="scroll-x">
              <table class="tbl tight">
                <tr><th>工厂代码</th><th>工厂名称</th><th>地址</th></tr>
                <template x-if="!(customerModal.d.plants || []).length">
                  <tr><td colspan="3" class="empty">暂无关联工厂</td></tr>
                </template>
                <template x-for="p in customerModal.d.plants || []" :key="p.plant_code">
                  <tr>
                    <td class="mono" x-text="dash(p.plant_code)"></td>
                    <td x-text="dash(p.plant_name)"></td>
                    <td x-text="dash(p.address)"></td>
                  </tr>
                </template>
              </table>
            </div>

            <details class="raw"><summary>原始数据</summary>
              <pre class="json" x-text="JSON.stringify(customerModal.d, null, 2)"></pre></details>
          </div>
        </template>
      </div>
      <div class="modal-ft" x-show="customerModal.d">
        <div class="tagline" style="gap:8px">
          <button class="b-ghost right" @click="closeCustomerModal()">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════ -->

      <div class="scroll-x">

        <template x-if="!partModal.loading && partModal.d">

              <div style="grid-column: span 2"><div class="k">规格描述</div><div class="v" x-text="dash(partModal.d.spec)"></div></div>
              <div style="grid-column: span 2"><div class="k">备注</div><div class="v" x-text="dash(partModal.d.remark)"></div></div>

  <!-- 用户 Tab -->

    <div class="card mt12"><div class="bd" style="padding:0">
      <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
        <b>用户列表</b>
        <span class="muted">系统用户主数据</span>
        <div class="right tagline" style="gap:8px">
          <span class="muted" x-text="'共 ' + userList.total + ' 条'"></span>
        </div>
      </div>
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th>用户编号</th><th>姓名</th><th>部门</th><th>角色</th><th class="right">操作</th></tr>
          <template x-if="!userList.items.length">
            <tr><td colspan="5" class="empty">暂无用户数据</td></tr>
          </template>
          <template x-for="d in userList.items" :key="d.userno">
            <tr class="data">
              <td><button class="b-link mono" @click="viewUser(d)" x-text="d.userno"></button></td>
              <td x-text="dash(d.name)"></td>
              <td x-text="dash(d.department)"></td>

  <!-- 日历 Tab -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div x-show="tab === 'calendar'">
    <div class="card mt12"><div class="bd" style="padding:0">

        <b>工作日历</b>
        <span class="muted">工厂工作日历主数据</span>

        <table class="tbl tight">
          <tr><th>日期</th><th>工厂</th><th>类型</th><th>描述</th></tr>
          <template x-if="!calendarList.items.length">
            <tr><td colspan="4" class="empty">暂无日历数据</td></tr>
          </template>
          <template x-for="d in calendarList.items" :key="d.calendar_date || d.date || ''">
            <tr class="data">
              <td class="mono" x-text="dash(d.calendar_date || d.date)"></td>
              <td x-text="dash(d.plant_code)"></td>
              <td x-text="dash(d.day_type)"></td>
              <td x-text="dash(d.description)"></td>
