<div>
  <!-- 新建表单 -->
  <div class="collapse" :class="{open: form.show}">
    <div class="card mb0">
      <div class="hd">
        <h3>新建拟合任务</h3>
        <span class="hint">创建后添加候选策略 → 执行回测 → 选定最优策略</span>
        <button class="b-ghost b-sm right" @click="form.show = false; resetForm()">收起</button>
      </div>
      <div class="bd">
        <div class="frow">
          <div><label class="f">零件号 <span class="req">*</span></label>
            <input x-model="form.part_no" placeholder="如 8210001"></div>
          <div><label class="f">适用车型 <span class="req">*</span></label>
            <input x-model="form.veh_model" placeholder="如 MODEL-X"></div>
          <div><label class="f">需求形态 <span class="req">*</span></label>
            <select x-model="form.demand_shape">
              <option value="">— 选择形态 —</option>
              <option>稳定</option><option>波动</option><option>季节</option><option>短生命周期</option><option>断续</option>
            </select></div>
          <div><label class="f">数据区间（可选）</label>
            <input x-model="form.data_range" placeholder="如 2024-01~2025-12"></div>
        </div>
        <div class="muted mt8">不同需求形态适用不同预测方法 · BR-01 回测数据必须清洗 · BR-02 严禁未来信息泄漏</div>
        <div class="mt12 tagline">
          <button class="b-pri right" :disabled="form.busy" @click="saveForm()"
            x-text="form.busy ? '处理中…' : '创建拟合单'"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 列表 -->
  <div class="card" :class="form.show ? 'mt12' : ''"><div class="bd" style="padding:0">
    <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
      <b>拟合单列表</b>
      <button class="b-pri b-sm" @click="resetForm(); form.show = !form.show">＋ 新建拟合</button>
      <div class="right tagline" style="gap:8px; flex-wrap:wrap">
        <div class="chips">
          <template x-for="s in ['', '拟合中', '已选定', '生效中', '已替代']" :key="s || '全部'">
            <span class="fchip" :class="{on: fStatus === s}"
              @click="fStatus = s; list.load(1)" x-text="s || '全部'"></span>
          </template>
        </div>
        <div class="chips">
          <template x-for="s in ['', '稳定', '波动', '季节', '短生命周期', '断续']" :key="s || '全部形态'">
            <span class="fchip" :class="{on: fShape === s}"
              @click="fShape = s; list.load(1)" x-text="s || '全部形态'" style="font-size:11px"></span>
          </template>
        </div>
        <input x-model="fPartNo" @keydown.enter="search()" placeholder="零件号" style="width:120px">
        <button class="b-ghost b-sm" @click="search()">查询</button>
      </div>
    </div>
    <div class="scroll-x">
      <table class="tbl tight">
        <tr><th>拟合单号</th><th>零件号</th><th>车型</th><th>需求形态</th><th>状态</th><th>拟合日期</th><th class="right">操作</th></tr>
        <template x-if="!list.items.length">
          <tr><td colspan="7" class="empty"
            x-text="(fStatus || fShape || fPartNo) ? '无符合条件的拟合单' : '暂无拟合单 —— 点「新建拟合」创建'"></td></tr>
        </template>
        <template x-for="d in list.items" :key="d.fit_no">
          <tr class="data">
            <td><button class="b-link mono" @click="viewFit(d)" x-text="d.fit_no"></button></td>
            <td class="mono" x-text="dash(d.part_no)"></td>
            <td x-text="dash(d.veh_model)"></td>
            <td><span class="st" x-text="dash(d.demand_shape)"></span></td>
            <td><span class="st" :class="'st-' + hue(d.status)" x-text="statusLabel(d.status)"></span></td>
            <td class="mono" x-text="fmtTime(d.fit_date)"></td>
            <td class="right rowact" style="white-space:nowrap">
              <button class="b-pri b-sm" x-show="d.status === '已选定'" @click="viewFit(d)">选定策略</button>
              <button class="b-ghost b-sm" x-show="d.status === '拟合中'" @click="viewFit(d)">管理候选</button>
              <button class="b-ghost b-sm" x-show="d.status === '生效中'" @click="viewFit(d)">查看</button>
            </td>
          </tr>
        </template>
      </table>
    </div>
    <div class="tagline" style="padding:10px 16px">
      <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
      <div class="right tagline" style="gap:8px">
        <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
        <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
        <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
      </div>
    </div>
  </div></div>

  <!-- 详情模态 -->
  <div class="modal-mask" x-show="modal.open" @click.self="closeModal()"
       @keydown.escape.window="closeModal()" x-cloak>
    <div class="modal">
      <div class="modal-hd">
        <div>
          <div class="docno" x-text="modal.d ? modal.d.header.fit_no : '策略拟合单'"></div>
          <div class="sub">策略仿真拟合 · STRATEGY SIMULATION</div>
        </div>
        <template x-if="modal.d">
          <span class="st" :class="'st-' + hue(modal.d.header.status)" x-text="statusLabel(modal.d.header.status)"></span>
        </template>
        <button class="x" @click="closeModal()">✕</button>
      </div>
      <div class="modal-bd">
        <template x-if="modal.loading">
          <div class="loadbox"><span class="spin">◌</span><br>载入拟合单明细…</div>
        </template>
        <template x-if="!modal.loading && modal.d">
          <div>
            <div class="sec">拟合信息</div>
            <div class="kv">
              <div><div class="k">拟合单号</div><div class="v mono" x-text="dash(modal.d.header.fit_no)"></div></div>
              <div><div class="k">零件号</div><div class="v mono" x-text="dash(modal.d.header.part_no)"></div></div>
              <div><div class="k">适用车型</div><div class="v" x-text="dash(modal.d.header.veh_model)"></div></div>
              <div><div class="k">需求形态</div><div class="v" x-text="dash(modal.d.header.demand_shape)"></div></div>
              <div><div class="k">数据区间</div><div class="v" x-text="dash(modal.d.header.data_range)"></div></div>
              <div><div class="k">回测规格</div><div class="v" x-text="dash(modal.d.header.backtest_spec)"></div></div>
              <div><div class="k">拟合人</div><div class="v" x-text="dash(modal.d.header.fitter)"></div></div>
              <div><div class="k">拟合日期</div><div class="v mono" x-text="fmtTime(modal.d.header.fit_date)"></div></div>
            </div>

            <div class="sec" x-text="'候选策略 · ' + (modal.d.candidates || []).length + ' 条'"></div>
            <div class="scroll-x">
              <table class="tbl tight">
                <tr><th>编号</th><th>策略</th><th>库存策略</th><th class="num">MAPE</th><th class="num">Bias</th><th class="num">服务水平</th><th class="num">库存代价</th><th class="num">综合分</th><th>排名</th><th>选定</th><th class="right">操作</th></tr>
                <template x-if="!(modal.d.candidates || []).length">
                  <tr><td colspan="11" class="empty">暂无候选策略 · 请先 add_candidate</td></tr>
                </template>
                <template x-for="c in modal.d.candidates || []" :key="c.cand_no">
                  <tr :class="{data: true, 'sel-row': c.selected}">
                    <td class="mono" x-text="c.cand_no"></td>
                    <td x-text="dash(c.strategy)"></td>
                    <td x-text="dash(c.inv_policy)"></td>
                    <td class="num" x-text="c.mape != null ? c.mape.toFixed(1) + '%' : '—'"></td>
                    <td class="num" x-text="c.bias != null ? c.bias.toFixed(1) + '%' : '—'"></td>
                    <td class="num" x-text="c.service_level != null ? c.service_level.toFixed(0) + '%' : '—'"></td>
                    <td class="num" x-text="fmt(c.inv_cost)"></td>
                    <td class="num mono font-bold" x-text="c.score != null ? c.score.toFixed(1) : '—'"
                      :class="{'text-red': c.score != null && c.score < 60}"></td>
                    <td x-text="dash(c.rank)"></td>
                    <td x-text="c.selected ? '✔' : ''"></td>
                    <td class="right">
                      <button class="b-pri b-sm" x-show="!c.selected && modal.d.header.status === '已选定'"
                        @click="selectForm.show = true; selectForm.cand_no = c.cand_no">选定</button>
                    </td>
                  </tr>
                </template>
              </table>
            </div>

            <!-- 选定策略表单 -->
            <template x-if="selectForm.show">
              <div>
                <div class="sec">确认选定策略</div>
                <div class="frow">
                  <div><label class="f">候选编号 <span class="req">*</span></label>
                    <input type="number" x-model="selectForm.cand_no" :disabled="true"></div>
                  <div class="muted mt8" style="grid-column:span 2">选定后状态→生效中，D04 将使用该策略生成基线。综合分低于60建议转 D05。</div>
                  <div style="display:flex; align-items:flex-end">
                    <button class="b-pri b-sm" :disabled="selectForm.busy" @click="submitSelect()"
                      x-text="selectForm.busy ? '处理中…' : '确认选定'"></button>
                    <button class="b-ghost b-sm" style="margin-left:6px" @click="selectForm.show = false">取消</button>
                  </div>
                </div>
              </div>
            </template>

            <details class="raw"><summary>原始数据</summary>
              <pre class="json" x-text="JSON.stringify(modal.d, null, 2)"></pre></details>
          </div>
        </template>
      </div>
      <div class="modal-ft" x-show="modal.d">
        <template x-if="modal.d">
          <div class="tagline" style="gap:8px">
            <button class="b-pri" x-show="modal.d.header.status === '拟合中'"
              @click="runBacktest()">执行回测</button>
            <button class="b-pri" x-show="modal.d.header.status === '已选定' && !selectForm.show"
              @click="openSelect()">选定策略</button>
            <template x-if="selectForm.show">
              <button class="b-ghost" @click="selectForm.show = false">取消选定</button>
            </template>
            <span class="muted" x-show="modal.d.header.status === '生效中'">已生效 · D04 正在使用</span>
            <span class="muted" x-show="modal.d.header.status === '已替代'">已被新策略替代</span>
            <button class="b-ghost right" @click="closeModal()">关闭</button>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
