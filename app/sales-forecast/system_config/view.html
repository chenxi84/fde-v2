<div>
  <!-- ══ Tab 导航 ══ -->
  <div class="card mt12">
    <div class="bd" style="padding:0">
      <div class="tagline" style="padding:12px 16px; gap:2px">
        <template x-for="t in ['params', 'templates', 'analogy', 'trust_discount', 'external_source']" :key="t">
          <button class="tab" :class="{on: tab === t}" @click="switchTab(t)"
            x-text="tabLabel(t)"></button>
        </template>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- 参数 Tab -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div x-show="tab === 'params'">
    <div class="card mt12"><div class="bd" style="padding:0">
      <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
        <b>系统参数</b>
        <span class="muted">全局配置项</span>
        <div class="right tagline" style="gap:8px">
          <span class="muted" x-text="'共 ' + paramList.total + ' 条'"></span>
        </div>
      </div>
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th>参数编码</th><th>参数名称</th><th>参数值</th><th>维度</th><th class="right">操作</th></tr>
          <template x-if="!paramList.items.length">
            <tr><td colspan="5" class="empty">暂无参数数据</td></tr>
          </template>
          <template x-for="d in paramList.items" :key="d.param_code">
            <tr class="data">
              <td><button class="b-link mono" @click="viewParam(d)" x-text="d.param_code"></button></td>
              <td x-text="dash(d.param_name)"></td>
              <td x-text="dash(d.value)"></td>
              <td x-text="dash(d.dimension)"></td>
              <td class="right rowact">
                <button class="b-ghost b-sm" @click="viewParam(d)">详情</button>
              </td>
            </tr>
          </template>
        </table>
      </div>
      <div class="tagline" style="padding:10px 16px">
        <span class="muted"></span>
        <div class="right tagline" style="gap:8px">
          <button class="b-ghost b-sm" :disabled="paramList.page <= 1" @click="paramList.load(paramList.page - 1)">‹ 上一页</button>
          <span class="muted mono" x-text="paramList.page + ' / ' + paramList.pages"></span>
          <button class="b-ghost b-sm" :disabled="paramList.page >= paramList.pages" @click="paramList.load(paramList.page + 1)">下一页 ›</button>
        </div>
      </div>
    </div></div>
  </div>

  <!-- 参数详情模态 -->
  <div class="modal-mask" x-show="paramModal.open" @click.self="closeParamModal()"
       @keydown.escape.window="closeParamModal()" x-cloak>
    <div class="modal">
      <div class="modal-hd">
        <div><div class="docno" x-text="paramModal.d ? paramModal.d.param_code : '参数详情'"></div>
          <div class="sub">系统参数 · SYSTEM PARAM</div></div>
        <button class="x" @click="closeParamModal()">✕</button>
      </div>
      <div class="modal-bd">
        <template x-if="paramModal.loading">
          <div class="loadbox"><span class="spin">◌</span><br>载入参数明细…</div>
        </template>
        <template x-if="!paramModal.loading && paramModal.d">
          <div>
            <div class="sec">参数信息</div>
            <div class="kv">
              <div><div class="k">参数编码</div><div class="v mono" x-text="dash(paramModal.d.param_code)"></div></div>
              <div><div class="k">参数名称</div><div class="v" x-text="dash(paramModal.d.param_name)"></div></div>
              <div><div class="k">参数值</div><div class="v" x-text="dash(paramModal.d.value)"></div></div>
              <div><div class="k">维度</div><div class="v" x-text="dash(paramModal.d.dimension)"></div></div>
              <div style="grid-column: span 2"><div class="k">描述</div><div class="v" x-text="dash(paramModal.d.description)"></div></div>
            </div>

            <!-- 参数编辑区 -->
            <template x-if="paramForm.show">
              <div>
                <div class="sec">编辑参数</div>
                <div class="frow">
                  <div><label class="f">参数编码</label>
                    <input x-model="paramForm.param_code" disabled></div>
                  <div><label class="f">参数值 <span class="req">*</span></label>
                    <input x-model="paramForm.value"></div>
                  <div><label class="f">维度</label>
                    <input x-model="paramForm.dimension"></div>
                  <div style="display:flex; align-items:flex-end">
                    <button class="b-pri b-sm" :disabled="paramForm.busy" @click="saveParam()"
                      x-text="paramForm.busy ? '保存中…' : '保存'"></button>
                    <button class="b-ghost b-sm" @click="closeParamEdit()" style="margin-left:6px">取消</button></div>
                </div>
              </div>
            </template>

            <details class="raw"><summary>原始数据</summary>
              <pre class="json" x-text="JSON.stringify(paramModal.d, null, 2)"></pre></details>
          </div>
        </template>
      </div>
      <div class="modal-ft" x-show="paramModal.d">
        <div class="tagline" style="gap:8px">
          <button class="b-ghost" @click="openParamEdit()" x-show="!paramForm.show">编辑参数</button>
          <button class="b-ghost right" @click="closeParamModal()">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- 模板库 Tab -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div x-show="tab === 'templates'">
    <div class="card mt12"><div class="bd" style="padding:0">
      <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
        <b>模板库</b>
        <span class="muted">预测模板管理</span>
        <div class="right tagline" style="gap:8px">
          <span class="muted" x-text="'共 ' + templateList.total + ' 条'"></span>
        </div>
      </div>
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th>模板编号</th><th>来源车型</th><th>使用次数</th><th>创建时间</th></tr>
          <template x-if="!templateList.items.length">
            <tr><td colspan="4" class="empty">暂无模板数据</td></tr>
          </template>
          <template x-for="d in templateList.items" :key="d.tpl_no || d.param_code">
            <tr class="data">
              <td class="mono" x-text="dash(d.tpl_no)"></td>
              <td x-text="dash(d.source_vehicle)"></td>
              <td class="num" x-text="fmt(d.usage_count)"></td>
              <td class="mono" x-text="fmtTime(d.created_at)"></td>
            </tr>
          </template>
        </table>
      </div>
      <div class="tagline" style="padding:10px 16px">
        <span class="muted"></span>
        <div class="right tagline" style="gap:8px">
          <button class="b-ghost b-sm" :disabled="templateList.page <= 1" @click="templateList.load(templateList.page - 1)">‹ 上一页</button>
          <span class="muted mono" x-text="templateList.page + ' / ' + templateList.pages"></span>
          <button class="b-ghost b-sm" :disabled="templateList.page >= templateList.pages" @click="templateList.load(templateList.page + 1)">下一页 ›</button>
        </div>
      </div>
    </div></div>
  </div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- 类比库 Tab -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div x-show="tab === 'analogy'">
    <div class="card mt12"><div class="bd" style="padding:0">
      <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
        <b>类比库</b>
        <span class="muted">类比预测参考数据</span>
        <div class="right tagline" style="gap:8px">
          <span class="muted" x-text="'共 ' + analogyList.total + ' 条'"></span>
        </div>
      </div>
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th>来源车型</th><th>目标车型</th><th>相似度</th><th>创建时间</th></tr>
          <template x-if="!analogyList.items.length">
            <tr><td colspan="4" class="empty">暂无类比数据</td></tr>
          </template>
          <template x-for="d in analogyList.items" :key="d.tpl_no || d.param_code">
            <tr class="data">
              <td class="mono" x-text="dash(d.source_vehicle)"></td>
              <td x-text="dash(d.target_vehicle)"></td>
              <td class="num" x-text="fmt(d.similarity)"></td>
              <td class="mono" x-text="fmtTime(d.created_at)"></td>
            </tr>
          </template>
        </table>
      </div>
      <div class="tagline" style="padding:10px 16px">
        <span class="muted"></span>
        <div class="right tagline" style="gap:8px">
          <button class="b-ghost b-sm" :disabled="analogyList.page <= 1" @click="analogyList.load(analogyList.page - 1)">‹ 上一页</button>
          <span class="muted mono" x-text="analogyList.page + ' / ' + analogyList.pages"></span>
          <button class="b-ghost b-sm" :disabled="analogyList.page >= analogyList.pages" @click="analogyList.load(analogyList.page + 1)">下一页 ›</button>
        </div>
      </div>
    </div></div>
  </div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- 信任折扣 Tab -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div x-show="tab === 'trust_discount'">
    <div class="card mt12"><div class="bd" style="padding:0">
      <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
        <b>信任折扣</b>
        <span class="muted">按 OEM 的预测信任系数</span>
        <div class="right tagline" style="gap:8px">
          <span class="muted" x-text="'共 ' + trustList.total + ' 条'"></span>
        </div>
      </div>
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th>OEM 代码</th><th>信任系数</th><th>方向</th><th class="right">操作</th></tr>
          <template x-if="!trustList.items.length">
            <tr><td colspan="4" class="empty">暂无信任折扣数据</td></tr>
          </template>
          <template x-for="d in trustList.items" :key="d.oem_code || d.param_code">
            <tr class="data">
              <td><button class="b-link mono" @click="viewTrust(d)" x-text="d.oem_code || dash(d.oem_code)"></button></td>
              <td class="num" x-text="fmt(d.coefficient)"></td>
              <td x-text="dash(d.direction)"></td>
              <td class="right rowact">
                <button class="b-ghost b-sm" @click="viewTrust(d)">详情</button>
              </td>
            </tr>
          </template>
        </table>
      </div>
      <div class="tagline" style="padding:10px 16px">
        <span class="muted"></span>
        <div class="right tagline" style="gap:8px">
          <button class="b-ghost b-sm" :disabled="trustList.page <= 1" @click="trustList.load(trustList.page - 1)">‹ 上一页</button>
          <span class="muted mono" x-text="trustList.page + ' / ' + trustList.pages"></span>
          <button class="b-ghost b-sm" :disabled="trustList.page >= trustList.pages" @click="trustList.load(trustList.page + 1)">下一页 ›</button>
        </div>
      </div>
    </div></div>
  </div>

  <!-- 信任折扣详情模态 -->
  <div class="modal-mask" x-show="trustModal.open" @click.self="closeTrustModal()"
       @keydown.escape.window="closeTrustModal()" x-cloak>
    <div class="modal">
      <div class="modal-hd">
        <div><div class="docno" x-text="trustModal.d ? trustModal.d.oem_code : '信任折扣详情'"></div>
          <div class="sub">信任折扣 · TRUST DISCOUNT</div></div>
        <button class="x" @click="closeTrustModal()">✕</button>
      </div>
      <div class="modal-bd">
        <template x-if="trustModal.loading">
          <div class="loadbox"><span class="spin">◌</span><br>载入信任折扣明细…</div>
        </template>
        <template x-if="!trustModal.loading && trustModal.d">
          <div>
            <div class="sec">折扣信息</div>
            <div class="kv">
              <div><div class="k">OEM 代码</div><div class="v mono" x-text="dash(trustModal.d.oem_code)"></div></div>
              <div><div class="k">信任系数</div><div class="v" x-text="fmt(trustModal.d.coefficient)"></div></div>
              <div><div class="k">方向</div><div class="v" x-text="dash(trustModal.d.direction)"></div></div>
              <div style="grid-column: span 2"><div class="k">说明</div><div class="v" x-text="dash(trustModal.d.description)"></div></div>
            </div>
            <details class="raw"><summary>原始数据</summary>
              <pre class="json" x-text="JSON.stringify(trustModal.d, null, 2)"></pre></details>
          </div>
        </template>
      </div>
      <div class="modal-ft" x-show="trustModal.d">
        <div class="tagline" style="gap:8px">
          <button class="b-ghost right" @click="closeTrustModal()">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- 外部数据源 Tab -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div x-show="tab === 'external_source'">
    <div class="card mt12"><div class="bd" style="padding:0">
      <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
        <b>外部数据源</b>
        <span class="muted">外部数据接入配置</span>
        <div class="right tagline" style="gap:8px">
          <span class="muted" x-text="'共 ' + externalList.total + ' 条'"></span>
        </div>
      </div>
      <div class="scroll-x">
        <table class="tbl tight">
          <tr><th>数据源编码</th><th>数据源名称</th><th>类型</th><th>状态</th><th>更新时间</th></tr>
          <template x-if="!externalList.items.length">
            <tr><td colspan="5" class="empty">暂无外部数据源配置</td></tr>
          </template>
          <template x-for="d in externalList.items" :key="d.param_code">
            <tr class="data">
              <td class="mono" x-text="dash(d.param_code)"></td>
              <td x-text="dash(d.param_name)"></td>
              <td x-text="dash(d.dimension)"></td>
              <td><span class="st" :class="'st-' + hue(d.value)" x-text="dash(d.value)"></span></td>
              <td class="mono" x-text="fmtTime(d.updated_at)"></td>
            </tr>
          </template>
        </table>
      </div>
      <div class="tagline" style="padding:10px 16px">
        <span class="muted"></span>
        <div class="right tagline" style="gap:8px">
          <button class="b-ghost b-sm" :disabled="externalList.page <= 1" @click="externalList.load(externalList.page - 1)">‹ 上一页</button>
          <span class="muted mono" x-text="externalList.page + ' / ' + externalList.pages"></span>
          <button class="b-ghost b-sm" :disabled="externalList.page >= externalList.pages" @click="externalList.load(externalList.page + 1)">下一页 ›</button>
        </div>
      </div>
    </div></div>
  </div>
</div>
