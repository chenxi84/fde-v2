<div>
  <!-- 新建表单 -->
  <div class="collapse" :class="{open: form.show}">
    <div class="card mb0">
      <div class="hd">
        <h3>新建牛鞭处理单</h3>
        <span class="hint">系统自动计算放大系数与判定 · Tier1 容忍内简化确认，Tier2/3 超阈强制修正</span>
        <button class="b-ghost b-sm right" @click="form.show = false; resetForm()">收起</button>
      </div>
      <div class="bd">
        <div class="frow">
          <div><label class="f">零件号 <span class="req">*</span></label>
            <input x-model="form.part_no" placeholder="如 8220010"></div>
          <div><label class="f">期间 <span class="req">*</span></label>
            <input x-model="form.period" placeholder="YYYY-MM"></div>
          <div><label class="f">层级 <span class="req">*</span></label>
            <select x-model="form.tier">
              <option value="">— 选择层级 —</option>
              <option>Tier1直供</option><option>Tier2</option><option>Tier3</option>
            </select></div>
          <div><label class="f">终端来源</label>
            <select x-model="form.end_source">
              <option>结算</option><option>OEM消耗</option><option>外部映射</option><option>排产</option>
            </select></div>
          <div style="display:flex; align-items:flex-end">
            <button class="b-ghost b-sm" @click="form.more = !form.more"
              x-text="form.more ? '收起字段 ▴' : '更多字段 ▾'"></button></div>
        </div>
        <div class="collapse" :class="{open: form.more}">
          <div class="frow" style="padding-top:10px">
            <div><label class="f">派生需求量（下游订单）<span class="req">*</span></label>
              <input type="number" x-model="form.derived_qty" step="1" placeholder="如 1350"></div>
            <div><label class="f">终端需求量（消耗口径）<span class="req">*</span></label>
              <input type="number" x-model="form.end_qty" step="1" placeholder="如 1000"></div>
          </div>
        </div>
        <div class="muted mt8">放大系数 = 派生 / 终端 · 容忍阈值 θ_amp=1.10 · Tier2/3 超阈→强制修正分析（BR-03）</div>
        <div class="mt12 tagline">
          <button class="b-pri right" :disabled="form.busy" @click="saveForm()"
            x-text="form.busy ? '处理中…' : '创建处理单'"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 列表 -->
  <div class="card" :class="form.show ? 'mt12' : ''"><div class="bd" style="padding:0">
    <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
      <b>牛鞭处理单列表</b>
      <button class="b-pri b-sm" @click="resetForm(); form.show = !form.show">＋ 新建处理单</button>
      <div class="right tagline" style="gap:8px; flex-wrap:wrap">
        <div class="chips">
          <template x-for="s in ['', '待处理', '维持', '已修正', '已确认']" :key="s || '全部'">
            <span class="fchip" :class="{on: fStatus === s}"
              @click="fStatus = s; list.load(1)" x-text="s || '全部'"></span>
          </template>
        </div>
        <div class="chips">
          <template x-for="t in ['', 'Tier1直供', 'Tier2', 'Tier3']" :key="t || '全部层级'">
            <span class="fchip" :class="{on: fTier === t}"
              @click="fTier = t; list.load(1)" x-text="t || '全部层级'" style="font-size:11px"></span>
          </template>
        </div>
        <input x-model="fPartNo" @keydown.enter="search()" placeholder="零件号" style="width:120px">
        <button class="b-ghost b-sm" @click="search()">查询</button>
      </div>
    </div>
    <div class="scroll-x">
      <table class="tbl tight">
        <tr><th>处理单号</th><th>零件号</th><th>期间</th><th>层级</th><th class="num">派生量</th><th class="num">终端量</th><th class="num">放大系数</th><th>判定</th><th>状态</th><th class="right">操作</th></tr>
        <template x-if="!list.items.length">
          <tr><td colspan="10" class="empty"
            x-text="(fStatus || fTier || fPartNo) ? '无符合条件的处理单' : '暂无处理单 —— 点「新建处理单」创建'"></td></tr>
        </template>
        <template x-for="d in list.items" :key="d.bw_no">
          <tr class="data">
            <td><button class="b-link mono" @click="viewBw(d)" x-text="d.bw_no"></button></td>
            <td class="mono" x-text="dash(d.part_no)"></td>
            <td x-text="dash(d.period)"></td>
            <td x-text="dash(d.tier)"></td>
            <td class="num" x-text="fmt(d.derived_qty)"></td>
            <td class="num" x-text="fmt(d.end_qty)"></td>
            <td class="num mono" x-text="d.amp_factor != null ? d.amp_factor.toFixed(4) : '—'"></td>
            <td><span class="st" :class="'st-' + hue(d.amp_verdict)" x-text="dash(d.amp_verdict)"></span></td>
            <td><span class="st" :class="'st-' + hue(d.status)" x-text="statusLabel(d.status)"></span></td>
            <td class="right rowact" style="white-space:nowrap">
              <button class="b-pri b-sm" x-show="d.status === '维持'" @click="viewBw(d)">确认</button>
              <button class="b-pri b-sm" x-show="d.amp_verdict === '超阈·修正' && d.status === '待处理'" @click="viewBw(d)">修正</button>
              <button class="b-pri b-sm" x-show="d.status === '已修正'" @click="viewBw(d)">确认</button>
            </td>
          </tr>
        </template>
      </table>
    </div>
    <div class="tagline" style="padding:10px 16px">
      <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
      <div class="right tagline" style="gap:8px">
        <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
        <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
        <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
      </div>
    </div>
  </div></div>

  <!-- 详情模态 -->
  <div class="modal-mask" x-show="modal.open" @click.self="closeModal()"
       @keydown.escape.window="closeModal()" x-cloak>
    <div class="modal">
      <div class="modal-hd">
        <div>
          <div class="docno" x-text="modal.d ? modal.d.bw_no : '牛鞭处理单'"></div>
          <div class="sub">牛鞭修正处理 · BULLWHIP CORRECTION</div>
        </div>
        <template x-if="modal.d">
          <span class="st" :class="'st-' + hue(modal.d.status)" x-text="statusLabel(modal.d.status)"></span>
        </template>
        <button class="x" @click="closeModal()">✕</button>
      </div>
      <div class="modal-bd">
        <template x-if="modal.loading">
          <div class="loadbox"><span class="spin">◌</span><br>载入处理单明细…</div>
        </template>
        <template x-if="!modal.loading && modal.d">
          <div>
            <div class="sec">基本信息</div>
            <div class="kv">
              <div><div class="k">处理单号</div><div class="v mono" x-text="dash(modal.d.bw_no)"></div></div>
              <div><div class="k">零件号</div><div class="v mono" x-text="dash(modal.d.part_no)"></div></div>
              <div><div class="k">期间</div><div class="v" x-text="dash(modal.d.period)"></div></div>
              <div><div class="k">层级</div><div class="v" x-text="dash(modal.d.tier)"></div></div>
            </div>

            <div class="sec">需求与放大</div>
            <div class="kv">
              <div><div class="k">派生需求（下游订单）</div><div class="v" x-text="fmt(modal.d.derived_qty)"></div></div>
              <div><div class="k">终端需求（消耗口径）</div><div class="v" x-text="fmt(modal.d.end_qty)"></div></div>
              <div><div class="k">终端来源</div><div class="v" x-text="dash(modal.d.end_source)"></div></div>
              <div><div class="k">放大系数</div><div class="v mono" x-text="modal.d.amp_factor != null ? modal.d.amp_factor.toFixed(4) : '—'"></div></div>
              <div><div class="k">判定</div><div class="v"><span class="st" :class="'st-' + hue(modal.d.amp_verdict)" x-text="dash(modal.d.amp_verdict)"></span></div></div>
            </div>

            <div class="sec">修正与结果</div>
            <div class="kv">
              <div><div class="k">修正动作</div><div class="v" x-text="dash(modal.d.corr_action)"></div></div>
              <div><div class="k">最终量（终端口径）</div><div class="v" x-text="fmt(modal.d.final_qty)"></div></div>
              <div><div class="k">核对人</div><div class="v" x-text="dash(modal.d.checker)"></div></div>
              <div><div class="k">核对日期</div><div class="v mono" x-text="fmtTime(modal.d.chk_date)"></div></div>
            </div>

            <!-- 修正表单 -->
            <template x-if="correction.show && modal.d.amp_verdict === '超阈·修正' && modal.d.status === '待处理'">
              <div>
                <div class="sec">执行修正（BR-04：禁止无机制纯减数）</div>
                <div class="frow">
                  <div><label class="f">修正机制 <span class="req">*</span></label>
                    <select x-model="correction.corr_action">
                      <option value="">— 选择机制 —</option>
                      <option>切换终端需求口径</option><option>信息共享上传</option>
                      <option>减小批量/平准化</option><option>安全库存协同</option><option>缩短提前期</option>
                    </select></div>
                  <div><label class="f">修正后预测 <span class="req">*</span></label>
                    <input type="number" x-model="correction.final_qty" step="1"></div>
                  <div style="display:flex; align-items:flex-end">
                    <button class="b-pri b-sm" :disabled="correction.busy" @click="submitCorrection()"
                      x-text="correction.busy ? '提交中…' : '提交修正'"></button></div>
                </div>
                <div class="muted mt8">修正须登记所落机制与依据，禁止无机制纯减数（BR-04）· 修正不改合理修订（BR-05）</div>
              </div>
            </template>

            <details class="raw"><summary>原始数据</summary>
              <pre class="json" x-text="JSON.stringify(modal.d, null, 2)"></pre></details>
          </div>
        </template>
      </div>
      <div class="modal-ft" x-show="modal.d">
        <template x-if="modal.d">
          <div class="tagline" style="gap:8px">
            <button class="b-pri" x-show="modal.d.status === '维持'" @click="maintainBw()">确认维持</button>
            <template x-if="modal.d.amp_verdict === '超阈·修正' && modal.d.status === '待处理'">
              <button class="b-pri" @click="correction.show ? (correction.show = false) : openCorrection()"
                x-text="correction.show ? '收起修正' : '牛鞭修正'"></button>
            </template>
            <button class="b-pri" x-show="modal.d.status === '已修正'" @click="confirmBw()">确认（转入发布）</button>
            <span class="muted" x-show="modal.d.status === '已确认'">已确认 · 不可操作</span>
            <button class="b-ghost right" @click="closeModal()">关闭</button>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
