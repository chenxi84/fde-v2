<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
    <b>需求加工台账</b>
    <span class="muted">基线生成 · 销售修正 · 核对 · 加工链总账</span>
    <div class="right tagline" style="gap:8px; flex-wrap:wrap">
      <div class="chips">
        <template x-for="s in ['', '进行中', '全部核定', '已锁定']" :key="s || '全部'">
          <span class="fchip" :class="{on: fStatus === s}"
            @click="fStatus = s; list.load(1)" x-text="s || '全部'"></span>
        </template>
      </div>
      <button class="b-pri b-sm" @click="list.load(1)">刷新</button>
    </div>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr>
        <th>加工批次</th><th>OEM编码</th><th>预测版本</th><th>状态</th><th>开始时间</th><th class="right">操作</th>
      </tr>
      <template x-if="!list.items.length"><tr><td colspan="6" class="empty">无匹配数据</td></tr></template>
      <template x-for="d in list.items" :key="d.proc_batch">
        <tr class="data">
          <td><button class="b-link mono" @click="viewX(d)" x-text="d.proc_batch"></button></td>
          <td x-text="dash(d.oem_code)"></td>
          <td class="mono" x-text="dash(d.fcst_version)"></td>
          <td><span class="st" :class="'st-' + hue(d.status)" x-text="statusLabel(d.status)"></span></td>
          <td class="mono" x-text="dash(d.start_time)"></td>
          <td class="right rowact">
            <button class="b-pri b-sm" x-show="d.status === '进行中'" @click="genBaseline(d)">生成基线</button>
            <button class="b-pri b-sm" x-show="d.status === '进行中'" @click="openAdj(d)">销售修正</button>
            <button class="b-pri b-sm" x-show="d.status === '进行中'" @click="openChk(d)">核对</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:10px 16px">
    <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
    <div class="right tagline" style="gap:8px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
      <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
      <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
    </div>
  </div>
</div></div>

<!-- 详情模态 -->
<div class="modal-mask" x-show="modalX.open" @click.self="closeX()"
     @keydown.escape.window="closeX()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div class="docno" x-text="modalX.d ? modalX.d.header.proc_batch : '加工批次详情'"></div>
        <div class="sub">需求加工详情 · DEMAND PROCESSING</div>
      </div>
      <template x-if="modalX.d">
        <span class="st" :class="'st-' + hue(modalX.d.header.status)" x-text="statusLabel(modalX.d.header.status)"></span>
      </template>
      <button class="x" @click="closeX()">✕</button>
    </div>
    <div class="modal-bd">
      <template x-if="modalX.loading">
        <div class="loadbox"><span class="spin">◌</span><br>载入批次明细…</div>
      </template>
      <template x-if="!modalX.loading && modalX.d">
        <div>
          <div class="sec">批次头信息</div>
          <div class="kv">
            <div><div class="k">加工批次</div><div class="v mono" x-text="dash(modalX.d.header.proc_batch)"></div></div>
            <div><div class="k">状态</div><div class="v"><span class="st" :class="'st-' + hue(modalX.d.header.status)" x-text="statusLabel(modalX.d.header.status)"></span></div></div>
            <div><div class="k">OEM编码</div><div class="v mono" x-text="dash(modalX.d.header.oem_code)"></div></div>
            <div><div class="k">工厂编码</div><div class="v mono" x-text="dash(modalX.d.header.plant_code)"></div></div>
            <div><div class="k">预测版本</div><div class="v mono" x-text="dash(modalX.d.header.fcst_version)"></div></div>
            <div><div class="k">开始时间</div><div class="v mono" x-text="dash(modalX.d.header.start_time)"></div></div>
            <div><div class="k">完成时间</div><div class="v mono" x-text="dash(modalX.d.header.finish_time)"></div></div>
          </div>

          <div class="sec">基线明细（<span x-text="modalX.d.baselines ? modalX.d.baselines.length : 0"></span> 行）</div>
          <div class="scroll-x">
            <table class="tbl tight">
              <tr><th>零件号</th><th>车型</th><th>期间</th><th>基线量</th><th>路径</th><th>方法</th><th>来源引用</th><th>因果量</th><th>偏差</th><th>生成人</th></tr>
              <template x-if="!modalX.d.baselines || !modalX.d.baselines.length">
                <tr><td colspan="10" class="empty">暂无基线数据</td></tr>
              </template>
              <template x-for="b in modalX.d.baselines" :key="b.part_no + '-' + b.veh_model + '-' + b.period">
                <tr>
                  <td class="mono" x-text="dash(b.part_no)"></td>
                  <td x-text="dash(b.veh_model)"></td>
                  <td class="mono" x-text="dash(b.period)"></td>
                  <td class="mono" x-text="fmt(b.base_qty)"></td>
                  <td><span class="st" :class="'st-' + hue(b.base_path)" x-text="dash(b.base_path)"></span></td>
                  <td x-text="dash(b.base_method)"></td>
                  <td class="mono" x-text="dash(b.source_ref)"></td>
                  <td class="mono" x-text="fmt(b.causal_qty)"></td>
                  <td class="mono" x-text="dash(b.deviation)"></td>
                  <td x-text="dash(b.generator)"></td>
                </tr>
              </template>
            </table>
          </div>

          <div class="sec">修正明细（<span x-text="modalX.d.adjustments ? modalX.d.adjustments.length : 0"></span> 行）</div>
          <div class="scroll-x">
            <table class="tbl tight">
              <tr><th>零件号</th><th>车型</th><th>期间</th><th>基线量</th><th>修正量</th><th>修正差额</th><th>修正率</th><th>原因类别</th><th>提交状态</th></tr>
              <template x-if="!modalX.d.adjustments || !modalX.d.adjustments.length">
                <tr><td colspan="9" class="empty">暂无修正数据</td></tr>
              </template>
              <template x-for="a in modalX.d.adjustments" :key="a.part_no + '-' + a.veh_model + '-' + a.period">
                <tr>
                  <td class="mono" x-text="dash(a.part_no)"></td>
                  <td x-text="dash(a.veh_model)"></td>
                  <td class="mono" x-text="dash(a.period)"></td>
                  <td class="mono" x-text="fmt(a.base_qty)"></td>
                  <td class="mono" x-text="fmt(a.adj_qty)"></td>
                  <td class="mono" x-text="fmt(a.adj_delta)"></td>
                  <td class="mono" x-text="dash(a.adj_pct)"></td>
                  <td x-text="dash(a.adj_reason_cat)"></td>
                  <td><span class="st" :class="'st-' + hue(a.submit_status)" x-text="dash(a.submit_status)"></span></td>
                </tr>
              </template>
            </table>
          </div>

          <div class="sec">核对记录（<span x-text="modalX.d.checks ? modalX.d.checks.length : 0"></span> 行）</div>
          <div class="scroll-x">
            <table class="tbl tight">
              <tr><th>零件号</th><th>车型</th><th>期间</th><th>轮次</th><th>结论</th><th>理由</th><th>核定后量</th><th>核对人</th><th>时间</th></tr>
              <template x-if="!modalX.d.checks || !modalX.d.checks.length">
                <tr><td colspan="9" class="empty">暂无核对记录</td></tr>
              </template>
              <template x-for="c in modalX.d.checks" :key="c.part_no + '-' + c.veh_model + '-' + c.period + '-' + c.chk_round">
                <tr>
                  <td class="mono" x-text="dash(c.part_no)"></td>
                  <td x-text="dash(c.veh_model)"></td>
                  <td class="mono" x-text="dash(c.period)"></td>
                  <td class="mono" x-text="c.chk_round"></td>
                  <td><span class="st" :class="'st-' + hue(c.chk_result)" x-text="dash(c.chk_result)"></span></td>
                  <td x-text="dash(c.chk_reason)"></td>
                  <td class="mono" x-text="fmt(c.approved_qty)"></td>
                  <td x-text="dash(c.checker)"></td>
                  <td class="mono" x-text="dash(c.chk_time)"></td>
                </tr>
              </template>
            </table>
          </div>

          <details class="raw"><summary>原始数据</summary>
            <pre class="json" x-text="JSON.stringify(modalX.d, null, 2)"></pre>
          </details>
        </div>
      </template>
    </div>
    <div class="modal-ft" x-show="modalX.d">
      <template x-if="modalX.d">
        <div class="tagline" style="gap:8px">
          <span class="muted" x-show="modalX.d.header.status !== '进行中'" x-text="'当前状态：' + statusLabel(modalX.d.header.status)"></span>
          <button class="b-pri" x-show="modalX.d.header.status === '进行中'" @click="genBaseline(modalX.d)">生成基线</button>
          <button class="b-pri" x-show="modalX.d.header.status === '进行中'" @click="openAdj(modalX.d)">销售修正</button>
          <button class="b-pri" x-show="modalX.d.header.status === '进行中'" @click="openChk(modalX.d)">核对</button>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- 销售修正弹窗 -->
<div class="modal-mask" x-show="adjForm.open" @click.self="closeAdj()"
     @keydown.escape.window="closeAdj()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div class="docno" x-text="'销售修正 · ' + adjForm.proc_batch"></div>
        <div class="sub">三件套强制 · 超20%须举证 · SUBMIT ADJUSTMENT</div>
      </div>
      <button class="x" @click="closeAdj()">✕</button>
    </div>
    <div class="modal-bd">
      <div class="frow">
        <div><label class="f">零件号 <span class="req">*</span></label>
          <input x-model="adjForm.part_no" placeholder="如 PART-001"></div>
        <div><label class="f">车型 <span class="req">*</span></label>
          <input x-model="adjForm.veh_model" placeholder="如 SUV-X3"></div>
      </div>
      <div class="frow">
        <div><label class="f">期间 <span class="req">*</span></label>
          <input x-model="adjForm.period" placeholder="如 2026-08"></div>
        <div><label class="f">修正量 <span class="req">*</span></label>
          <input type="number" step="0.01" x-model="adjForm.adj_qty" placeholder="修正后数值"></div>
      </div>
      <div class="frow">
        <div style="grid-column: span 2"><label class="f">原因类别 <span class="req">*</span></label>
          <select x-model="adjForm.adj_reason_cat">
            <option value="">请选择原因类别</option>
            <option value="客户信息变更">客户信息变更</option>
            <option value="市场趋势变化">市场趋势变化</option>
            <option value="产能调整">产能调整</option>
            <option value="ECN影响">ECN影响</option>
            <option value="其他">其他</option>
          </select></div>
      </div>
      <div style="margin-top:12px">
        <label class="f">数据依据 <span class="muted" style="font-weight:400; font-size:11px">可选 · 超20%时必填</span></label>
        <textarea x-model="adjForm.adj_evidence" rows="3" placeholder="如客户函件 / 邮件记录 / 数据截图（修正幅度超20%时强制）"></textarea>
      </div>
    </div>
    <div class="modal-ft">
      <div class="right tagline" style="gap:8px">
        <button class="b-ghost" @click="closeAdj()">取消</button>
        <button class="b-pri" :disabled="adjForm.busy" @click="submitAdj()"
          x-text="adjForm.busy ? '提交中…' : '提交修正'"></button>
      </div>
    </div>
  </div>
</div>

<!-- 核对弹窗 -->
<div class="modal-mask" x-show="chkForm.open" @click.self="closeChk()"
     @keydown.escape.window="closeChk()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div class="docno" x-text="'核对 · ' + chkForm.proc_batch"></div>
        <div class="sub">通过/退回 · 退回须附书面理由 · CHECK LINE</div>
      </div>
      <button class="x" @click="closeChk()">✕</button>
    </div>
    <div class="modal-bd">
      <div class="frow">
        <div><label class="f">零件号 <span class="req">*</span></label>
          <input x-model="chkForm.part_no" placeholder="如 PART-001"></div>
        <div><label class="f">车型 <span class="req">*</span></label>
          <input x-model="chkForm.veh_model" placeholder="如 SUV-X3"></div>
        <div><label class="f">期间 <span class="req">*</span></label>
          <input x-model="chkForm.period" placeholder="如 2026-08"></div>
      </div>
      <div class="frow">
        <div><label class="f">核对结论 <span class="req">*</span></label>
          <select x-model="chkForm.chk_result">
            <option value="通过">通过</option>
            <option value="退回">退回</option>
          </select></div>
        <div><label class="f">核定调整量 <span class="muted" style="font-weight:400; font-size:11px">可选</span></label>
          <input type="number" step="0.01" x-model="chkForm.chk_adj_qty" placeholder="通过时可填写"></div>
      </div>
      <div style="margin-top:12px">
        <label class="f">核对理由 <span x-show="chkForm.chk_result === '退回'" class="req">*</span></label>
        <textarea x-model="chkForm.chk_reason" rows="3" placeholder="退回时必填：哪个视角不通过 + 需要什么证据"></textarea>
      </div>
    </div>
    <div class="modal-ft">
      <div class="right tagline" style="gap:8px">
        <button class="b-ghost" @click="closeChk()">取消</button>
        <button class="b-pri" :disabled="chkForm.busy" @click="submitChk()"
          x-text="chkForm.busy ? '处理中…' : '提交核对'"></button>
      </div>
    </div>
  </div>
</div>
