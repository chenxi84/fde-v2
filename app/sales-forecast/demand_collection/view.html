<div>
  <!-- 新建表单 -->
  <div class="collapse" :class="{open: form.show}">
    <div class="card mb0">
      <div class="hd">
        <h3>新建收集单</h3>
        <span class="hint">客户 + 工厂 + 版本唯一 · 创建后可录入明细与信号拆解</span>
        <button class="b-ghost b-sm right" @click="form.show = false; resetForm()">收起</button>
      </div>
      <div class="bd">
        <div class="frow">
          <div><label class="f">客户编码 <span class="req">*</span></label>
            <input x-model="form.oem_code" placeholder="如 OEM-A"></div>
          <div><label class="f">工厂编码 <span class="req">*</span></label>
            <input x-model="form.plant_code" placeholder="如 PLANT-A1"></div>
          <div><label class="f">预测版本 <span class="req">*</span></label>
            <input x-model="form.fcst_version" placeholder="如 V2026-08"></div>
          <div><label class="f">基准期间 <span class="req">*</span></label>
            <input x-model="form.base_period" placeholder="YYYY-MM"></div>
          <div style="display:flex; align-items:flex-end">
            <button class="b-ghost b-sm" @click="form.more = !form.more"
              x-text="form.more ? '收起字段 ▴' : '更多字段 ▾'"></button></div>
        </div>
        <div class="collapse" :class="{open: form.more}">
          <div class="frow" style="padding-top:10px">
            <div><label class="f">需求口径</label>
              <select x-model="form.demand_type">
                <option>月度滚动预测</option><option>年度需求</option>
              </select></div>
            <div><label class="f">来源渠道</label>
              <select x-model="form.source_channel">
                <option value="">请选择</option>
                <option>EDL/EDI</option><option>OEM门户</option><option>邮件Excel</option><option>销售转录</option>
              </select></div>
            <div><label class="f">接收日期</label>
              <input type="date" x-model="form.recv_date"></div>
            <div><label class="f">备注</label>
              <input x-model="form.remark" placeholder="OEM修订说明等"></div>
          </div>
        </div>
        <div class="muted mt8">BR-06：客户 + 工厂 + 版本组合唯一 · 创建后状态为"草稿"，可录入明细</div>
        <div class="mt12 tagline">
          <button class="b-pri right" :disabled="form.busy" @click="saveForm()"
            x-text="form.busy ? '创建中…' : '创建收集单'"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 列表 -->
  <div class="card" :class="form.show ? 'mt12' : ''"><div class="bd" style="padding:0">
    <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
      <b>需求收集台账</b>
      <button class="b-pri b-sm" @click="resetForm(); form.show = !form.show">＋ 新建收集单</button>
      <div class="right tagline" style="gap:8px; flex-wrap:wrap">
      <div class="chips">
        <template x-for="s in ['', '草稿', '已拆解', '已锁定', '已替代']" :key="s || '全部'">
          <span class="fchip" :class="{on: fStatus === s}"
            @click="fStatus = s; list.load(1)" x-text="s || '全部'"></span>
        </template>
      </div>
      <input x-model="keyword" @keydown.enter="search()" placeholder="收集单号 / OEM / 版本" style="width:200px">
      <button class="b-ghost b-sm" @click="search()">搜索</button>
    </div>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr>
        <th>收集单号</th><th>OEM编码</th><th>预测版本</th><th>基准期间</th><th>状态</th><th>收集人</th><th>接收日期</th><th class="right">操作</th>
      </tr>
      <template x-if="!list.items.length"><tr><td colspan="8" class="empty">无匹配数据</td></tr></template>
      <template x-for="d in list.items" :key="d.collect_no">
        <tr class="data">
          <td><button class="b-link mono" @click="viewX(d)" x-text="d.collect_no"></button></td>
          <td x-text="dash(d.oem_code)"></td>
          <td class="mono" x-text="dash(d.fcst_version)"></td>
          <td x-text="dash(d.base_period)"></td>
          <td><span class="st" :class="'st-' + hue(d.status)" x-text="statusLabel(d.status)"></span></td>
          <td x-text="dash(d.collector)"></td>
          <td class="mono" x-text="dash(d.recv_date)"></td>
          <td class="right rowact">
            <button class="b-pri b-sm" x-show="d.status === '草稿'" @click="confirmDecomp(d)">确认拆解</button>
            <button class="b-dng b-sm" x-show="d.status === '草稿'" @click="openCancel(d)">作废</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:10px 16px">
    <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
    <div class="right tagline" style="gap:8px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
      <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
      <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
    </div>
  </div>
</div></div>

<!-- 详情模态 -->
<div class="modal-mask" x-show="modalX.open" @click.self="closeX()"
     @keydown.escape.window="closeX()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div class="docno" x-text="modalX.d ? modalX.d.header.collect_no : '收集单详情'"></div>
        <div class="sub">需求收集详情 · DEMAND COLLECTION</div>
      </div>
      <template x-if="modalX.d">
        <span class="st" :class="'st-' + hue(modalX.d.header.status)" x-text="statusLabel(modalX.d.header.status)"></span>
      </template>
      <button class="x" @click="closeX()">✕</button>
    </div>
    <div class="modal-bd">
      <template x-if="modalX.loading">
        <div class="loadbox"><span class="spin">◌</span><br>载入收集单明细…</div>
      </template>
      <template x-if="!modalX.loading && modalX.d">
        <div>
          <div class="sec">单头信息</div>
          <div class="kv">
            <div><div class="k">收集单号</div><div class="v mono" x-text="dash(modalX.d.header.collect_no)"></div></div>
            <div><div class="k">状态</div><div class="v"><span class="st" :class="'st-' + hue(modalX.d.header.status)" x-text="statusLabel(modalX.d.header.status)"></span></div></div>
            <div><div class="k">OEM编码</div><div class="v mono" x-text="dash(modalX.d.header.oem_code)"></div></div>
            <div><div class="k">工厂编码</div><div class="v mono" x-text="dash(modalX.d.header.plant_code)"></div></div>
            <div><div class="k">预测版本</div><div class="v mono" x-text="dash(modalX.d.header.fcst_version)"></div></div>
            <div><div class="k">基准期间</div><div class="v mono" x-text="dash(modalX.d.header.base_period)"></div></div>
            <div><div class="k">需求类型</div><div class="v" x-text="dash(modalX.d.header.demand_type)"></div></div>
            <div><div class="k">来源渠道</div><div class="v" x-text="dash(modalX.d.header.source_channel)"></div></div>
            <div><div class="k">收集人</div><div class="v" x-text="dash(modalX.d.header.collector)"></div></div>
            <div><div class="k">接收日期</div><div class="v mono" x-text="dash(modalX.d.header.recv_date)"></div></div>
            <div style="grid-column: span 2"><div class="k">备注</div><div class="v" x-text="dash(modalX.d.header.remark)"></div></div>
          </div>

          <div class="sec">明细列表（<span x-text="modalX.d.details ? modalX.d.details.length : 0"></span> 行）</div>
          <div class="scroll-x">
            <table class="tbl tight">
              <tr><th>行号</th><th>零件号</th><th>项目号</th><th>车型</th><th>项目阶段</th><th>期间</th><th>原始量</th><th>单位</th><th>数据标记</th></tr>
              <template x-if="!modalX.d.details || !modalX.d.details.length">
                <tr><td colspan="9" class="empty">暂无明细</td></tr>
              </template>
              <template x-for="d in modalX.d.details" :key="d.line_no">
                <tr>
                  <td class="mono" x-text="d.line_no"></td>
                  <td class="mono" x-text="dash(d.part_no)"></td>
                  <td class="mono" x-text="dash(d.project_no)"></td>
                  <td x-text="dash(d.veh_model)"></td>
                  <td><span class="st" :class="'st-' + hue(d.proj_stage)" x-text="dash(d.proj_stage)"></span></td>
                  <td class="mono" x-text="dash(d.period)"></td>
                  <td class="mono" x-text="fmt(d.orig_qty)"></td>
                  <td x-text="dash(d.uom)"></td>
                  <td x-text="dash(d.data_flag)"></td>
                </tr>
              </template>
            </table>
          </div>

          <div class="sec">拆解快照（<span x-text="modalX.d.snapshots ? modalX.d.snapshots.length : 0"></span> 行）</div>
          <div class="scroll-x">
            <table class="tbl tight">
              <tr><th>行号</th><th>期间</th><th>噪声调整</th><th>脉冲量</th><th>真实量</th><th>含脉冲</th><th>事件编号</th><th>方法</th><th>依据</th><th>拆解人</th></tr>
              <template x-if="!modalX.d.snapshots || !modalX.d.snapshots.length">
                <tr><td colspan="10" class="empty">暂无拆解快照</td></tr>
              </template>
              <template x-for="s in modalX.d.snapshots" :key="s.line_no + '-' + s.period">
                <tr>
                  <td class="mono" x-text="s.line_no"></td>
                  <td class="mono" x-text="dash(s.period)"></td>
                  <td class="mono" x-text="fmt(s.noise_adj)"></td>
                  <td class="mono" x-text="fmt(s.pulse_qty)"></td>
                  <td class="mono" x-text="fmt(s.true_qty)"></td>
                  <td x-text="s.has_pulse ? '是' : '否'"></td>
                  <td class="mono" x-text="dash(s.event_no)"></td>
                  <td x-text="dash(s.method)"></td>
                  <td x-text="dash(s.basis)"></td>
                  <td x-text="dash(s.decomposer)"></td>
                </tr>
              </template>
            </table>
          </div>

          <details class="raw"><summary>原始数据</summary>
            <pre class="json" x-text="JSON.stringify(modalX.d, null, 2)"></pre>
          </details>
        </div>
      </template>
    </div>
    <div class="modal-ft" x-show="modalX.d">
      <template x-if="modalX.d">
        <div class="tagline" style="gap:8px">
          <span class="muted" x-show="modalX.d.header.status !== '草稿'" x-text="'当前状态：' + statusLabel(modalX.d.header.status)"></span>
          <button class="b-pri" x-show="modalX.d.header.status === '草稿'" @click="confirmDecomp(modalX.d)">确认拆解</button>
          <button class="b-dng" x-show="modalX.d.header.status === '草稿'" @click="openCancel(modalX.d)">作废</button>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- 作废弹窗 -->
<div class="modal-mask" x-show="cancelForm.open" @click.self="closeCancel()"
     @keydown.escape.window="closeCancel()" x-cloak>
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div class="docno" x-text="'作废收集单 · ' + cancelForm.collect_no"></div>
        <div class="sub">仅草稿状态可作废 · CANCEL COLLECTION</div>
      </div>
      <button class="x" @click="closeCancel()">✕</button>
    </div>
    <div class="modal-bd">
      <label class="f">作废原因 <span class="req">*</span></label>
      <textarea x-model="cancelForm.reason" rows="4" placeholder="请填写作废原因（必填）"></textarea>
    </div>
    <div class="modal-ft">
      <div class="right tagline" style="gap:8px">
        <button class="b-ghost" @click="closeCancel()">取消</button>
        <button class="b-dng" :disabled="cancelForm.busy" @click="submitCancel()"
          x-text="cancelForm.busy ? '处理中…' : '确认作废'"></button>
      </div>
    </div>
  </div>
</div>
</div>
