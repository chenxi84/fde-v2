<div>
  <!-- 批量计算 -->
  <div class="collapse" :class="{open: calcForm.show}">
    <div class="card mb0">
      <div class="hd">
        <h3>批量计算考核指标</h3>
        <span class="hint">从 D09/D04 取快照，批量计算转单率与偏差量</span>
        <button class="b-ghost b-sm right" @click="calcForm.show = false">收起</button>
      </div>
      <div class="bd">
        <div class="frow">
          <div><label class="f">考核期间 <span class="req">*</span></label>
            <input x-model="calcForm.calcPeriod" placeholder="YYYY-MM"></div>
          <div style="display:flex; align-items:flex-end">
            <button class="b-pri b-sm" :disabled="calcForm.busy" @click="submitCalc()"
              x-text="calcForm.busy ? '计算中…' : '执行批量计算'"></button></div>
        </div>
        <div class="muted mt8">考核引用发布快照（R版）+ 实际结算快照（BR-01）· 消耗口径评预测能力 · 发运口径评报数质量</div>
      </div>
    </div>
  </div>

  <!-- 列表 -->
  <div class="card" :class="calcForm.show ? 'mt12' : ''"><div class="bd" style="padding:0">
    <div class="tagline" style="padding:12px 16px; flex-wrap:wrap">
      <b>预测考核记录</b>
      <button class="b-ghost b-sm" @click="calcForm.show = !calcForm.show">批量计算</button>
      <div class="right tagline" style="gap:8px; flex-wrap:wrap">
        <div class="chips">
          <template x-for="s in ['', '计入考核', '免责剔除', '归因流程·策略']" :key="s || '全部'">
            <span class="fchip" :class="{on: fResult === s}"
              @click="fResult = s; list.load(1)" x-text="s || '全部'"></span>
          </template>
        </div>
        <input x-model="fPartNo" @keydown.enter="search()" placeholder="零件号" style="width:120px">
        <input x-model="fPeriod" @keydown.enter="search()" placeholder="考核期" style="width:100px">
        <button class="b-ghost b-sm" @click="search()">查询</button>
      </div>
    </div>
    <div class="scroll-x">
      <table class="tbl tight">
        <tr><th>考核单号</th><th>零件号</th><th>车型</th><th>期间</th><th class="num">预测值</th><th class="num">实际转单</th><th class="num">转单率</th><th class="num">偏差量</th><th>归因</th><th>结论</th><th class="right">操作</th></tr>
        <template x-if="!list.items.length">
          <tr><td colspan="11" class="empty"
            x-text="(fResult || fPartNo || fPeriod) ? '无符合条件的考核记录' : '暂无考核记录 —— 请先执行批量计算'"></td></tr>
        </template>
        <template x-for="d in list.items" :key="d.fa_no + '_' + d.part_no + '_' + d.period">
          <tr class="data">
            <td><button class="b-link mono" @click="viewFa(d)" x-text="d.fa_no"></button></td>
            <td class="mono" x-text="dash(d.part_no)"></td>
            <td x-text="dash(d.veh_model)"></td>
            <td x-text="dash(d.period)"></td>
            <td class="num" x-text="fmt(d.fcst_qty)"></td>
            <td class="num" x-text="fmt(d.actual_qty)"></td>
            <td class="num mono" x-text="d.conv_rate != null ? (d.conv_rate * 100).toFixed(1) + '%' : '—'"></td>
            <td class="num" x-text="fmt(d.dev_qty)"></td>
            <td class="muted" x-text="dash(d.attribution)"></td>
            <td><span class="st" :class="'st-' + hue(d.result)" x-text="resultLabel(d.result)"></span></td>
            <td class="right rowact" style="white-space:nowrap">
              <button class="b-pri b-sm" x-show="!d.result" @click="viewFa(d)">归因</button>
              <button class="b-ghost b-sm" x-show="d.result" @click="viewFa(d)">查看</button>
            </td>
          </tr>
        </template>
      </table>
    </div>
    <div class="tagline" style="padding:10px 16px">
      <span class="muted" x-text="'共 ' + list.total + ' 条'"></span>
      <div class="right tagline" style="gap:8px">
        <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">‹ 上一页</button>
        <span class="muted mono" x-text="list.page + ' / ' + list.pages"></span>
        <button class="b-ghost b-sm" :disabled="list.page >= list.pages" @click="list.load(list.page + 1)">下一页 ›</button>
      </div>
    </div>
  </div></div>

  <!-- 详情模态 -->
  <div class="modal-mask" x-show="modal.open" @click.self="closeModal()"
       @keydown.escape.window="closeModal()" x-cloak>
    <div class="modal">
      <div class="modal-hd">
        <div>
          <div class="docno" x-text="modal.d ? modal.d.fa_no : '考核单'"></div>
          <div class="sub">预测转单率考核 · FORECAST ASSESSMENT</div>
        </div>
        <template x-if="modal.d">
          <span class="st" :class="'st-' + hue(modal.d.result)" x-text="resultLabel(modal.d.result)"></span>
        </template>
        <button class="x" @click="closeModal()">✕</button>
      </div>
      <div class="modal-bd">
        <template x-if="modal.loading">
          <div class="loadbox"><span class="spin">◌</span><br>载入考核记录…</div>
        </template>
        <template x-if="!modal.loading && modal.d">
          <div>
            <div class="sec">基本信息</div>
            <div class="kv">
              <div><div class="k">考核单号</div><div class="v mono" x-text="dash(modal.d.fa_no)"></div></div>
              <div><div class="k">零件号</div><div class="v mono" x-text="dash(modal.d.part_no)"></div></div>
              <div><div class="k">适用车型</div><div class="v" x-text="dash(modal.d.veh_model)"></div></div>
              <div><div class="k">期间</div><div class="v" x-text="dash(modal.d.period)"></div></div>
              <div><div class="k">考核期</div><div class="v" x-text="dash(modal.d.cycle)"></div></div>
            </div>

            <div class="sec">发运口径（转单量 · 评报数质量）</div>
            <div class="kv">
              <div><div class="k">预测值（发布口径）</div><div class="v" x-text="fmt(modal.d.fcst_qty)"></div></div>
              <div><div class="k">实际转单（发运口径）</div><div class="v" x-text="fmt(modal.d.actual_qty)"></div></div>
              <div><div class="k">转单率</div><div class="v" x-text="modal.d.conv_rate != null ? (modal.d.conv_rate * 100).toFixed(1) + '%' : '—'"
                :class="modal.d.conv_rate != null && modal.d.conv_rate < 0.7 ? 'text-red' : ''"></div></div>
              <div><div class="k">偏差量</div><div class="v" x-text="fmt(modal.d.dev_qty)"></div></div>
            </div>

            <div class="sec">消耗口径（结算量 · 评预测能力）</div>
            <div class="kv">
              <div><div class="k">结算实际</div><div class="v" x-text="fmt(modal.d.settle_qty)"></div></div>
              <div><div class="k">基线快照</div><div class="v" x-text="fmt(modal.d.base_qty)"></div></div>
              <div><div class="k">修正快照</div><div class="v" x-text="fmt(modal.d.adj_qty)"></div></div>
            </div>

            <div class="sec">归因认定</div>
            <div class="kv">
              <div><div class="k">归因</div><div class="v" x-text="dash(modal.d.attribution)"></div></div>
              <div><div class="k">考核结论</div><div class="v"><span class="st" :class="'st-' + hue(modal.d.result)" x-text="resultLabel(modal.d.result)"></span></div></div>
              <div><div class="k">考核人</div><div class="v" x-text="dash(modal.d.assessor)"></div></div>
            </div>

            <!-- FVA 视图 -->
            <div class="sec">FVA 视图（基线误差 vs 核定误差）</div>
            <div class="mt8">
              <button class="b-ghost b-sm" @click="loadFva()" :disabled="fvaLoading"
                x-text="fvaLoading ? '加载中…' : '加载 FVA 视图'"></button>
            </div>
            <div class="scroll-x" x-show="fvaData.length">
              <table class="tbl tight">
                <tr><th>期间</th><th class="num">结算量</th><th class="num">基线值</th><th class="num">基线误差</th><th class="num">修正值</th><th class="num">核定误差</th><th class="num">FVA</th></tr>
                <template x-for="v in fvaData" :key="v.period">
                  <tr>
                    <td x-text="dash(v.period)"></td>
                    <td class="num" x-text="fmt(v.settle_qty)"></td>
                    <td class="num" x-text="fmt(v.base_qty)"></td>
                    <td class="num" x-text="fmt(v.base_error)"></td>
                    <td class="num" x-text="fmt(v.adj_qty)"></td>
                    <td class="num" x-text="fmt(v.adj_error)"></td>
                    <td class="num" x-text="fmt(v.fva)"
                      :class="{'text-green': v.fva > 0, 'text-red': v.fva < 0}"></td>
                  </tr>
                </template>
              </table>
            </div>
            <div class="muted mt4" x-show="fvaData.length">
              FVA = 基线误差 - 核定误差（正值=修正改善准确率，负值=修正拉低准确率）</div>

            <!-- 归因表单 -->
            <template x-if="attrForm.show && !modal.d.result">
              <div>
                <div class="sec">归因认定</div>
                <div class="frow">
                  <div><label class="f">归因类别 <span class="req">*</span></label>
                    <select x-model="attrForm.attribution">
                      <option value="">— 选择归因 —</option>
                      <option>销售多报（加码无证据支撑）</option><option>OEM需求塌方（车型减产/召回）</option>
                      <option>事件影响（断点/脉冲漏登）</option><option>基线方法失准</option><option>正常波动（容忍区间内）</option>
                    </select></div>
                  <div><label class="f">考核结论 <span class="req">*</span></label>
                    <select x-model="attrForm.result">
                      <option>计入考核</option><option>免责剔除</option><option>归因流程·策略</option>
                    </select></div>
                  <div style="grid-column: span 2" x-show="attrForm.result === '免责剔除'">
                    <label class="f">举证材料 <span class="req">*</span></label>
                    <input x-model="attrForm.evidence" placeholder="外部减产信息/销量骤降/结算趋势/客户函件">
                  </div>
                  <div style="display:flex; align-items:flex-end">
                    <button class="b-pri b-sm" :disabled="attrForm.busy" @click="submitAttr()"
                      x-text="attrForm.busy ? '提交中…' : '提交归因'"></button></div>
                </div>
                <div class="muted mt8">可控性区分：销售多报计入考核，OEM塌方免责剔除（BR-02）· 免责须附举证（BR-03）· 容忍区间 ±10%（BR-04）</div>
              </div>
            </template>

            <details class="raw"><summary>原始数据</summary>
              <pre class="json" x-text="JSON.stringify(modal.d, null, 2)"></pre></details>
          </div>
        </template>
      </div>
      <div class="modal-ft" x-show="modal.d">
        <template x-if="modal.d">
          <div class="tagline" style="gap:8px">
            <template x-if="!modal.d.result && !attrForm.show">
              <button class="b-pri" @click="openAttr()">归因认定</button>
            </template>
            <template x-if="attrForm.show">
              <button class="b-ghost" @click="attrForm.show = false">收起归因</button>
            </template>
            <span class="muted" x-show="modal.d.result">已归因 · 不可修改</span>
            <button class="b-ghost right" @click="closeModal()">关闭</button>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
