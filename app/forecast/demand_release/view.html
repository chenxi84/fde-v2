<div class="card mt12"><div class="bd" style="padding:0">
  <!-- 过滤区 -->
  <div class="tagline" style="padding:12px 16px;flex-wrap:wrap">
    <b>毛需求发布</b>
    <div class="right tagline" style="gap:8px">
      <select x-model="filterFcstVersion" @change="search()" style="width:120px">
        <option value="">全部版本</option>
        <template x-for="v in versionOptions" :key="v.fcst_version">
          <option :value="v.fcst_version" x-text="v.fcst_version"></option>
        </template>
      </select>
      <div class="chips">
        <template x-for="s in ['', '草稿', '已发布', '已替代']" :key="s || '全部'">
          <span class="fchip" :class="{on: filterStatus === s}" @click="filterStatus = s; search()" x-text="s || '全部'"></span>
        </template>
      </div>
      <input x-model="filterPart" @keydown.enter="search()" placeholder="物料号…" style="width:110px">
      <input x-model="filterPeriod" @keydown.enter="search()" placeholder="期间…" style="width:90px">
      <button class="b-ghost b-sm" @click="search()">搜索</button>
    </div>
  </div>

  <!-- 操作栏 -->
  <div style="padding:0 16px 8px">
    <button class="b-pri b-sm" @click="showCreate()">创建发布草稿</button>
  </div>

  <!-- 表格 -->
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>发布单号</th><th>版本</th><th>状态</th><th>发布人</th><th>发布时间</th><th class="right">操作</th></tr>
      <template x-if="!list.items.length"><tr><td colspan="6" class="empty">无匹配数据</td></tr></template>
      <template x-for="d in list.items" :key="d.rel_no">
        <tr class="data" :class="{'row-muted': d.status === '已替代'}">
          <td><button class="b-link mono" @click="view(d)" x-text="d.rel_no"></button></td>
          <td x-text="d.fcst_version"></td>
          <td><span class="st" :class="'st-' + hue(d.status)" x-text="d.status"></span></td>
          <td x-text="dash(d.publisher)"></td>
          <td x-text="fmtTime(d.published_at)" style="font-size:11px;color:var(--muted)"></td>
          <td class="right rowact">
            <button class="b-pri b-sm" x-show="d.status === '草稿'" @click="view(d)">发布</button>
            <button class="b-ghost b-sm" x-show="d.status === '已发布'" @click="showDiff(d)">差异</button>
          </td>
        </tr>
      </template>
    </table>
  </div>

  <!-- 分页 -->
  <div class="tagline" style="padding:8px 16px" x-show="list.total > 0">
    <span style="font-size:12px;color:var(--muted)">共 <span x-text="list.total"></span> 条</span>
    <div class="right tagline" style="gap:4px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">上一页</button>
      <span style="font-size:12px" x-text="list.page + ' / ' + Math.ceil(list.total / list.size)"></span>
      <button class="b-ghost b-sm" :disabled="list.page * list.size >= list.total" @click="list.load(list.page + 1)">下一页</button>
    </div>
  </div>
</div></div>

<!-- ====== 创建发布草稿弹窗 ====== -->
<div class="modal-mask" x-show="createModal.open" @click.self="createModal.open = false" @keydown.escape.window="createModal.open = false">
  <div class="modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-hd"><b>创建发布草稿</b><button class="x" @click="createModal.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <div class="kv"><label>加工批次 <span style="color:var(--red)">*</span></label><span><input x-model="createModal.prc_batch" placeholder="如 PRC-202601-001" style="width:100%"></span></div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px">从已锁定的加工批次汇总独立需求为初步毛需求（物料×期间）</div>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="doCreateDraft()">确认创建</button></div>
  </div>  <!-- /.modal -->
</div>

<!-- ====== 详情模态（发布单 + 明细行） ====== -->
<div class="modal-mask" x-show="modal.open" @click.self="closeModal()" @keydown.escape.window="closeModal()" x-cloak>
  <div class="modal">
  <div class="modal" style="max-width:800px">
    <template x-if="modal.loading"><div class="loadbox" style="padding:40px;text-align:center">载入明细…</div></template>
    <template x-if="!modal.loading && modal.d">
      <div>
        <div class="modal-hd" style="background:var(--ink);color:#fff">
          <div><div class="docno" x-text="modal.d.rel_no"></div>
            <div class="sub" x-text="modal.d.fcst_version"></div></div>
          <span class="st" :class="'st-' + hue(modal.d.status)" x-text="modal.d.status"></span>
          <button class="x" @click="closeModal()" style="color:#fff">✕</button>
        </div>
        <div class="modal-bd" style="padding:16px">
          <!-- 单头信息 -->
          <div class="sec">发布单信息</div>
          <div class="kv"><label>发布单号</label><span x-text="modal.d.rel_no"></span></div>
          <div class="kv"><label>版本</label><span x-text="modal.d.fcst_version"></span></div>
          <div class="kv"><label>基准期间</label><span x-text="dash(modal.d.base_period)"></span></div>
          <div class="kv"><label>上一版本</label><span x-text="dash(modal.d.prev_rel_no)"></span></div>
          <div class="kv"><label>发布人</label><span x-text="dash(modal.d.publisher)"></span></div>
          <div class="kv"><label>发布时间</label><span x-text="dash(modal.d.published_at)"></span></div>
          <div class="kv"><label>状态</label><span class="st" :class="'st-' + hue(modal.d.status)" x-text="modal.d.status"></span></div>

          <!-- 明细表格 -->
          <div class="sec mt12" x-text="'明细行 (' + (modal.d.lines ? modal.d.lines.length : 0) + ')'"></div>
          <div class="scroll-x">
            <table class="tbl tight">
              <tr><th>行号</th><th>物料</th><th>期间</th><th>初步毛需求</th><th>零件级处理</th><th>一次性</th><th>发布量</th><th>依据</th><th>来源</th></tr>
              <template x-if="!modal.d.lines || !modal.d.lines.length"><tr><td colspan="9" class="empty">无明细行</td></tr></template>
              <template x-for="l in modal.d.lines" :key="l.line_no">
                <tr class="data">
                  <td x-text="l.line_no"></td>
                  <td x-text="l.part_no"></td>
                  <td x-text="l.period"></td>
                  <td x-text="fmt(l.prelim_qty)"></td>
                  <td style="font-size:11px">
                    <template x-for="a in l.part_adj" :key="a.func_type + a.basis">
                      <div style="white-space:nowrap"><span :style="{color: a.qty > 0 ? 'var(--green)' : 'var(--red)'}" x-text="(a.qty > 0 ? '+' : '') + a.qty"></span> <small style="color:var(--muted)" x-text="a.func_type"></small></div>
                    </template>
                    <span x-show="!l.part_adj || !l.part_adj.length">—</span>
                  </td>
                  <td style="font-size:11px">
                    <template x-for="o in l.onetime_items" :key="o.reason">
                      <div style="white-space:nowrap"><span :style="{color: o.qty > 0 ? 'var(--green)' : 'var(--red)'}" x-text="(o.qty > 0 ? '+' : '') + o.qty"></span> <small style="color:var(--muted)" x-text="o.reason"></small></div>
                    </template>
                    <span x-show="!l.onetime_items || !l.onetime_items.length">—</span>
                  </td>
                  <td><b x-text="fmt(l.rel_qty)"></b></td>
                  <td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--muted)" x-text="dash(l.basis)"></td>
                  <td style="font-size:10px;color:var(--muted)">
                    <details x-show="l.lineage && Object.keys(l.lineage).length">
                      <summary>来源</summary>
                      <pre style="font-size:10px" x-text="JSON.stringify(l.lineage, null, 1)"></pre>
                    </details>
                    <span x-show="!l.lineage || !Object.keys(l.lineage).length">—</span>
                  </td>
                </tr>
              </template>
            </table>
          </div>

          <details class="mt12"><summary style="font-size:12px;color:var(--muted);cursor:pointer">原始数据</summary>
            <pre style="font-size:11px;max-height:200px;overflow:auto" x-text="JSON.stringify(modal.d, null, 2)"></pre></details>
        </div>
        <div class="modal-ft" x-show="modal.d">
          <button class="b-pri" x-show="modal.d.status === '草稿'" @click="showPublish()">发布</button>
          <button class="b-pri" x-show="modal.d.status === '草稿'" @click="showAdj()">应用零件级处理</button>
          <button class="b-ghost" x-show="modal.d.status === '已发布'" @click="showOnetime()">附加一次性调整</button>
          <button class="b-ghost" @click="closeModal()">关闭</button>
        </div>
      </div>
    </template>
  </div>  <!-- /.modal -->
</div>

<!-- ====== 应用零件级处理弹窗 ====== -->
<div class="modal-mask" x-show="adjModal.open" @click.self="adjModal.open = false" @keydown.escape.window="adjModal.open = false">
  <div class="modal">
  <div class="modal" style="max-width:440px">
    <div class="modal-hd"><b>应用零件级处理</b><button class="x" @click="adjModal.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <div class="kv"><label>零件号 <span style="color:var(--red)">*</span></label><span><input x-model="adjModal.part_no" placeholder="零件号" style="width:100%"></span></div>
      <div class="kv mt8"><label>期间 <span style="color:var(--red)">*</span></label><span><input x-model="adjModal.period" placeholder="如 2026-01" style="width:100%"></span></div>
      <div class="kv mt8"><label>调整量</label><span><input type="number" x-model="adjModal.adj_qty" step="any" style="width:150px"></span></div>
      <div class="kv mt8"><label>功能类型</label><span>
        <select x-model="adjModal.func_type">
          <option value="通用件合并">通用件合并</option>
          <option value="替换件合并">替换件合并</option>
          <option value="断点处理">断点处理</option>
        </select>
      </span></div>
      <div class="kv mt8"><label>依据 <span style="color:var(--red)">*</span></label><span><input x-model="adjModal.basis" placeholder="调整依据" style="width:100%"></span></div>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="doApplyAdj()">应用</button></div>
  </div>  <!-- /.modal -->
</div>

<!-- ====== 发布确认弹窗 ====== -->
<div class="modal-mask" x-show="publishConfirm.open" @click.self="publishConfirm.open = false" @keydown.escape.window="publishConfirm.open = false">
  <div class="modal">
  <div class="modal" style="max-width:420px">
    <div class="modal-hd"><b>确认发布</b><button class="x" @click="publishConfirm.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <p>发布后将联动锁定快照版本与月度版本。</p>
      <p style="color:var(--amber);font-size:12px">同时标记上一版本为「已替代」。</p>
    </div>
    <div class="modal-ft">
      <button class="b-dng" @click="doPublish()">确认发布</button>
      <button class="b-ghost" @click="publishConfirm.open = false">取消</button>
    </div>
  </div>  <!-- /.modal -->
</div>

<!-- ====== 差异视图弹窗 ====== -->
<div class="modal-mask" x-show="diffModal.open" @click.self="closeDiff()" @keydown.escape.window="closeDiff()" x-cloak>
  <div class="modal">
  <div class="modal" style="max-width:640px">
    <template x-if="diffModal.loading"><div class="loadbox" style="padding:40px;text-align:center">加载中…</div></template>
    <template x-if="!diffModal.loading && diffModal.data">
      <div>
        <div class="modal-hd"><b>差异视图</b><button class="x" @click="closeDiff()">✕</button></div>
        <div class="modal-bd" style="padding:16px">
          <template x-if="diffModal.data.message">
            <div class="empty" x-text="diffModal.data.message"></div>
          </template>
          <template x-if="!diffModal.data.message">
            <div>
              <div class="kv"><label>当前版本</label><span x-text="diffModal.data.rel_no"></span></div>
              <div class="kv"><label>上一版本</label><span x-text="diffModal.data.prev_rel_no"></span></div>
              <div style="font-size:12px;color:var(--muted)" x-text="'变动行数：' + diffModal.data.diff_count"></div>
              <div class="scroll-x mt8">
                <table class="tbl tight">
                  <tr><th>物料</th><th>期间</th><th>当前量</th><th>上期量</th><th>差异</th></tr>
                  <template x-for="d in diffModal.data.diffs" :key="d.part_no + d.period">
                    <tr class="data">
                      <td x-text="d.part_no"></td>
                      <td x-text="d.period"></td>
                      <td x-text="fmt(d.curr)"></td>
                      <td x-text="fmt(d.prev)"></td>
                      <td><span :style="{color: d.diff > 0 ? 'var(--green)' : d.diff < 0 ? 'var(--red)' : ''}" x-text="d.diff > 0 ? '+' + fmt(d.diff) : fmt(d.diff)"></span></td>
                    </tr>
                  </template>
                </table>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>  <!-- /.modal -->
</div>

<!-- ====== 附加一次性调整弹窗（已发布单） ====== -->
<div class="modal-mask" x-show="onetimeModal.open" @click.self="onetimeModal.open = false" @keydown.escape.window="onetimeModal.open = false">
  <div class="modal">
  <div class="modal" style="max-width:440px">
    <div class="modal-hd"><b>附加一次性调整</b><button class="x" @click="onetimeModal.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <div class="kv"><label>零件号 <span style="color:var(--red)">*</span></label><span><input x-model="onetimeModal.part_no" placeholder="零件号" style="width:100%"></span></div>
      <div class="kv mt8"><label>期间 <span style="color:var(--red)">*</span></label><span><input x-model="onetimeModal.period" placeholder="如 2026-01" style="width:100%"></span></div>
      <div class="kv mt8"><label>调整量</label><span><input type="number" x-model="onetimeModal.onetime_adj" step="any" style="width:150px"></span></div>
      <div class="kv mt8"><label>原因 <span style="color:var(--red)">*</span></label><span><input x-model="onetimeModal.reason" placeholder="一次性调整原因" style="width:100%"></span></div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px">仅已发布的发布单可月中附加一次性调整</div>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="doAddOnetime()">附加</button></div>
  </div>  <!-- /.modal -->
</div>
