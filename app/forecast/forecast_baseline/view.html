<div class="card mt12"><div class="bd" style="padding:0">
  <!-- 过滤区 -->
  <div class="tagline" style="padding:12px 16px;flex-wrap:wrap">
    <b>统计基线</b>
    <div class="right tagline" style="gap:8px">
      <select x-model="filterBaseBatch" @change="search()" style="width:120px">
        <option value="">全部批次</option>
        <template x-for="b in batchOptions" :key="b">
          <option :value="b" x-text="b"></option>
        </template>
      </select>
      <select x-model="filterOem" @change="search()" style="width:140px">
        <option value="">全部客户</option>
        <template x-for="c in custOptions" :key="c.oem_code + c.plant_code">
          <option :value="c.oem_code" x-text="c.oem_code + ' ' + c.oem_name"></option>
        </template>
      </select>
      <input x-model="filterPart" @keydown.enter="search()" placeholder="零件号…" style="width:110px">
      <div class="chips">
        <template x-for="s in ['', '预计算', '已确认']" :key="s || '全部'">
          <span class="fchip" :class="{on: filterStatus === s}" @click="filterStatus = s; search()" x-text="s || '全部'"></span>
        </template>
      </div>
      <div class="chips">
        <template x-for="p in ['', '时序外推', '借用']" :key="p || '全部'">
          <span class="fchip" :class="{on: filterPath === p}" @click="filterPath = p; search()" x-text="p || '全部路径'"></span>
        </template>
      </div>
      <button class="b-ghost b-sm" @click="search()">搜索</button>
    </div>
  </div>

  <!-- 操作栏 -->
  <div style="padding:0 16px 8px;display:flex;gap:8px">
    <button class="b-pri b-sm" @click="showGen()">生成基线</button>
    <button class="b-ghost b-sm" @click="showConfirmBatch(list.items[0])" x-show="list.items.length && filterBaseBatch">确认整批</button>
  </div>

  <!-- 表格 -->
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>批次</th><th>客户</th><th>物料</th><th>期间</th><th>基线值</th><th>路径</th><th>方法</th><th>状态</th><th class="right">操作</th></tr>
      <template x-if="!list.items.length"><tr><td colspan="9" class="empty">无匹配数据</td></tr></template>
      <template x-for="d in list.items" :key="d.base_batch + d.oem_code + d.plant_code + d.part_no + d.period">
        <tr class="data" :class="{'row-dng': d.base_path === '借用'}">
          <td x-text="d.base_batch" style="font-size:11px;color:var(--muted)"></td>
          <td><span x-text="d.oem_code"></span><small style="color:var(--muted)" x-text="'/'+d.plant_code"></small></td>
          <td><button class="b-link mono" @click="view(d)" x-text="d.part_no"></button></td>
          <td x-text="d.period"></td>
          <td x-text="fmt(d.base_qty)"></td>
          <td><span class="st" :class="'st-' + hue(d.base_path)" x-text="d.base_path"></span></td>
          <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--muted)" :title="d.base_method" x-text="dash(d.base_method)"></td>
          <td><span class="st" :class="'st-' + hue(d.status)" x-text="d.status"></span></td>
          <td class="right rowact">
            <button class="b-pri b-sm" x-show="d.status === '预计算'" @click="confirmRow(d)">确认</button>
            <button class="b-ghost b-sm" @click="showMethod(d)">调方法</button>
          </td>
        </tr>
      </template>
    </table>
  </div>

  <!-- 分页 -->
  <div class="tagline" style="padding:8px 16px" x-show="list.total > 0">
    <span style="font-size:12px;color:var(--muted)">共 <span x-text="list.total"></span> 条</span>
    <div class="right tagline" style="gap:4px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">上一页</button>
      <span style="font-size:12px" x-text="list.page + ' / ' + Math.ceil(list.total / list.size)"></span>
      <button class="b-ghost b-sm" :disabled="list.page * list.size >= list.total" @click="list.load(list.page + 1)">下一页</button>
    </div>
  </div>
</div></div>

<!-- Generate 弹窗 -->
<div class="modal-mask" x-show="genModal.open" @click.self="genModal.open = false" @keydown.escape.window="genModal.open = false">
  <div class="modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-hd"><b>生成基线</b><button class="x" @click="genModal.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <div class="kv"><label>基线批次 <span style="color:var(--red)">*</span></label><span><input x-model="genModal.base_batch" placeholder="如 BL-202601" style="width:100%"></span></div>
      <div class="kv mt8"><label>预测版本 <span style="color:var(--red)">*</span></label><span><input x-model="genModal.fcst_version" placeholder="如 202601" style="width:100%"></span></div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px">从快照版本数据自动生成基线行集（时序外推/借用）</div>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="doGenerate()">确认生成</button></div>
  </div>  <!-- /.modal -->
</div>

<!-- 调整方法弹窗 -->
<div class="modal-mask" x-show="methodModal.open" @click.self="methodModal.open = false" @keydown.escape.window="methodModal.open = false">
  <div class="modal">
  <div class="modal" style="max-width:440px">
    <div class="modal-hd"><b>调整方法 / 参数</b><button class="x" @click="methodModal.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <template x-if="methodModal.d">
        <div>
          <div class="kv"><label>物料</label><span x-text="methodModal.d.part_no + ' / ' + methodModal.d.period"></span></div>
          <div class="kv mt8"><label>方法描述 <span style="color:var(--red)">*</span></label>
            <span><textarea x-model="methodModal.base_method" rows="3" style="width:100%" placeholder="变更须登记依据"></textarea></span>
          </div>
        </div>
      </template>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="doUpdateMethod()">保存</button></div>
  </div>  <!-- /.modal -->
</div>

<!-- 确认整批弹窗 -->
<div class="modal-mask" x-show="confirmBatchModal.open" @click.self="confirmBatchModal.open = false" @keydown.escape.window="confirmBatchModal.open = false">
  <div class="modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-hd"><b>确认整批</b><button class="x" @click="confirmBatchModal.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <div class="kv"><label>批次</label><span x-text="confirmBatchModal.base_batch"></span></div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px">将该批次全部「预计算」行确认为「已确认」状态</div>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="doConfirmBatch()">确认整批</button></div>
  </div>  <!-- /.modal -->
</div>

<!-- 详情模态 -->
<div class="modal-mask" x-show="modal.open" @click.self="closeModal()" @keydown.escape.window="closeModal()" x-cloak>
  <div class="modal">
  <div class="modal" style="max-width:580px">
    <template x-if="modal.loading"><div class="loadbox" style="padding:40px;text-align:center">载入明细…</div></template>
    <template x-if="!modal.loading && modal.d">
      <div>
        <div class="modal-hd" style="background:var(--ink);color:#fff">
          <div><div class="docno" x-text="modal.d.base_batch"></div>
            <div class="sub" x-text="modal.d.part_no + ' / ' + modal.d.period"></div></div>
          <span class="st" :class="'st-' + hue(modal.d.status)" x-text="modal.d.status"></span>
          <button class="x" @click="closeModal()" style="color:#fff">✕</button>
        </div>
        <div class="modal-bd" style="padding:16px">
          <div class="sec">基本信息</div>
          <div class="kv"><label>基线批次</label><span x-text="modal.d.base_batch"></span></div>
          <div class="kv"><label>预测版本</label><span x-text="dash(modal.d.fcst_version)"></span></div>
          <div class="kv"><label>客户</label><span x-text="modal.d.oem_code + ' / ' + modal.d.plant_code"></span></div>
          <div class="kv"><label>物料</label><span x-text="modal.d.part_no"></span></div>
          <div class="kv"><label>期间</label><span x-text="modal.d.period"></span></div>
          <div class="sec mt12">基线数据</div>
          <div class="kv"><label>基线值</label><span x-text="fmt(modal.d.base_qty)"></span></div>
          <div class="kv"><label>基线路径</label><span class="st" :class="'st-' + hue(modal.d.base_path)" x-text="modal.d.base_path"></span></div>
          <div class="kv"><label>基线方法</label><span x-text="dash(modal.d.base_method)"></span></div>
          <div class="kv"><label>交叉校验</label><span x-text="dash(modal.d.cross_chk)"></span></div>
          <div class="sec mt12">参考信息</div>
          <div class="kv"><label>项目号</label><span x-text="dash(modal.d.project_no)"></span></div>
          <div class="kv"><label>车型</label><span x-text="dash(modal.d.veh_model)"></span></div>
          <div class="sec mt12">元数据</div>
          <div class="kv"><label>生成人</label><span x-text="dash(modal.d.generator)"></span></div>
          <div class="kv"><label>状态</label><span class="st" :class="'st-' + hue(modal.d.status)" x-text="modal.d.status"></span></div>
          <details class="mt12"><summary style="font-size:12px;color:var(--muted);cursor:pointer">原始数据</summary>
            <pre style="font-size:11px;max-height:200px;overflow:auto" x-text="JSON.stringify(modal.d, null, 2)"></pre></details>
        </div>
        <div class="modal-ft" x-show="modal.d">
          <button class="b-pri" x-show="modal.d.status === '预计算'" @click="confirmRow(modal.d); closeModal()">确认</button>
          <button class="b-ghost" @click="showMethod(modal.d)">调整方法</button>
          <button class="b-ghost" @click="closeModal()">关闭</button>
        </div>
      </div>
    </template>
  </div>  <!-- /.modal -->
</div>
