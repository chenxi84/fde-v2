<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px;flex-wrap:wrap">
    <b>物料主数据</b>
    <div class="right tagline" style="gap:8px">
      <input x-model="filterPart" @keydown.enter="search()" placeholder="零件号…" style="width:120px">
      <input x-model="filterName" @keydown.enter="search()" placeholder="名称…" style="width:120px">
      <div class="chips">
        <template x-for="t in ['', '成品', '半成品']" :key="t || '全部'">
          <span class="fchip" :class="{on: filterType === t}" @click="filterType = t; search()" x-text="t || '全部'"></span>
        </template>
      </div>
      <button class="b-ghost b-sm" @click="search()">搜索</button>
    </div>
  </div>
  <div style="padding:0 16px 8px"><button class="b-pri b-sm" @click="showCreate()">+ 新建物料</button></div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>零件号</th><th>名称</th><th>单位</th><th>物料类型</th><th class="right">操作</th></tr>
      <template x-if="!list.items.length"><tr><td colspan="5" class="empty">无匹配数据</td></tr></template>
      <template x-for="d in list.items" :key="d.part_no">
        <tr class="data">
          <td><button class="b-link mono" @click="view(d)" x-text="d.part_no"></button></td>
          <td x-text="d.part_name"></td>
          <td x-text="d.uom"></td>
          <td><span class="st" :class="'st-' + hue(d.mat_type || '其他')" x-text="dash(d.mat_type)"></span></td>
          <td class="right rowact">
            <button class="b-pri b-sm" @click="view(d); setTimeout(() => showEdit(), 200)">编辑</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:8px 16px" x-show="list.total > 0">
    <span style="font-size:12px;color:var(--muted)">共 <span x-text="list.total"></span> 条</span>
    <div class="right tagline" style="gap:4px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">上一页</button>
      <span style="font-size:12px" x-text="list.page + ' / ' + Math.ceil(list.total / list.size)"></span>
      <button class="b-ghost b-sm" :disabled="list.page * list.size >= list.total" @click="list.load(list.page + 1)">下一页</button>
    </div>
  </div>
</div></div>

<div class="modal-mask" x-show="modal.open" @click.self="closeModal()">
  <div class="modal" style="max-width:480px">
    <template x-if="modal.loading"><div class="loadbox" style="padding:40px;text-align:center">加载中…</div></template>
    <template x-if="!modal.loading && modal.d">
      <div>
        <div class="modal-hd" style="background:var(--ink);color:#fff">
          <span><b x-text="modal.d.part_no"></b></span>
          <button class="b-ghost" style="color:#fff" @click="closeModal()">✕</button>
        </div>
        <div class="modal-bd" style="padding:16px">
          <div class="kv"><label>零件号</label><span x-text="modal.d.part_no"></span></div>
          <div class="kv"><label>名称</label><span x-text="modal.d.part_name"></span></div>
          <div class="kv"><label>单位</label><span x-text="modal.d.uom"></span></div>
          <div class="kv"><label>物料类型</label><span class="st" :class="'st-' + hue(modal.d.mat_type || '其他')" x-text="dash(modal.d.mat_type)"></span></div>
          <details class="mt12"><summary style="font-size:12px;color:var(--muted);cursor:pointer">原始数据</summary>
            <pre style="font-size:11px;max-height:200px;overflow:auto" x-text="JSON.stringify(modal.d, null, 2)"></pre>
          </details>
        </div>
        <div class="modal-ft"><button class="b-pri" @click="showEdit()">编辑</button><button class="b-ghost" @click="closeModal()">关闭</button></div>
      </div>
    </template>
  </div>  <!-- /.modal -->
</div>

<div class="modal-mask" x-show="form.open" @click.self="form.open = false">
  <div class="modal" style="max-width:480px">
    <div class="modal-hd"><b x-text="form.mode === 'create' ? '新建物料' : '编辑物料'"></b><button class="b-ghost" @click="form.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <div class="kv"><label>零件号 ★</label><span><input x-model="form.part_no" :disabled="form.mode === 'edit'" style="width:100%"></span></div>
      <div class="kv"><label>名称 ★</label><span><input x-model="form.part_name" style="width:100%"></span></div>
      <div class="kv"><label>单位 ★</label><span><input x-model="form.uom" style="width:100%"></span></div>
      <div class="kv"><label>物料类型</label><span>
        <select x-model="form.mat_type"><option value="">--</option><option value="成品">成品</option><option value="半成品">半成品</option></select>
      </span></div>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="save()">保存</button><button class="b-ghost" @click="form.open = false">取消</button></div>
  </div>  <!-- /.modal -->
</div>
