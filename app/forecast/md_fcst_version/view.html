<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px;flex-wrap:wrap">
    <b>月度版本</b>
    <div class="right tagline" style="gap:8px">
      <span style="font-size:11px;color:var(--muted)">按版本号降序</span>
    </div>
  </div>
  <div style="padding:0 16px 8px"><button class="b-pri b-sm" @click="showCreate()">+ 新建版本</button></div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>版本号</th><th>锚定期间</th><th>预测期间</th><th>Opening日</th><th>状态</th><th>关联批次</th><th class="right">操作</th></tr>
      <template x-if="!list.items.length"><tr><td colspan="7" class="empty">暂无版本数据</td></tr></template>
      <template x-for="d in list.items" :key="d.fcst_version">
        <tr class="data">
          <td><button class="b-link mono" @click="view(d)" x-text="d.fcst_version"></button></td>
          <td x-text="d.base_period"></td>
          <td>
            <template x-if="Array.isArray(d.periods) && d.periods.length">
              <span style="display:flex;gap:4px;flex-wrap:wrap">
                <template x-for="(p, i) in d.periods" :key="i">
                  <span class="st st-slate" style="font-size:11px" x-text="'M+' + (i + 1) + ' ' + p"></span>
                </template>
              </span>
            </template>
            <span x-show="!Array.isArray(d.periods) || !d.periods.length" x-text="dash()"></span>
          </td>
          <td x-text="dash(d.opening_date)"></td>
          <td><span class="st" :class="'st-' + hue(d.status)" x-text="d.status"></span></td>
          <td x-text="dash(d.linked_batch)"></td>
          <td class="right rowact">
            <button class="b-ghost b-sm" x-show="d.status === '活跃'" @click="showLock(d)">锁定</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:8px 16px" x-show="list.total > 0">
    <span style="font-size:12px;color:var(--muted)">共 <span x-text="list.total"></span> 条</span>
    <div class="right tagline" style="gap:4px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">上一页</button>
      <span style="font-size:12px" x-text="list.page + ' / ' + Math.ceil(list.total / list.size)"></span>
      <button class="b-ghost b-sm" :disabled="list.page * list.size >= list.total" @click="list.load(list.page + 1)">下一页</button>
    </div>
  </div>
</div></div>

<div class="modal-mask" x-show="modal.open" @click.self="closeModal()">
  <div class="modal" style="max-width:520px">
    <template x-if="modal.loading"><div class="loadbox" style="padding:40px;text-align:center">加载中…</div></template>
    <template x-if="!modal.loading && modal.d">
      <div>
        <div class="modal-hd" style="background:var(--ink);color:#fff">
          <span><b x-text="modal.d.fcst_version"></b></span>
          <span class="st" :class="'st-' + hue(modal.d.status)" x-text="modal.d.status" style="margin-left:8px"></span>
          <button class="b-ghost" style="color:#fff" @click="closeModal()">✕</button>
        </div>
        <div class="modal-bd" style="padding:16px">
          <div class="sec">基本信息</div>
          <div class="kv"><label>版本号</label><span x-text="modal.d.fcst_version"></span></div>
          <div class="kv"><label>锚定期间</label><span x-text="modal.d.base_period"></span></div>
          <div class="kv"><label>Opening日</label><span x-text="dash(modal.d.opening_date)"></span></div>
          <div class="sec">预测期间</div>
          <div style="padding:4px 0">
            <template x-if="Array.isArray(modal.d.periods) && modal.d.periods.length">
              <div style="display:flex;flex-direction:column;gap:4px">
                <template x-for="(p, i) in modal.d.periods" :key="i">
                  <div class="kv"><label x-text="'M+' + (i + 1)"></label><span x-text="p"></span></div>
                </template>
              </div>
            </template>
            <span x-show="!Array.isArray(modal.d.periods) || !modal.d.periods.length" x-text="dash()"></span>
          </div>
          <div class="sec">状态信息</div>
          <div class="kv"><label>状态</label><span class="st" :class="'st-' + hue(modal.d.status)" x-text="modal.d.status"></span></div>
          <div class="kv"><label>关联批次</label><span x-text="dash(modal.d.linked_batch)"></span></div>
          <details class="mt12"><summary style="font-size:12px;color:var(--muted);cursor:pointer">原始数据</summary>
            <pre style="font-size:11px;max-height:200px;overflow:auto" x-text="JSON.stringify(modal.d, null, 2)"></pre>
          </details>
        </div>
        <div class="modal-ft" style="display:flex;gap:8px">
          <button class="b-pri" x-show="modal.d.status === '活跃'" @click="closeModal(); showLock(modal.d)">锁定</button>
          <button class="b-ghost" @click="closeModal()">关闭</button>
        </div>
      </div>
    </template>
  </div>  <!-- /.modal -->
</div>

<div class="modal-mask" x-show="form.open" @click.self="form.open = false">
  <div class="modal" style="max-width:480px">
    <div class="modal-hd"><b>新建月度版本</b><button class="b-ghost" @click="form.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <div class="kv"><label>版本号 ★</label><span><input x-model="form.fcst_version" placeholder="如 202608" maxlength="6" style="width:100%"></span></div>
      <div class="kv"><label>锚定期间 ★</label><span><input x-model="form.base_period" @input="recalcPeriods()" placeholder="如 2026-08" style="width:100%"></span></div>
      <div class="kv"><label>预测期间</label>
        <span>
          <template x-if="computedPeriods.length">
            <span style="display:flex;gap:4px;flex-wrap:wrap">
              <template x-for="(p, i) in computedPeriods" :key="i">
                <span class="st st-slate" style="font-size:11px" x-text="'M+' + (i + 1) + ' ' + p"></span>
              </template>
            </span>
          </template>
          <span x-show="!computedPeriods.length" style="color:var(--muted);font-size:12px">输入锚定期间后自动推算 M+1~M+3</span>
        </span>
      </div>
      <div class="kv"><label>Opening日</label><span><input type="date" x-model="form.opening_date" style="width:100%"></span></div>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="save()">创建</button><button class="b-ghost" @click="form.open = false">取消</button></div>
  </div>  <!-- /.modal -->
</div>

<div class="modal-mask" x-show="lockForm.open" @click.self="lockForm.open = false">
  <div class="modal" style="max-width:400px">
    <div class="modal-hd"><b>锁定版本</b><button class="b-ghost" @click="lockForm.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <div class="kv"><label>版本号</label><span x-text="lockForm.fcst_version" style="font-weight:bold"></span></div>
      <div class="kv"><label>R版发布单号</label><span><input x-model="lockForm.rel_no" placeholder="选填" style="width:100%"></span></div>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="doLock()">确认锁定</button><button class="b-ghost" @click="lockForm.open = false">取消</button></div>
  </div>  <!-- /.modal -->
</div>
