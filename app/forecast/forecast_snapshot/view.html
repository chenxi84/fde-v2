<div class="card mt12"><div class="bd" style="padding:0">
  <!-- 过滤区 -->
  <div class="tagline" style="padding:12px 16px;flex-wrap:wrap">
    <b>预测快照</b>
    <div class="right tagline" style="gap:8px">
      <select x-model="filterVersion" @change="search()" style="width:120px">
        <option value="">全部版本</option>
        <template x-for="v in versionOptions" :key="v.fcst_version">
          <option :value="v.fcst_version" x-text="v.fcst_version"></option>
        </template>
      </select>
      <select x-model="filterOem" @change="search()" style="width:140px">
        <option value="">全部客户</option>
        <template x-for="c in custOptions" :key="c.oem_code + c.plant_code">
          <option :value="c.oem_code" x-text="c.oem_code + ' ' + c.oem_name"></option>
        </template>
      </select>
      <input x-model="filterPart" @keydown.enter="search()" placeholder="零件号…" style="width:120px">
      <input x-model="filterPeriod" @keydown.enter="search()" placeholder="期间…" style="width:100px">
      <div class="chips">
        <template x-for="s in ['', '正常', 'OEM未提供']" :key="s || '全部'">
          <span class="fchip" :class="{on: filterFlag === s}" @click="filterFlag = s; search()" x-text="s || '全部'"></span>
        </template>
      </div>
      <button class="b-ghost b-sm" @click="search()">搜索</button>
    </div>
  </div>

  <!-- 操作栏 -->
  <div style="padding:0 16px 8px">
    <button class="b-pri b-sm" @click="showOpening()">📅 月度 Opening</button>
  </div>

  <!-- 表格 -->
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>版本</th><th>客户</th><th>物料</th><th>期间</th><th>偏移</th><th>预测量</th><th>标记</th><th>来源</th><th class="right">操作</th></tr>
      <template x-if="!list.items.length"><tr><td colspan="9" class="empty">无匹配数据</td></tr></template>
      <template x-for="d in list.items" :key="d.fcst_version + d.oem_code + d.plant_code + d.part_no + d.period">
        <tr class="data">
          <td x-text="d.fcst_version"></td>
          <td><span x-text="d.oem_code"></span><small style="color:var(--muted)" x-text="'/'+d.plant_code"></small></td>
          <td><button class="b-link mono" @click="view(d)" x-text="d.part_no"></button></td>
          <td x-text="d.period"></td>
          <td x-text="d.offset"></td>
          <td x-text="fmt(d.orig_qty)"></td>
          <td><span class="st" :class="'st-' + hue(d.data_flag)" x-text="d.data_flag"></span></td>
          <td x-text="d.source_channel" style="font-size:11px;color:var(--muted)"></td>
          <td class="right rowact">
            <button class="b-pri b-sm" x-show="d.data_flag === 'OEM未提供'" @click="showFill(d)">填预测</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <!-- 分页 -->
  <div class="tagline" style="padding:8px 16px" x-show="list.total > 0">
    <span style="font-size:12px;color:var(--muted)">共 <span x-text="list.total"></span> 条</span>
    <div class="right tagline" style="gap:4px">
      <button class="b-ghost b-sm" :disabled="list.page <= 1" @click="list.load(list.page - 1)">上一页</button>
      <span style="font-size:12px" x-text="list.page + ' / ' + Math.ceil(list.total / list.size)"></span>
      <button class="b-ghost b-sm" :disabled="list.page * list.size >= list.total" @click="list.load(list.page + 1)">下一页</button>
    </div>
  </div>
</div></div>

<!-- Opening 弹窗 -->
<div class="modal-mask" x-show="openingModal.open" @click.self="openingModal.open = false">
  <div class="modal" style="max-width:400px">
    <div class="modal-hd"><b>月度 Opening</b><button class="b-ghost" @click="openingModal.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <div class="kv"><label>版本号</label><span><input x-model="openingModal.fcst_version" placeholder="YYYYMM" style="width:100%"></span></div>
      <div style="font-size:12px;color:var(--muted)">将按活跃零件集自动生成 N+1/N+2/N+3 三行（均标记"未提供"）</div>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="doOpen()">确认 Opening</button></div>
  </div>  <!-- /.modal -->
</div>

<!-- 详情模态 -->
<div class="modal-mask" x-show="modal.open" @click.self="closeModal()">
  <div class="modal" style="max-width:640px">
    <template x-if="modal.loading"><div class="loadbox" style="padding:40px;text-align:center">加载中…</div></template>
    <template x-if="!modal.loading && modal.d">
      <div>
        <div class="modal-hd" style="background:var(--ink);color:#fff">
          <span><b x-text="modal.d.part_no"></b> · <span class="st" :class="'st-' + hue(modal.d.data_flag)" x-text="modal.d.data_flag"></span></span>
          <button class="b-ghost" style="color:#fff" @click="closeModal()">✕</button>
        </div>
        <div class="modal-bd" style="padding:16px">
          <div class="sec">基本信息</div>
          <div class="kv"><label>版本</label><span x-text="modal.d.fcst_version"></span></div>
          <div class="kv"><label>客户</label><span x-text="modal.d.oem_code + ' / ' + modal.d.plant_code"></span></div>
          <div class="kv"><label>物料</label><span x-text="modal.d.part_no"></span></div>
          <div class="kv"><label>期间</label><span x-text="modal.d.period"></span></div>
          <div class="kv"><label>偏移</label><span x-text="modal.d.offset"></span></div>
          <div class="sec mt12">预测数据</div>
          <div class="kv"><label>预测量</label><span x-text="fmt(modal.d.orig_qty)"></span></div>
          <div class="kv"><label>数据标记</label><span class="st" :class="'st-' + hue(modal.d.data_flag)" x-text="modal.d.data_flag"></span></div>
          <div class="kv"><label>来源渠道</label><span x-text="dash(modal.d.source_channel)"></span></div>
          <div class="sec mt12">参考信息</div>
          <div class="kv"><label>项目号</label><span x-text="dash(modal.d.project_no)"></span></div>
          <div class="kv"><label>车型</label><span x-text="dash(modal.d.veh_model)"></span></div>
          <div class="kv"><label>接收日期</label><span x-text="dash(modal.d.recv_date)"></span></div>
          <div class="kv"><label>收集人</label><span x-text="dash(modal.d.collector)"></span></div>
          <details class="mt12"><summary style="font-size:12px;color:var(--muted);cursor:pointer">原始数据</summary>
            <pre style="font-size:11px;max-height:200px;overflow:auto" x-text="JSON.stringify(modal.d, null, 2)"></pre>
          </details>

          <!-- 填预测子表单 -->
          <template x-if="fillForm.open && modal.d.data_flag === 'OEM未提供'">
            <div class="mt12" style="border:1px solid var(--border);border-radius:8px;padding:12px">
              <b>填预测</b>
              <div class="kv mt8"><label>预测量 ★</label><span><input type="number" x-model="fillForm.orig_qty" style="width:150px"></span></div>
              <div class="kv"><label>数据标记</label><span>
                <select x-model="fillForm.data_flag">
                  <option value="正常">正常</option><option value="OEM未提供">OEM未提供</option>
                </select>
              </span></div>
              <div class="kv"><label>来源渠道</label><span>
                <select x-model="fillForm.source_channel">
                  <option value="EDI">EDI</option><option value="OEM门户">OEM门户</option>
                  <option value="邮件Excel">邮件Excel</option><option value="销售转录">销售转录</option>
                </select>
              </span></div>
              <button class="b-pri b-sm mt8" @click="doFill()">确认录入</button>
            </div>
          </template>
        </div>
        <div class="modal-ft">
          <button class="b-pri" x-show="modal.d && modal.d.data_flag === 'OEM未提供' && !fillForm.open" @click="showFill(modal.d)">填预测</button>
          <button class="b-ghost" @click="closeModal()">关闭</button>
        </div>
      </div>
    </template>
  </div>  <!-- /.modal -->
</div>
