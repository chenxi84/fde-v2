<!-- ====== 批次列表视图 ====== -->
<template x-if="viewMode === 'batches'">
<div>
<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px;flex-wrap:wrap">
    <b>加工批次</b>
    <div class="right tagline" style="gap:8px">
      <select x-model="filterFcstVersion" @change="searchBatches()" style="width:120px">
        <option value="">全部版本</option>
        <template x-for="v in versionOptions" :key="v.fcst_version">
          <option :value="v.fcst_version" x-text="v.fcst_version"></option>
        </template>
      </select>
      <div class="chips">
        <template x-for="s in ['', '进行中', '全部核定', '已锁定']" :key="s || '全部'">
          <span class="fchip" :class="{on: filterBatchStatus === s}" @click="filterBatchStatus = s; searchBatches()" x-text="s || '全部'"></span>
        </template>
      </div>
    </div>
  </div>
  <div style="padding:0 16px 8px">
    <button class="b-pri b-sm" @click="showCreate()">创建加工批次</button>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>批次号</th><th>基线批次</th><th>版本</th><th>状态</th><th>负责人</th><th>创建时间</th><th class="right">操作</th></tr>
      <template x-if="!listBatches.items.length"><tr><td colspan="7" class="empty">无匹配数据</td></tr></template>
      <template x-for="d in listBatches.items" :key="d.prc_batch">
        <tr class="data">
          <td><button class="b-link mono" @click="viewBatch(d)" x-text="d.prc_batch"></button></td>
          <td x-text="d.base_batch" style="font-size:11px;color:var(--muted)"></td>
          <td x-text="d.fcst_version"></td>
          <td><span class="st" :class="'st-' + hue(d.status)" x-text="d.status"></span></td>
          <td x-text="dash(d.owner)"></td>
          <td x-text="fmtTime(d.created_at)" style="font-size:11px;color:var(--muted)"></td>
          <td class="right rowact">
            <button class="b-pri b-sm" x-show="d.status !== '已锁定'" @click="viewBatch(d)">明细</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:8px 16px" x-show="listBatches.total > 0">
    <span style="font-size:12px;color:var(--muted)">共 <span x-text="listBatches.total"></span> 条</span>
    <div class="right tagline" style="gap:4px">
      <button class="b-ghost b-sm" :disabled="listBatches.page <= 1" @click="listBatches.load(listBatches.page - 1)">上一页</button>
      <span style="font-size:12px" x-text="listBatches.page + ' / ' + Math.ceil(listBatches.total / listBatches.page_size)"></span>
      <button class="b-ghost b-sm" :disabled="listBatches.page * listBatches.page_size >= listBatches.total" @click="listBatches.load(listBatches.page + 1)">下一页</button>
    </div>
  </div>
</div></div>
</div>
</template>

<!-- ====== 明细行视图 ====== -->
<template x-if="viewMode === 'lines'">
<div>
<div class="card mt12"><div class="bd" style="padding:0">
  <div class="tagline" style="padding:12px 16px;flex-wrap:wrap">
    <b x-text="'加工批次 · ' + (currentBatch ? currentBatch.prc_batch : '')"></b>
    <button class="b-ghost b-sm" @click="backToBatches()">« 返回批次列表</button>
    <span class="st ml8" x-show="currentBatch" :class="'st-' + hue(currentBatch.status)" x-text="currentBatch.status"></span>
    <div class="right tagline" style="gap:8px">
      <select x-model="filterLineOem" @change="searchLines()" style="width:140px">
        <option value="">全部客户</option>
        <template x-for="c in custOptions" :key="c.oem_code + c.plant_code">
          <option :value="c.oem_code" x-text="c.oem_code + ' ' + c.oem_name"></option>
        </template>
      </select>
      <input x-model="filterLinePart" @keydown.enter="searchLines()" placeholder="零件号…" style="width:110px">
      <div class="chips">
        <template x-for="s in ['', '通过', '退回', '_未核定']" :key="s || '全部'">
          <span class="fchip" :class="{on: filterLineChk === (s === '_未核定' ? '' : s)}"
            @click="filterLineChk = (s === '_未核定' ? '' : s); searchLines()"
            x-text="s === '_未核定' ? '未核定' : (s || '全部')"></span>
        </template>
      </div>
    </div>
  </div>
  <div style="padding:0 16px 8px;display:flex;gap:8px">
    <button class="b-pri b-sm" x-show="currentBatch && currentBatch.status !== '已锁定'" @click="doFinalize()">锁定</button>
    <button class="b-ghost b-sm" x-show="currentBatch && currentBatch.status !== '已锁定'" @click="showOnetime()">附加一次性行</button>
  </div>
  <div class="scroll-x">
    <table class="tbl tight">
      <tr><th>客户</th><th>物料</th><th>期间</th><th>基线值</th><th>客户预测</th><th>置信度调整</th><th>趋势调整</th><th>一次性调整</th><th>独立需求</th><th>核定</th><th class="right">操作</th></tr>
      <template x-if="!listLines.items.length"><tr><td colspan="11" class="empty">无匹配数据</td></tr></template>
      <template x-for="d in listLines.items" :key="d.oem_code + d.plant_code + d.part_no + d.period">
        <tr class="data" :class="{'row-dng': d.chk_result === '退回'}">
          <td><span x-text="d.oem_code"></span><small style="color:var(--muted)" x-text="'/'+d.plant_code"></small></td>
          <td><button class="b-link mono" @click="viewLine(d)" x-text="d.part_no"></button></td>
          <td x-text="d.period"></td>
          <td x-text="fmt(d.base_qty)"></td>
          <td x-text="fmt(d.cust_qty)"></td>
          <td x-text="d.conf_adj ? (d.conf_adj > 0 ? '+' : '') + fmt(d.conf_adj) : dash(d.conf_adj)"></td>
          <td x-text="d.trend_adj ? (d.trend_adj > 0 ? '+' : '') + fmt(d.trend_adj) : dash(d.trend_adj)"></td>
          <td><span x-text="d.onetime_adj ? (d.onetime_adj > 0 ? '+' : '') + fmt(d.onetime_adj) : dash(d.onetime_adj)"></span>
            <small x-show="d.onetime_tag" style="color:var(--muted);font-size:10px" x-text="d.onetime_tag"></small></td>
          <td><b x-text="fmt(d.indep_qty)"></b></td>
          <td><span class="st" :class="'st-' + (d.chk_result === '通过' ? 'green' : d.chk_result === '退回' ? 'red' : 'slate')" x-text="d.chk_result || '未核定'"></span></td>
          <td class="right rowact">
            <button class="b-pri b-sm" x-show="currentBatch && currentBatch.status !== '已锁定'" @click="viewLine(d)">填调整</button>
            <button class="b-ghost b-sm" x-show="currentBatch && currentBatch.status !== '已锁定'" @click="showReview(d)">核定</button>
          </td>
        </tr>
      </template>
    </table>
  </div>
  <div class="tagline" style="padding:8px 16px" x-show="listLines.total > 0">
    <span style="font-size:12px;color:var(--muted)">共 <span x-text="listLines.total"></span> 条</span>
    <div class="right tagline" style="gap:4px">
      <button class="b-ghost b-sm" :disabled="listLines.page <= 1" @click="listLines.load(listLines.page - 1)">上一页</button>
      <span style="font-size:12px" x-text="listLines.page + ' / ' + Math.ceil(listLines.total / listLines.page_size)"></span>
      <button class="b-ghost b-sm" :disabled="listLines.page * listLines.page_size >= listLines.total" @click="listLines.load(listLines.page + 1)">下一页</button>
    </div>
  </div>
</div></div>
</div>
</template>

<!-- ====== 创建批次弹窗 ====== -->
<div class="modal-mask" x-show="createModal.open" @click.self="createModal.open = false" @keydown.escape.window="createModal.open = false">
  <div class="modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-hd"><b>创建加工批次</b><button class="x" @click="createModal.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <div class="kv"><label>基线批次 <span style="color:var(--red)">*</span></label><span><input x-model="createModal.base_batch" placeholder="如 BL-202601" style="width:100%"></span></div>
      <div class="kv mt8"><label>预测版本 <span style="color:var(--red)">*</span></label><span><input x-model="createModal.fcst_version" placeholder="如 202601" style="width:100%"></span></div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px">从基线行集展开为加工明细，初始独立需求 = 基线值</div>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="doCreateBatch()">确认创建</button></div>
  </div>  <!-- /.modal -->
</div>

<!-- ====== 明细行编辑模态 ====== -->
<div class="modal-mask" x-show="modal.open" @click.self="closeModal()" @keydown.escape.window="closeModal()" x-cloak>
  <div class="modal">
  <div class="modal" style="max-width:600px">
    <template x-if="modal.loading"><div class="loadbox" style="padding:40px;text-align:center">载入明细…</div></template>
    <template x-if="!modal.loading && modal.d">
      <div>
        <div class="modal-hd" style="background:var(--ink);color:#fff">
          <div><div class="docno" x-text="modal.d.part_no"></div>
            <div class="sub" x-text="modal.d.oem_code + ' / ' + modal.d.plant_code + ' · ' + modal.d.period"></div></div>
          <span class="st" :class="'st-' + (modal.d.chk_result === '通过' ? 'green' : modal.d.chk_result === '退回' ? 'red' : 'slate')" x-text="modal.d.chk_result || '未核定'"></span>
          <button class="x" @click="closeModal()" style="color:#fff">✕</button>
        </div>
        <div class="modal-bd" style="padding:16px">
          <!-- 只读数据 -->
          <div class="sec">只读数据（系统计算）</div>
          <div class="kv"><label>基线值</label><span x-text="fmt(modal.d.base_qty)"></span></div>
          <div class="kv"><label>客户预测</label><span x-text="fmt(modal.d.cust_qty)"></span></div>
          <div class="kv"><label>独立需求</label><span><b x-text="fmt(modal.d.indep_qty)"></b></span></div>

          <template x-if="currentBatch && currentBatch.status !== '已锁定'">
          <div>
            <!-- 填调整入口 -->
            <template x-if="!fillForm.open">
              <button class="b-pri b-sm mt12" @click="showFill()">填调整</button>
            </template>

            <!-- 填调整表单 -->
            <template x-if="fillForm.open">
              <div class="mt12" style="border:1px solid var(--border);border-radius:8px;padding:12px">
                <b>填调整</b>
                <div class="sec mt8">置信度调整</div>
                <div class="kv"><label>置信度调整</label><span><input type="number" x-model="fillForm.conf_adj" step="any" style="width:150px"></span></div>
                <div class="kv"><label>原因</label><span><input x-model="fillForm.conf_reason" placeholder="调整不为0时必填" style="width:100%"></span></div>
                <div class="sec mt8">趋势调整</div>
                <div class="kv"><label>趋势调整</label><span><input type="number" x-model="fillForm.trend_adj" step="any" style="width:150px"></span></div>
                <div class="kv"><label>原因</label><span><input x-model="fillForm.trend_reason" placeholder="调整不为0时必填" style="width:100%"></span></div>
                <div class="sec mt8">一次性调整</div>
                <div class="kv"><label>一次性调整</label><span><input type="number" x-model="fillForm.onetime_adj" step="any" style="width:150px"></span></div>
                <div class="kv"><label>原因</label><span><input x-model="fillForm.onetime_reason" placeholder="调整不为0时必填" style="width:100%"></span></div>
                <div class="kv"><label>标签</label><span>
                  <select x-model="fillForm.onetime_tag">
                    <option value="一次性">一次性</option>
                    <option value="大一次性">大一次性</option>
                    <option value="断点">断点</option>
                  </select>
                </span></div>
                <div class="mt8" style="background:var(--bg);padding:8px;border-radius:4px">
                  <span style="font-size:12px;color:var(--muted)">独立需求预览：</span>
                  <b x-text="fmt((modal.d.base_qty || 0) + (Number(fillForm.conf_adj) || 0) + (Number(fillForm.trend_adj) || 0) + (Number(fillForm.onetime_adj) || 0))"></b>
                  <small style="color:var(--muted)"> = 基线 + 置信度 + 趋势 + 一次性</small>
                </div>
                <button class="b-pri b-sm mt8" @click="doFill()">确认录入</button>
              </div>
            </template>
          </div>
          </template>

          <details class="mt12"><summary style="font-size:12px;color:var(--muted);cursor:pointer">原始数据</summary>
            <pre style="font-size:11px;max-height:200px;overflow:auto" x-text="JSON.stringify(modal.d, null, 2)"></pre></details>
        </div>
        <div class="modal-ft" x-show="modal.d">
          <template x-if="currentBatch && currentBatch.status !== '已锁定'">
            <button class="b-pri" x-show="!fillForm.open" @click="showFill()">填调整</button>
          </template>
          <button class="b-ghost" @click="closeModal()">关闭</button>
        </div>
      </div>
    </template>
  </div>  <!-- /.modal -->
</div>

<!-- ====== 核定弹窗 ====== -->
<div class="modal-mask" x-show="reviewModal.open" @click.self="reviewModal.open = false" @keydown.escape.window="reviewModal.open = false">
  <div class="modal">
  <div class="modal" style="max-width:440px">
    <div class="modal-hd"><b>核定</b><button class="x" @click="reviewModal.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <template x-if="reviewModal.d">
        <div>
          <div class="kv"><label>物料</label><span x-text="reviewModal.d.part_no + ' / ' + reviewModal.d.period"></span></div>
          <div class="kv mt8"><label>独立需求</label><span><b x-text="fmt(reviewModal.d.indep_qty)"></b></span></div>
          <div class="kv mt8"><label>核定结论</label><span>
            <select x-model="reviewModal.chk_result">
              <option value="通过">通过</option>
              <option value="退回">退回</option>
            </select>
          </span></div>
          <div class="kv mt8" x-show="reviewModal.chk_result === '退回'"><label>退回理由 <span style="color:var(--red)">*</span></label>
            <span><textarea x-model="reviewModal.chk_comment" rows="2" style="width:100%" placeholder="退回必须附理由"></textarea></span></div>
        </div>
      </template>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="doReview()">确认核定</button></div>
  </div>  <!-- /.modal -->
</div>

<!-- ====== 附加一次性行弹窗 ====== -->
<div class="modal-mask" x-show="onetimeModal.open" @click.self="onetimeModal.open = false" @keydown.escape.window="onetimeModal.open = false">
  <div class="modal">
  <div class="modal" style="max-width:460px">
    <div class="modal-hd"><b>附加一次性行</b><button class="x" @click="onetimeModal.open = false">✕</button></div>
    <div class="modal-bd" style="padding:16px">
      <div class="kv"><label>客户 <span style="color:var(--red)">*</span></label><span><input x-model="onetimeModal.oem_code" placeholder="OEM编码" style="width:100%"></span></div>
      <div class="kv mt8"><label>工厂 <span style="color:var(--red)">*</span></label><span><input x-model="onetimeModal.plant_code" placeholder="工厂编码" style="width:100%"></span></div>
      <div class="kv mt8"><label>零件号 <span style="color:var(--red)">*</span></label><span><input x-model="onetimeModal.part_no" placeholder="零件号" style="width:100%"></span></div>
      <div class="kv mt8"><label>期间 <span style="color:var(--red)">*</span></label><span><input x-model="onetimeModal.period" placeholder="如 2026-01" style="width:100%"></span></div>
      <div class="kv mt8"><label>一次性调整</label><span><input type="number" x-model="onetimeModal.onetime_adj" step="any" style="width:150px"></span></div>
      <div class="kv mt8"><label>原因 <span style="color:var(--red)">*</span></label><span><input x-model="onetimeModal.onetime_reason" placeholder="调整原因必填" style="width:100%"></span></div>
      <div class="kv mt8"><label>标签</label><span>
        <select x-model="onetimeModal.onetime_tag">
          <option value="一次性">一次性</option>
          <option value="大一次性">大一次性</option>
          <option value="断点">断点</option>
        </select>
      </span></div>
    </div>
    <div class="modal-ft"><button class="b-pri" @click="doAddOnetime()">附加</button></div>
  </div>  <!-- /.modal -->
</div>
